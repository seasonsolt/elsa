  /* The melody to follow, as a row of coloured dots at the top of the room (the companion shows it too, this one stays). */
  function tyBuildStrip(box) {
    const m = game.melody;
    if (!m || !Array.isArray(m.seq) || !m.seq.length) return;
    const n = m.seq.length, w = n * 30 + 14, x0 = 560 - w / 2;
    const g = el('g', { transform: `translate(${x0} 8)` }, box);

      el('circle', { r: 11, fill: TY_NOTE_COL[(k | 0) - 1] || '#fff', stroke: '#ffffff', 'stroke-width': 2.5 }, s);
      for (let d = 0; d < (k | 0); d++) el('circle', { cx: (d - (k - 1) / 2) * 4.2, cy: 1, r: 1.5, fill: '#fff', opacity: .9 }, s);

  }

  /* ---------- frame ---------- */
  function tyHandle(e) {
    const who = e.who && game.sisters[e.who];
    switch (e.type) {
      case 'slide': {   // the logic can repeat this while a sister rides a bumpy run of ramps: one puff and whoosh per second is plenty
        const t = performance.now(), k = 'slide' + e.who;
        if (t - (tyState.lines[k] || -1e9) < 1000) break;
        tyState.lines[k] = t;
        if (who) tyPuff('dust', who.x + who.w / 2, who.y + who.h, 44, .45);
        try { if (typeof whoosh === 'function') whoosh(false); } catch (err) {}

      case 'bounce': {
        const sp = tyState.springs.find(s => s.c === e.c && s.r === e.r) || (who && tyState.springs.find(s => Math.abs((s.c + .5) * T - (who.x + who.w / 2)) < T && Math.abs((s.r + 1) * T - (who.y + who.h)) < T * 1.6));

        const hit = tyState.notes.filter(s => s.c === e.c && s.r === e.r);
        for (const s of hit.length ? hit : tyState.notes.filter(s => s.n === n)) { if (e.ok === false) s.wob = .4; else { s.flash = .8; tyBurst((s.c + .5) * T, s.r * T, 'star', 3, 70); } }

        break;

      case 'melody':
        for (const s of tyState.notes) { s.flash = 1.4; tyBurst((s.c + .5) * T, s.r * T, 'star', 4, 100); }
        tySfx('unlock');
        tyToyLine('melody');
        break;
      case 'clear': case 'win':

        break;

        if (f) { f.target = 2; f.celebrated = true; tyBurst((f.c + .5) * T, (f.r + .4) * T, 'heart', 5, 90); tyPuff('ring', (f.c + .5) * T, (f.r + .5) * T, 60, .55); }

        if (e.to) { tyPuff('ring', e.to.x, e.to.y - 10, 46, .45); tyBurst(e.to.x, e.to.y - 10, 'star', 4, 70); }

  function tyUpdateSprings(dt) {

      const p = 1 - s.t / .42, squash = s.t > 0 && p < .38;
      tyShow(s.f0, !squash); tyShow(s.f1, squash);

    }
  }
  function tyUpdateNotes(dt, now) {
    const done = game.melody && (game.melody.done || (game.melody.seq && game.melody.pos >= game.melody.seq.length));
    for (const s of tyState.notes) {
      s.flash = Math.max(0, s.flash - dt); s.wob = Math.max(0, s.wob - dt);

    }
  }
  function tyUpdateFlowers(dt, now) {
    const list = game.flowers;
    tyState.flowers.forEach((f, i) => {
      const src = Array.isArray(list) ? list[i] : null;
      if (src && src.open && f.target !== 2) {   // opened without an event reaching us: still celebrate
        f.target = 2;
        if (!f.celebrated) { tyBurst((f.c + .5) * T, (f.r + .4) * T, 'heart', 5, 90); f.celebrated = true; }

      if (f.target === 2 && f.stage < 2) { f.stage = Math.min(2, f.stage + dt / .3); if (f.stage >= 2) f.pop = .5; }

  }
  function tyUpdateFloes(dt, now) {

    const seen = new Set();
    for (const fl of list) {
      seen.add(fl.id);
      const w = fl.w;   // px, x / y = top-left, one tile tall (logic.js)
      let f = tyState.floes.get(fl.id);
      if (!f) {
        const live = layer('toysLive', 'shadows');
        const g = el('g', {}, live);
        const art = el('g', {}, g);
        tyFloeArt(art, w);
        const frost = el('g', { opacity: 0 }, g);

        for (let x = 14; x < w; x += 30) el('path', { d: `M${x} 8v12M${x - 5} 14h10M${x - 3.5} 10.5l7 7M${x + 3.5} 10.5l-7 7`, stroke: '#3a9ad9', 'stroke-width': 2, 'stroke-linecap': 'round', fill: 'none' }, frost);
        f = { g, frost, w, k: 0, cx: 0, cy: 0, prevPaused: false };

      f.cx = fl.x + w / 2; f.cy = fl.y + T / 2;

  function tyFloeArt(art, w) {
    el('g', {}, art).appendChild(tyVector(w));
    const cells = Math.max(1, Math.round(w / T)), names = ['floe_l', 'floe_m', 'floe_r'];
    let left = names.length, dead = false;
    for (const nm of names) tyProbe(nm, ok => {
      if (!ok) dead = true;
      if (--left || dead) return;
      art.textContent = '';
      for (let i = 0; i < cells; i++) {
        const nm2 = cells === 1 ? 'floe_m' : i === 0 ? 'floe_l' : i === cells - 1 ? 'floe_r' : 'floe_m';

    const names = ['bunny_idle', 'bunny_hop1', 'bunny_hop2', 'bunny_hop3', 'bunny_hop4', 'bunny_home'];
    return names.map((nm, i) => {
      const f = tyPic(g, nm, -24, -36, 48, 36, n => tyBunnyShape(n, i === 5 ? 5 : i));
      tyShow(f, i === 0);
      return f;
    });
  }
  function tyUpdateBunnies(dt, now) {
    const list = Array.isArray(game.bunnies) ? game.bunnies : [];
    const seen = new Set();
    for (const b of list) {
      seen.add(b.id);
      const fx = b.x, fy = b.y;   // logic.js: x = centre, y = feet, in px
      let v = tyState.bunnies.get(b.id);
      if (!v) {
        const live = layer('toysLive', 'shadows');
        const g = el('g', {}, live);
        const halo = el('circle', { r: 26, cy: -12, fill: 'url(#cool)' }, g);
        el('ellipse', { rx: 11, ry: 3, cy: 1, fill: '#10184a', opacity: .28 }, g);
        const body = el('g', {}, g);
        v = { g, halo, body, frames: tyBunnyFrames(body), prevX: fx, prevY: fy, phase: 0, state: b.state, shown: 0, shake: Math.random() * 5 };
        tyState.bunnies.set(b.id, v);

      if (b.state !== v.state) {   // a change of state is always worth a sparkle
        if (b.state === 'follow') { tyBurst(fx, fy - 12, 'star', 5, 90); tyPuff('ring', fx, fy - 12, 50, .45); }
        else if (b.state === 'home') { tyBurst(fx, fy - 12, 'heart', 7, 90); tyPuff('ring', fx, fy - 12, 60, .6); }
        v.state = b.state;

      v.prevX = fx; v.prevY = fy;

      if (b.state === 'home') f = 5;
      else if (Math.abs(dx) > .15 || Math.abs(dy) > .4) {

        f = Math.abs(dy) > .6 ? (dy < 0 ? 2 : 3) : 1 + Math.floor(v.phase) % 4;
      }
      if (f !== v.shown) { tyShow(v.frames[v.shown], false); tyShow(v.frames[f], true); v.shown = f; }
      const lost = b.state === 'lost' || b.state === undefined;
      const shiver = lost && Math.sin(now * .9 + v.shake) > .92 ? Math.sin(now * 55) * 1.2 : 0;
      const breath = f === 0 ? 1 + Math.sin(now * 2.6 + v.shake) * .025 : 1;
      v.g.setAttribute('transform', `translate(${(fx + shiver).toFixed(1)} ${fy.toFixed(1)})`);
      v.body.setAttribute('transform', `scale(${(b.dir < 0 ? -1 : 1)} ${breath.toFixed(3)})`);
      v.halo.setAttribute('visibility', lost ? 'visible' : 'hidden');
      v.halo.setAttribute('opacity', (.55 + Math.sin(now * 3 + v.shake) * .3).toFixed(2));
    }
    for (const [id, v] of tyState.bunnies) if (!seen.has(id)) { v.g.remove(); tyState.bunnies.delete(id); }
  }
  function tyUpdateStrip(now) {
    const s = tyState.strip, m = game.melody;
    if (!s) return;
    s.g.setAttribute('visibility', game.state === 'play' ? 'visible' : 'hidden');
    if (!m || !Array.isArray(m.seq)) return;
    const sig = m.pos + '/' + m.seq.length;
    s.chips.forEach((c, i) => {
      const done = i < m.pos, next = i === m.pos;

  function updateToys(dt, now) {
    tyTee();
    while (tyQueue.length) { const e = tyQueue.shift(); try { tyHandle(e); } catch (err) { console.error('[toys]', err); } }
    if (!tyState.strip && game.melody && game.melody.seq && game.melody.seq.length) tyBuildStrip(layer('toyHud', 'hud'));
    tyUpdateSprings(dt);
    tyUpdateNotes(dt, now);
    tyUpdateFlowers(dt, now);

    tyUpdateStrip(now);

  /* Sisters: every frame is an already-loaded image, shown one at a time. */
  const SPRITE = 84 / 170;   // game units per stored pixel; the elder sister stands 84 tall

    }

  }

  const BLINK_FADE = .38;   // seconds a sister takes to fade back in after a magic blink

  const reunited = () => typeof heart !== 'undefined' && heart && heart.togetherT > .5;
  const celebrating = () => game.state === 'clear' || game.state === 'win';
  /* The sister the player steers in solo mode, null in duo. */
  const playerId = () => (game.mode === 'solo' ? 'frost' : null);

  function pickFrame(id, s, v, now) {

      for (const id of Object.keys(wordLog)) out[id] = Object.assign({}, wordLog[id]);
      return out;
    }
    function logRoomWords(lv) {
      if (!isDev() || !lv || !lv.words) return;
      const rows = lv.words.map(w => ({ word: w, heard: (wordLog[w] || {})[lv.id] || 0, target: 8, ok: ((wordLog[w] || {})[lv.id] || 0) >= 8 }));
      try { console.log('word exposure, room ' + lv.id); console.table(rows); } catch (e) {}
    }

    /* Per-room talk state, rebuilt on every 'load' event */
    let room = null, clock = 0, snowExtra = null;
    const freshRoom = () => ({

    function talkOnEvents(events, g) {

          case 'collect': onCollect(e, g); break;
          case 'respawn': onRespawn(e, g); break;
          case 'open': say('open_' + (curLevel() || {}).id, { tag: 'open', maxWait: 8000 }); break;
          case 'memory': onMemory(e, g); break;
          case 'swap': room.idleT = 0; break;
          case 'clear':
            logRoomWords(curLevel());
            // a room with no door (the garden) never emits 'open': its "everything is open" line plays as the room clears

    function onLoad(g) {

    function onCollect(e) {
      if (e.kind === '+') {
        const n = Math.min(5, e.n || ++room.stars);

        say('star_' + n, { tag: 'star', maxWait: 2500 });
        return;
      }
      const w = KIND_WORD[e.kind] || e.word;
      if (!w) return;
      const k = room.picks[w] = (room.picks[w] || 0) + 1;
      voice.word(w);   // the bare word first (interrupts a pick line still running), then the companion's sentence
      say(`pick_${w}_${(k - 1) % 3 + 1}`, { tag: 'pick', maxWait: 3500 });
    }
    function onRespawn(e, g) {
      if (g.mode === 'solo' && e.who !== g.player) return;   // the AI sister is never the one being comforted
      const t = nowSec();
      if (t - room.splashAt < 5) return;
      room.splashAt = t;

        memNode.remove(); memNode = null;
      }

      if (!def) return;

      else voice.line(key, { interrupt: true, priority: 2 });
    }
    function plainText(def) {
      return [def.say.map(s => typeof s === 'string' ? s : s.w !== undefined ? ((voice.wordInfo(s.w) || {}).en || s.w) : s.en).join('')];
    }

    /* ---- per-frame work; safe to call more than once a frame (the second call sees dt ~ 0) ---- */
    function tick(g) {
      g = g || game;
      if (!room) room = freshRoom();
      const t = nowSec(), dt = clock ? Math.min(.1, t - clock) : 0;
      if (!clock || dt > .0005) {
        clock = t;
        if (g.state === 'play' && !storyOpen()) { stepStart(g, t); stepIdle(g, dt, t); stepMood(g, dt); }
        stepMemory(g, t);
      }
      placeBubble(g);
    }
    function stepStart(g, t) {
      const lv = curLevel();
      if (!room.preloaded && lv && audio) {
        room.preloaded = true;
        const keys = [...lv.words.map(w => 'word_' + w), 'open_' + lv.id, 'star_1', 'star_2', 'star_3', 'splash_1', 'splash_2'];
        for (let n = 1; hasLine(`start_${lv.id}_${n}`); n++) keys.unshift(`start_${lv.id}_${n}`);
        for (const w of lv.words) for (let n = 1; n <= 3; n++) if (hasLine(`pick_${w}_${n}`)) keys.push(`pick_${w}_${n}`);

      }
      if (!room.startPending) return;

      for (let n = 1; hasLine(`start_${lv.id}_${n}`); n++) keys.push(`start_${lv.id}_${n}`);
      if (!keys.length) return;

    /* The child stands still: after 3 s a gentle nudge from the companion, at most 3 in a row, 10 s apart. Solo only. */
    function stepIdle(g, dt, t) {
      const s = g.sisters[g.player || 'frost'], inp = (g.input && g.input[g.player || 'frost']) || {};
      if (!s) return;
      const sig = [Math.round(s.x), Math.round(s.y), g.progress, inp.l ? 1 : 0, inp.r ? 1 : 0].join();
      if (sig !== room.sig) { room.sig = sig; room.idleT = 0; room.idleN = 0; return; }
      room.idleT += dt;
      if (g.mode !== 'solo' || room.starting || (typeof playFlow === 'object' && playFlow.tutoring) || room.idleN >= 3 || room.idleT < 3 || t < room.idleNext || voice.busy || t - room.spokeAt < 4) return;
      const k = pickN('idle_', room.idleLast);
      if (!k) return;
      room.idleLast = k; room.idleN++; room.idleNext = t + 10;
      say('idle_' + k, { priority: 0, tag: 'idle', maxWait: 500 });
    }

    /* Mood, softened: the further apart the sisters drift the heavier the snow falls and the louder the wind; no shivering,
       a gentle call across the castle, and hearts when they meet again. */
    function stepMood(g, dt) {
      const f = g.sisters.frost, n = g.sisters.nuan;
      const d = Math.hypot(f.x - n.x, (f.y + f.h - n.y - n.h) * .7);
      const target = Math.min(1, Math.max(0, (d - 220) / 280));
      heart.mood += (target - heart.mood) * Math.min(1, dt * (target > heart.mood ? .4 : 1.3));
      const chill = $('chill'), front = $('snowFront');
      if (chill) chill.setAttribute('opacity', (heart.mood * .3).toFixed(2));
      if (front) {
        front.setAttribute('opacity', (.55 + heart.mood * .45).toFixed(2));
        if (!snowExtra && heart.mood > .2 && typeof fillSnow === 'function') { snowExtra = el('g', { opacity: 0 }, front); fillSnow(snowExtra, 14, true); }
        if (snowExtra) snowExtra.setAttribute('opacity', Math.min(1, heart.mood * 1.3).toFixed(2));
      }
      if ((heart.windT -= dt) < 0) { heart.windT = .3; windMood(heart.mood); }
      if (heart.mood > .4) heart.apart = true;
      // far apart for a few seconds: the companion calls out once (key = the sister being called, i.e. the player)
      if (g.mode === 'solo' && heart.mood > .55) {
        room.farT += dt;
        if (room.farT > 3.5 && !room.farSpoken) { room.farSpoken = true; say('miss_' + (g.player || 'frost'), { tag: 'miss', maxWait: 1500 }); }
        if (room.farT > 25) { room.farT = 0; room.farSpoken = false; }
      } else if (heart.mood < .2) { room.farT = 0; room.farSpoken = false; }
      const still = s => s.ground && Math.abs(s.vx) < 1 && !s.splash;
      if (d < 58 && still(f) && still(n)) {
        heart.togetherT += dt;
        if (heart.togetherT > 1.2) {
          if (heart.apart) {
            heart.apart = false;
            const k = room.togetherN++ % Math.max(1, countKeys('together_')) + 1;
            say('together_' + k, { interrupt: true, tag: 'together', maxWait: 3000 });
          }
          if ((heart.puffT -= dt) <= 0) { heart.puffT = 1.8; if (typeof burst === 'function') burst((f.x + n.x + f.w) / 2, Math.min(f.y, n.y) - 4, 'heart', 1, 26); }
        }
      } else heart.togetherT = 0;
    }

    /* ---- the speech bubble: subtitles on, a line from a sister, play in progress ---- */
    const bubble = { who: '', segs: null, rows: 0, w: 0, fade: 0 };
    const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const cw = c => c.charCodeAt(0) > 255 ? 15 : 8.4;
    function rowsOf(segs, max) {
      const rows = [[]]; let w = 0;
      for (const s of segs) {
        let buf = '';
        const flush = () => { if (buf) rows[rows.length - 1].push({ text: buf, en: s.en }); buf = ''; };
        for (const ch of s.text) {
          if (w + cw(ch) > max && !'，。、！？：；」…—,.!?'.includes(ch) && ch !== ' ') { flush(); rows.push([]); w = 0; }
          buf += ch; w += cw(ch);
        }

      }
      return rows.filter(r => r.length);
    }
    function showBubble(p) {
      const box = $('talk');
      if (!box) return;
      const frost = p.who === 'frost', fill = frost ? '#eef6ff' : '#fff3df', line = frost ? '#8fb6ea' : '#e2a45e', ink = frost ? '#1b2559' : '#4a2c05', en = frost ? '#2d6bd1' : '#c4520a';
      const rows = rowsOf(p.segments, 360);
      if (!rows.length) return;
      const w = Math.max(...rows.map(r => r.reduce((n, s) => n + [...s.text].reduce((m, c) => m + cw(c), 0), 0))) + 34, h = rows.length * 20 + 14;
      const text = rows.map((r, i) => `<text x="0" y="${-h + 24 + i * 20}" text-anchor="middle" font-size="15" fill="${ink}">${r.map(s => s.en ? `<tspan fill="${en}" font-weight="700">${esc(s.text)}</tspan>` : esc(s.text)).join('')}</text>`).join('');
      box.innerHTML = `<g id="bubble"><g id="bubbleTail"><path d="M-8 0L0 11L8 0Z" fill="${fill}" stroke="${line}" stroke-width="1.5"/></g>
        <rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="${line}" stroke-width="1.5"/>
        <g id="bubbleCover"><path d="M-7 -1L7 -1" stroke="${fill}" stroke-width="3"/></g>${text}</g>`;

    }
    function hideBubble() { const box = $('talk'); if (box) box.textContent = ''; bubble.who = ''; }
    voice.onSubtitle(p => {

      const box = $('talk'), b = bubble.who ? $('bubble') : null;

      if (!b) return;
      if (bubble.gone && nowSec() - bubble.gone > .5) { hideBubble(); return; }
      const s = g.sisters[bubble.who];
      if (!s) return;
      const x = s.x + s.w / 2, y = s.y + s.h - (bubble.who === 'frost' ? 84 : 76) - 10;   // just above the painted head
      const bx = Math.max(bubble.w / 2 + 8, Math.min(952 - bubble.w / 2, x)), off = (x - bx).toFixed(1);
      b.setAttribute('transform', `translate(${bx.toFixed(1)} ${Math.max(bubble.h + 10, y).toFixed(1)})`);
      $('bubbleTail').setAttribute('transform', `translate(${off} 0)`);
      $('bubbleCover').setAttribute('transform', `translate(${off} 0)`);

    /* ---- memory fragment: the glow only; logic picks it up and emits 'memory' (see onMemory) ---- */
    function drawMemory() {
      const box = $('memory');
      if (!box) return;
      box.textContent = '';
      memNode = null;
      const lv = curLevel(), mem = lv && lv.memory;
      if (!mem || memGot[game.index] || game.memoryFound) return;
      const [c, r] = mem;
      memNode = el('g', { 'data-x': c * T + T / 2, 'data-y': r * T + T / 2 }, box);

      img('fx_star', -13, -13, 26, 26, memNode);

    function stepMemory(g, t) {
      if (!memNode) return;
      if (g.memoryFound) { memNode.remove(); memNode = null; return; }
      const mx = +memNode.dataset.x, my = +memNode.dataset.y;
      memNode.setAttribute('transform', `translate(${mx} ${(my + Math.sin(t * 2) * 4).toFixed(1)}) scale(${(1 + Math.sin(t * 3.1) * .08).toFixed(3)})`);
    }

    const spoken = { game: new Set(), room: new Set() };
    function speak(key, delay, perRoom) {   // old API: a line once per game / per room
      const set = perRoom ? spoken.room : spoken.game;
      if (set.has(key) || !hasLine(key)) return;
      set.add(key);
      setTimeout(() => voice.line(key), (delay || 0) * 1000);

  })();
  function talkOnEvents(events, g) { return TK.talkOnEvents(events, g); }
  function countWordHeard(id) { return TK.countWordHeard(id); }
  function wordStats() { return TK.wordStats(); }
  function drawMemory() { return TK.drawMemory(); }

  /* ---- old entry points, kept so callers that were not rewritten still run ---- */
  function speak(key, delay, perRoom) { TK.speak(key, delay, perRoom); }
  function resetTalk() { TK.resetTalk(); }
  function drawTalk() { TK.tick(game); }
  function updateMood() { TK.tick(game); }
  function updateMemory() { TK.tick(game); }
  /* ===== d1 / view-ui: story pages and the blocking scenes (chapter card, recall, clear page + quiz, ending) =====
     Every scene is picture + voice. `story` stays truthy while a blocking scene is open, so the main loop can keep the game
     paused exactly like before. Helpers (uxButton, uxWordCard, ...) live in 70-ui.js and are only called at run time. */
  let story = null;

  /* The prologue: 3 pages, picture + one narrator line each (lines p1..p3 name their art in lines.json). */
  const PROLOGUE = [
    { vo: 'p1', get art() { return uxLineArt('p1', 'story_prologue'); } },
    { vo: 'p2', get art() { return uxLineArt('p2', 'story_winter'); } },
    { vo: 'p3', get art() { return uxLineArt('p3', 'key'); } },
  ];

  /* Keys while a scene is open: Space / Enter / Escape do the scene's main action; game keys never leak through. */
  addEventListener('keydown', e => {
    const modal = uxState.modal;
    if (!modal && !story) return;
    uxWake();
    const t = e.target, onBtn = t && t.classList && t.classList.contains && (t.classList.contains('ux-btn') || t.classList.contains('ux-card') || t.classList.contains('ux-tile'));
    if (modal) {
      if (e.code === 'Escape') { e.preventDefault(); $('modal').textContent = ''; uxState.modal = null; }
      else if (!onBtn && e.code !== 'F11' && !e.metaKey && !e.ctrlKey) e.stopImmediatePropagation();
      return;
    }
    if (onBtn && (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter')) return;
    if (['Enter', 'NumpadEnter', 'Space', 'Escape'].includes(e.code)) {
      e.preventDefault(); e.stopImmediatePropagation();
      if (!e.repeat) advanceStory();
    } else if (!e.metaKey && !e.ctrlKey && e.code !== 'F11') e.stopImmediatePropagation();
  }, true);

  /* ---------- story pages ---------- */
  /* pages: [{ art, vo }] (art: image name, vo: voice line key). Older fields (title, lines, next) are ignored: no reading. */
  function openStory(pages, done) {
    const s = uxScreen('story', true);
    s.pages = pages; s.i = 0; s.done = done; s.onKey = () => uxStoryNext(s);
    uxInputReset();
    renderStory();
  }
  function advanceStory() { if (story && story.onKey) story.onKey(); }
  function uxStoryNext(s) {
    if (!uxAlive(s)) return;
    uxStopVoice();
    s.i++;
    if (s.i < s.pages.length) { renderStory(); return; }
    uxEnd(s, s.done);
  }
  function uxEnd(s, done) {
    if (!uxAlive(s)) return;
    uxState.tok = null; story = null;
    uxStopVoice();
    $('overlay').textContent = '';
    if (done) done();
  }
  function renderStory() {
    const s = story;
    if (!s || s.name !== 'story') return;
    const p = s.pages[s.i], n = s.pages.length, me = s.i;
    const art = p.art || (p.vo && uxLineArt(p.vo));
    const dots = n > 1 ? s.pages.map((_, k) => `<circle cx="${480 + (k - (n - 1) / 2) * 18}" cy="492" r="${k === me ? 6 : 4.5}" fill="${k === me ? '#ffd27a' : '#8090d6'}"/>`).join('') : '';
    const root = uxPaint(`<g class="page">
      ${art ? `<image href="${SRC(art)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>` : '<rect width="960" height="520" fill="#141c52"/>'}
      <rect y="360" width="960" height="160" fill="url(#bottomFade)"/>${dots}
      ${uxButton({ act: 'next', ui: 'next', icon: 'next', x: 880, y: 456, r: 38, plate: 'gold' })}</g>`);
    uxBind(root, { next: () => uxStoryNext(s) });
    if (p.vo) uxLine(p.vo).then(() => { if (uxAlive(s) && s.i === me) { const b = root.querySelector('[data-act="next"]'); if (b) b.classList.add('ux-pulse'); } });
    else root.querySelector('[data-act="next"]').classList.add('ux-pulse');
  }

  /* ---------- chapter card ---------- */
  function uxCardRow(words, y, w, h, gap, extra) {
    const n = words.length, x0 = (960 - (n * w + (n - 1) * gap)) / 2;
    return words.map((wd, k) => uxWordCard(wd, Object.assign({ x: x0 + k * (w + gap), y, w, h, slot: k }, extra && extra(wd, k)))).join('');
  }
  const uxPopSlot = (root, k) => { const n = root.querySelector(`[data-pop="${k}"]`); if (n) n.classList.add('show'); return n; };

  /* Room picture, one narrator sentence, then the 3 words pop up one by one: "this level we look for heart", "say it", 1.5 s ear/mouth pause. */
  function showChapter(level, done) {
    const lv = uxLevel(level), words = uxRoomWords(lv), s = uxScreen('chapter', true);
    uxInputReset();
    const n = words.length, cw = 190, gap = 26, x0 = (960 - (n * cw + (n - 1) * gap)) / 2;
    const root = uxPaint(`<g class="page"><image href="${SRC(uxLineArt('ch_' + lv.id, lv.bg))}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect y="220" width="960" height="300" fill="url(#bottomFade)"/>
      ${uxCardRow(words, 296, cw, 190, gap)}
      <g id="uxCue" opacity="0" class="ux-soft"><g id="uxEar">${uxIcon('ear', 30)}</g><g id="uxMouth" visibility="hidden" class="ux-bounce">${uxIcon('mouth', 30)}</g></g>
      ${uxButton({ act: 'go', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}</g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { go: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    const cue = root.querySelector('#uxCue'), ear = root.querySelector('#uxEar'), mouth = root.querySelector('#uxMouth');
    const setCue = (k, kind) => {
      cue.setAttribute('transform', `translate(${x0 + k * (cw + gap) + cw / 2} 262)`);
      cue.setAttribute('opacity', kind ? 1 : 0);
      ear.setAttribute('visibility', kind === 'ear' ? 'visible' : 'hidden');
      mouth.setAttribute('visibility', kind === 'mouth' ? 'visible' : 'hidden');
    };
    (async () => {
      await uxLine('ch_' + lv.id);
      for (let k = 0; k < n; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page'); setCue(k, 'ear');
        await uxLine('learn_' + words[k].id);
        if (!uxAlive(s)) return;
        setCue(k, 'mouth');
        await uxWait(1500);
        if (!uxAlive(s)) return;
        setCue(k, null);
        await uxWait(250);
      }
      if (!uxAlive(s)) return;
      const b = root.querySelector('[data-act="go"]'); if (b) b.classList.add('ux-pulse');
    })();
  }

  /* ---------- recall (start of the next room) ---------- */
  function showRecall(prevLevel, done) {
    const lv = prevLevel == null ? null : uxLevel(prevLevel), words = lv ? uxRoomWords(lv) : [];
    if (!lv || !words.length) { if (done) done(); return; }
    const s = uxScreen('recall', true);
    uxInputReset();
    const root = uxPaint(`<g class="page"><image href="${SRC(lv.bg)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".5"/>
      ${uxCardRow(words, 140, 200, 230, 30)}
      ${uxButton({ act: 'skip', ui: 'next', icon: 'next', x: 886, y: 452, r: 34 })}</g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { skip: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    (async () => {
      for (let k = 0; k < words.length; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page');
        await uxLine('recall_' + words[k].id);
        await uxWait(200);
      }
      await uxWait(500);
      finish();
    })();

  /* ---------- clear page: stars, word cards, quiz ---------- */

      el.addEventListener('click', ev => { ev.stopPropagation(); uxWake(); uxSfx('click'); if (el.getAttribute('tabindex') === '-1') el.blur(); onClick(el, ev); });
      el.addEventListener('keydown', ev => {
        if ((ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') && !ev.repeat) { ev.preventDefault(); ev.stopPropagation(); el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
      });
    }
    return el;
  }
  /* Wire every .ux-btn / .ux-tile / .ux-card under root: data-act picks the handler out of acts, data-ui is the spoken name. */
  function uxBind(root, acts) {
    root.querySelectorAll('.ux-btn, .ux-tile, .ux-card').forEach(n => {
      const act = n.dataset.act, fn = acts && acts[act];
      hoverable(n, n.dataset.ui, fn ? (el, ev) => fn(el, ev) : null);
    });
  }
  function uxNudge(el) {
    if (!el) return;
    el.classList.remove('ux-wig'); void el.getBoundingClientRect(); el.classList.add('ux-wig');
  }
  /* Press-and-hold: the ring fills for ms, then fn runs. Releasing early cancels. */
  function uxHold(el, ms, fn) {
    if (!el || el.__uxHold) return;
    el.__uxHold = true;
    let t = null;
    const start = ev => {
      if (ev.button) return;
      ev.stopPropagation(); uxWake();
      if (el.getAttribute('tabindex') === '-1' && ev.preventDefault) ev.preventDefault();
      el.style.setProperty('--hold', ms + 'ms'); el.classList.add('ux-hold');
      clearTimeout(t);
      t = setTimeout(() => { t = null; el.classList.remove('ux-hold'); fn(); }, ms);
    };
    const stop = () => { if (t) { clearTimeout(t); t = null; } el.classList.remove('ux-hold'); };
    el.addEventListener('pointerdown', start);
    for (const n of ['pointerup', 'pointerleave', 'pointercancel']) el.addEventListener(n, stop);
    el.addEventListener('click', ev => { ev.stopPropagation(); uxNudge(el); });
    el.addEventListener('keydown', ev => { if ((ev.code === 'Enter' || ev.code === 'Space') && !ev.repeat) { ev.preventDefault(); ev.stopPropagation(); start(ev); } });
    el.addEventListener('keyup', stop);
  }

  /* ---------- word cards ---------- */
  /* Card with picture and English word. o: { x, y, w, h, silhouette, isNew, label (default true), show, act } */
  function uxWordCard(wd, o) {
    const w = o.w || 190, h = o.h || 190, label = o.label !== false, gray = !!o.silhouette;
    const side = Math.min(w - 28, h - (label ? 64 : 28)), ix = (w - side) / 2, iy = 14;
    const ph = uxBlob(wd.id, w / 2, iy + side / 2, side * .38, gray);
    const pic = uxPic(wd.icon || 'word_' + wd.id, ix, iy, side, side, ph, gray ? 'filter="url(#silhouette)"' : '');
    const badge = o.isNew ? `<g transform="translate(${w - 18} 14) rotate(12)"><path d="M0 -30L8 -14L26 -18L16 -2L30 10L12 14L10 30L-4 18L-20 26L-16 8L-30 -4L-12 -8Z" fill="#ff6b9a" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M0 -13L3.5 -3.5L13 0L3.5 3.5L0 13L-3.5 3.5L-13 0L-3.5 -3.5Z" fill="#fff"/></g>` : '';
    const txt = label ? `<text class="latin" x="${w / 2}" y="${h - 20}" text-anchor="middle" font-size="${wd.en.length > 8 ? 26 : 32}" fill="${gray ? '#8d96bd' : '#3b2a6b'}">${wd.en}</text>` : '';
    return `<g transform="translate(${o.x} ${o.y})"><g class="ux-pop ${o.show ? 'show' : ''}" data-pop="${o.slot == null ? '' : o.slot}">
      <g class="ux-card" data-act="${o.act || 'word'}" data-word="${wd.id}" data-ui="" tabindex="0" role="button" aria-label="${wd.en}">
        <rect class="ux-glowrect" x="-8" y="-8" width="${w + 16}" height="${h + 16}" rx="28" fill="none" stroke="#ffe27a" stroke-width="7" opacity="0"/>
        <rect class="ux-frame" width="${w}" height="${h}" rx="22" fill="#fffaf0" stroke="#ffd27a" stroke-width="4" filter="url(#softShadow)"/>
        ${pic}${txt}${badge}</g></g></g>`;
  }
  function uxConfetti(parent, x, y, n) {
    if (!parent) return;
    let s = '';
    const cols = ['#ff7aa8', '#ffd27a', '#8fd0ff', '#b8f09a', '#d4a8ff', '#fff'];
    for (let i = 0; i < (n || 30); i++) {
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 230;
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d * .8 + 120 * Math.random(), rot = Math.round((Math.random() - .5) * 720);
      const c = cols[i % cols.length], sz = 7 + Math.random() * 8;
      const shape = i % 3 === 0 ? `<circle cx="${x}" cy="${y}" r="${(sz / 2).toFixed(1)}" fill="${c}"/>` : i % 3 === 1 ? `<rect x="${x}" y="${y}" width="${sz.toFixed(1)}" height="${(sz * .6).toFixed(1)}" fill="${c}"/>` : `<image href="${SRC('fx_star')}" x="${x - 9}" y="${y - 9}" width="18" height="18"/>`;
      s += `<g class="ux-conf" style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--rot:${rot}deg;animation-delay:${(Math.random() * .15).toFixed(2)}s">${shape}</g>`;
    }
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('pointer-events', 'none');
    parent.appendChild(g);
    g.innerHTML = s;
    setTimeout(() => g.remove(), 1900);
  }

  /* ---------- screens: shared plumbing ---------- */
  function uxInit() {

  }
  /* A new screen replaces the previous one; async sequences compare tok to stop when the screen changed. */
  function uxScreen(name, isStory) {
    uxInit();

  const uxAlive = tok => uxState.tok === tok;
  function uxPaint(html) {
    const root = $('overlay');
    root.innerHTML = html;
    return root;
  }
  function uxClearOverlay() { $('overlay').textContent = ''; $('modal').textContent = ''; uxState.modal = null; }
  function uxInputReset() { try { if (typeof clearInput === 'function') clearInput(); } catch (e) {} }
  function uxApplySettings() {
    const on = !!uxSetting('subtitles'), b = document.body;
    const changed = b.classList.contains('subs') !== on;
    b.classList.toggle('subs', on);
    b.dataset.mode = uxSetting('mode') === 'duo' ? 'duo' : 'solo';
    if (!on) subtitleView(null);
    if (changed) dispatchEvent(new Event('resize'));   // 80-input refits the stage around the parent strip
  }
  /* The play flow belongs to 90-main: startGame(i) / goTitle() / enterRoom(i). These wrappers only keep this file
     usable if one of them is renamed (a plain game.start, no recall or chapter card). */
  const uxHooks = {
    play(i) {
      if (typeof startGame === 'function') { startGame(i); return; }
      uxClearOverlay(); story = null; uxState.tok = null;
      game.start(i === undefined ? 0 : i);
    },
    replay(i) {
      if (typeof enterRoom === 'function') { enterRoom(i); return; }
      uxHooks.play(i);
    },
    home() {
      if (typeof goTitle === 'function') { goTitle(); return; }
      uxStopVoice(); uxClearOverlay(); story = null;
      game.state = 'title'; try { game.load(0); } catch (e) {}

  };

  /* ---------- wordbook ---------- */
  function uxBookPages() {
    const pages = [], all = uxAllWords();
    LEVELS.forEach(lv => {
      const ws = all.filter(w => w.room === lv.id);
      pages.push({ lv, words: (ws.length ? ws : uxRoomWords(lv)).slice(0, 3) });
    });
    const general = all.filter(w => !w.room);
    for (let i = 0; i < general.length; i += 3) pages.push({ lv: null, words: general.slice(i, i + 3) });
    return pages.filter(p => p.words.length);
  }
  function showWordbook(pageNo) {
    const tok = uxScreen('words', false);
    const pages = uxBookPages();
    let cur = Math.max(0, Math.min(pages.length - 1, pageNo || 0));
    const draw = () => {
      const pg = pages[cur];
      if (!pg) { showTitle(); return; }
      const n = pg.words.length, cw = 200, ch = 240, gap = 30, x0 = (960 - (n * cw + (n - 1) * gap)) / 2;
      const cards = pg.words.map((wd, k) => uxWordCard(wd, { x: x0 + k * (cw + gap), y: 150, w: cw, h: ch, silhouette: !uxWordKnown(wd.id), show: true })).join('');
      const head = pg.lv ? `<image href="${SRC(pg.lv.bg)}" x="400" y="26" width="160" height="90" preserveAspectRatio="xMidYMid slice" clip-path="inset(0 round 12px)"/><rect x="400" y="26" width="160" height="90" rx="12" fill="none" stroke="#ffd27a" stroke-width="3"/>`
        : `<g transform="translate(480 70) scale(34)">${uxGlyph('star')}</g>`;
      const dots = pages.map((_, k) => `<circle cx="${480 + (k - (pages.length - 1) / 2) * 16}" cy="478" r="${k === cur ? 6 : 4}" fill="${k === cur ? '#ffd27a' : '#8090d6'}"/>`).join('');
      const html = `<g class="page"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".6"/>
        ${head}${cards}${dots}
        ${uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 28 })}
        ${cur > 0 ? `<g transform="translate(54 270) scale(-1 1)">${uxButton({ act: 'prev', ui: 'back', icon: 'next', x: 0, y: 0, r: 34 })}</g>` : ''}
        ${cur < pages.length - 1 ? uxButton({ act: 'nextpage', ui: 'next', icon: 'next', x: 906, y: 270, r: 34 }) : ''}</g>`;
      const root = uxPaint(html);
      uxBind(root, {
        back: () => { uxStopVoice(); showTitle(); },
        prev: () => { cur--; draw(); },
        nextpage: () => { cur++; draw(); },
        word: el => {

  }

  /* ---------- subtitles (parents) ---------- */
  function subtitleView(sub) {
    const box = $('subs');
    if (!box) return;
    if (!sub || sub.bubble || !uxSetting('subtitles') || !sub.segments || !sub.segments.length) { box.textContent = ''; return; }   // sub.bubble: a sister speaking in play, 50-talk draws that one above her head
    const SIZE = 22, maxW = 640;
    const toks = [];
    for (const seg of sub.segments) {
      if (seg.en) toks.push({ t: seg.text, en: true, w: seg.text.length * 15 + 8 });
      else for (const ch of seg.text) toks.push({ t: ch, en: false, w: ch.charCodeAt(0) < 128 ? 12 : SIZE });
    }
    const lines = [[]]; let wsum = 0;
    for (const t of toks) {
      if (wsum + t.w > maxW && lines[lines.length - 1].length && !'，。、！？：；」…'.includes(t.t)) { lines.push([]); wsum = 0; }
      lines[lines.length - 1].push(t); wsum += t.w;
    }
    const width = Math.max(...lines.map(l => l.reduce((a, t) => a + t.w, 0))) + 56, h = lines.length * 36 + 20;
    const cx = 450, y = 506 - h;
    const hue = sub.who === 'frost' ? '#8fb6ea' : sub.who === 'nuan' ? '#e2a45e' : '#b9a8ff';
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const text = lines.map((l, i) => {
      let spans = '';
      for (const t of l) spans += t.en ? `<tspan class="latin" font-size="${SIZE + 4}" fill="#ffd27a" text-decoration="underline">${esc(t.t)}</tspan>` : `<tspan fill="#f6f7ff">${esc(t.t)}</tspan>`;
      return `<text x="${cx}" y="${y + 36 + i * 36 - 8}" text-anchor="middle" font-size="${SIZE}" xml:space="preserve">${spans}</text>`;
    }).join('');
    box.innerHTML = `<rect x="${cx - width / 2}" y="${y}" width="${width}" height="${h}" rx="16" fill="#0d1438" opacity=".82" stroke="${hue}" stroke-width="2"/>${text}`;
  }

  /* ---------- HUD ---------- */
  const UX_PILLS = [
    { id: 'flake', img: 'flake', col: '#cfe6ff' }, { id: 'heart', img: 'heart', col: '#ffb1c9' }, { id: 'ball', img: 'ball', col: '#f6f7ff' },
    { id: 'block', img: 'iceblock', col: '#cfe6ff' }, { id: 'star', img: 'fx_star', col: '#ffe4a8' },
  ];
  const UX_KEYS = [
    { id: 'left', kbd: 'l', x: 836, y: 466, w: 36 }, { id: 'right', kbd: 'r', x: 916, y: 466, w: 36 },
    { id: 'up', kbd: 'up', x: 876, y: 426, w: 36 }, { id: 'space', kbd: 'space', x: 696, y: 466, w: 132 },
  ];
  function buildHud() {
    uxInit();
    const keys = UX_KEYS.map(k => {
      const r = 8;

      <image href="${SRC(p.img)}" x="8" y="5" width="28" height="28" preserveAspectRatio="xMidYMid meet"/><text class="latin" x="44" y="27" font-size="20" fill="${p.col}"></text></g>`).join('');
    $('hud').innerHTML = `<g id="uxHud" visibility="hidden">

          <clipPath id="uxClipA"><circle r="25"/></clipPath>
          <g clip-path="url(#uxClipA)"><rect x="-25" y="-25" width="50" height="50" fill="#cfe0ff"/><image id="uxAvImg" x="-25" y="-25" width="50" height="50" preserveAspectRatio="xMidYMin slice"/></g>
          <g id="uxAvOther" transform="translate(30 20)"><circle r="14" fill="#cfe0ff" stroke="#fff" stroke-width="2" opacity=".95"/><clipPath id="uxClipB"><circle r="12"/></clipPath><image id="uxAvImg2" x="-12" y="-12" width="24" height="24" preserveAspectRatio="xMidYMin slice" clip-path="url(#uxClipB)"/></g>
        </g></g></g>
      <g id="uxPills" transform="translate(98 19)">${pills}</g>
      ${uxButton({ act: 'home', ui: 'back', icon: 'home', x: 776, y: 38, r: 26, plate: 'dark', keep: false, ring: true })}
      ${uxButton({ act: 'hint', ui: 'hint', icon: 'bulb', x: 836, y: 38, r: 26, plate: 'dark', keep: false })}
      ${uxButton({ act: 'fs', ui: 'fullscreen', icon: 'fullscreen', x: 896, y: 38, r: 26, plate: 'dark', keep: false })}
      <g id="uxKeysPos"><g id="uxKeys">${keys}</g></g></g>`;
    const root = $('hud');
    uxBind(root, {
      hint: el => {
        let tgt = null;
        try { tgt = game.guide && game.guide(); } catch (e) {}
        if (tgt && tgt.say) uxLine(tgt.say, { interrupt: true }); else uxNudge(el);
      },
      fs: () => {
        try {
          if (typeof toggleFullscreen === 'function') { toggleFullscreen(); return; }
          const d = document, r = d.documentElement;
          if (d.fullscreenElement) d.exitFullscreen(); else r.requestFullscreen();
        } catch (e) {}
      },
    });
    uxHold(root.querySelector('[data-act="home"]'), 1500, () => uxHooks.home());
    uxState.hudBuilt = true; uxState.sig = '';
  }

  function hud(g) {
    g = g || game;
    if (!uxState.hudBuilt) buildHud();
    const root = $('uxHud');
    if (!root) return;
    if ((uxState.tick++ & 31) === 0) uxApplySettings();
    const show = g.state !== 'title' && !story && !uxState.modal;
    root.setAttribute('visibility', show ? 'visible' : 'hidden');
    if (!show) return;
    const solo = g.mode !== 'duo';
    /* avatar: the player's portrait big, the companion small */
    const me = 'frost', other = 'nuan';
    if (uxState.player !== me + g.mode) {
      uxState.player = me + g.mode;
      $('uxAvImg').setAttribute('href', SRC('portrait_' + me));
      $('uxAvImg2').setAttribute('href', SRC('portrait_' + other));
      $('uxAv').setAttribute('pointer-events', 'none');
    }
    /* counters with icons; only the kinds this room has, laid out left to right */
    const items = g.items || [];
    const cnt = k => { let a = 0, b = 0; for (const it of items) if (it.kind === k) { b++; if (it.got) a++; } return [a, b]; };
    const [f0, f1] = cnt('*'), [h0, h1] = cnt('h'), [b0, b1] = cnt('o');
    const st = g.stars ? [g.stars.got, g.stars.total] : cnt('+');
    const nb = g.blocks ? g.blocks.length : 0;
    const vals = { flake: [f0 + '/' + f1, f1 > 0], heart: [h0 + '/' + h1, h1 > 0], ball: [b0 + '/' + b1, b1 > 0], block: [nb + '/' + (typeof MAX_BLOCKS !== 'undefined' ? MAX_BLOCKS : 3), nb > 0], star: [st[0] + '/' + st[1], st[1] > 0] };
    let x = 0, sig = '';
    for (const p of UX_PILLS) {
      const [txt, vis] = vals[p.id], n = $('uxP_' + p.id);
      if (!vis) { if (n.getAttribute('visibility') !== 'hidden') n.setAttribute('visibility', 'hidden'); continue; }
      sig += p.id + txt + '|';
      if (n.getAttribute('visibility') !== 'visible') n.setAttribute('visibility', 'visible');
      n.setAttribute('transform', `translate(${x} 0)`);
      const t = n.lastElementChild;
      if (t.textContent !== txt) t.textContent = txt;
      x += 92;
    }
    /* keyboard diagram (solo only): game.kbd is kept by 80-input, teach = the key the tutorial asks for. A tap stays lit a moment. */
    /* The diagram rides in the top bar just after the counter pills (off the floor and the door).
       UX_KEYS span x 696..952, y 426..502 in stage units; KB_S keeps even 5 pills + diagram left of the buttons at x 750. */
    const KB_S = .62, kbX = 98 + x + 12;
    $('uxKeysPos').setAttribute('transform', `translate(${(kbX - 696 * KB_S).toFixed(1)} ${(14 - 426 * KB_S).toFixed(1)}) scale(${KB_S})`);
    const kroot = $('uxKeys'), kbd = g.kbd || {}, now = performance.now();
    kroot.setAttribute('visibility', solo ? 'visible' : 'hidden');
    if (solo) {
      for (const k of UX_KEYS) {
        if (kbd[k.kbd]) uxState.lit[k.id] = now;
        const n = $('uxK_' + k.id);
        n.classList.toggle('lit', !!kbd[k.kbd] || now - (uxState.lit[k.id] || -1e9) < 140);
        n.classList.toggle('teach', kbd.teach === k.kbd);
      }
    }
    $('uxAv').classList.toggle('ux-pulse', solo && kbd.teach === 'tab');
  }
  /* ===== e / view-rewards: sticker book, wardrobe, hat overlay, sticker-earned celebration (PLAN B2, CONTRACT §11) =====
     Save fields used: save.stickers[] (ids), save.board[{id,x,y}] (x, y are fractions 0..1 of the sticker board, the
     sticker's centre), save.outfit[who] {dress 0..2, hat id|null}.
     Sticker ids: '<lv>' (room cleared), '<lv>_gold' (all three stars), 'words5_<k>' (every 5 words heard). Pictures:
     sticker_<id> (words5_<k> uses sticker_words5), sticker_board; dresses '<who>_<frame>_d<k>' (all twelve frames or none);
     hats 'hat_<id>' with head offsets in SIZES.hat_offsets (see rwHatOffset). Anything not delivered is drawn as a vector shape.
     The screens reuse the picture-button helpers of 70-ui (uxScreen, uxPaint, uxButton, uxBind, uxPic, ...).
     Private names carry the `rw` prefix (one shared view scope). */

  const RW_UNLOCK = { dress1: 3, dress2: 6, bow: 3, clip: 6, wreath: 10, crown: 10 };   // stickers needed (PLAN B2: 3 / 6 / 10)
  const RW_HATS = ['bow', 'clip', 'wreath', 'crown'];
  const RW_DRESS_COL = { frost: ['#78bce2', '#75d8b8', '#ef6e9f'], nuan: ['#285e9b', '#2b8c89', '#8055ad'] };
  const RW_HAT_W = 28, RW_HAT_SINK = 7;   // hat width in game units, and how far its lower edge sits into the hair
  const RW_BOARD = { x: 40, y: 78, w: 672, h: 378 };
  const RW_STICKER = 76;                  // size of a sticker on the board
  const rwState = { ver: 0, toasts: [], toast: null, fresh: new Set(), wordsAt: -1, tick: 0, drawn: { frost: null, nuan: null } };

  /* ---------- the catalogue and the save ---------- */
  const rwSave = () => { try { return save; } catch (e) { return null; } };
  const rwHas = id => { const s = rwSave(); return !!(s && Array.isArray(s.stickers) && s.stickers.includes(id)); };
  const rwCount = () => { const s = rwSave(); return s && Array.isArray(s.stickers) ? s.stickers.length : 0; };
  const rwWordsKnown = () => { const s = rwSave(); return !s ? 0 : WORDS.filter(w => { const r = s.words && s.words[w.id]; return r && (r.heard > 0 || r.seen); }).length; };
  function rwCatalog() {
    const out = [];
    LEVELS.forEach((lv, i) => { out.push({ id: lv.id, room: i, gold: false }); out.push({ id: lv.id + '_gold', room: i, gold: true }); });
    for (let k = 1; k <= Math.floor(WORDS.length / 5); k++) out.push({ id: 'words5_' + k, words: k });
    return out;
  }
  const rwImgName = id => (/^words5_/.test(id) ? 'sticker_words5' : 'sticker_' + id);

  /* Give every sticker the save has earned the right to. levelId limits the room checks (null: all rooms). Returns the new ids.
     quiet: no celebration (the book catches up silently when it opens). Safe to call any number of times. */
  function awardStickers(levelId, quiet) {
    const s = rwSave();
    if (!s) return [];
    if (!Array.isArray(s.stickers)) s.stickers = [];
    const added = [];
    const give = id => { if (!s.stickers.includes(id)) { s.stickers.push(id); added.push(id); } };
    for (const lv of LEVELS) {
      if (levelId && lv.id !== levelId) continue;
      const r = s.rooms && s.rooms[lv.id];
      if (!r) continue;
      if (r.cleared) give(lv.id);
      if (r.cleared && r.stars && r.stars[0] && r.stars[1] && r.stars[2]) give(lv.id + '_gold');
    }
    const known = rwWordsKnown();
    rwState.wordsAt = known;
    for (let k = 1; k <= Math.floor(known / 5); k++) give('words5_' + k);
    if (added.length) {
      const before = s.stickers.length - added.length;
      try { saveWrite(); } catch (e) {}
      added.forEach(id => rwState.fresh.add(id));
      if (!quiet) {
        added.forEach(id => rwState.toasts.push({ id }));
        if ([3, 6, 10].some(n => before < n && s.stickers.length >= n)) rwState.toasts.push({ wardrobe: true });
      }
    }
    return added;
  }

  /* ---------- sticker pictures ---------- */
  function rwStickerPlaceholder(id, s) {
    const r = s / 2, st = 'stroke="#ffffff" stroke-width="' + Math.max(3, s * .06).toFixed(1) + '"';
    if (/^words5_/.test(id)) {
      return `<circle r="${r}" fill="#ff9cc0" ${st}/><g transform="scale(${(s * .3).toFixed(1)})">${uxGlyph('book')}</g>`;
    }
    const gold = /_gold$/.test(id), lvId = id.replace(/_gold$/, ''), i = Math.max(0, LEVELS.findIndex(l => l.id === lvId));
    const col = UX_HUE[i % UX_HUE.length];
    const ring = gold ? `<circle r="${(r - s * .07).toFixed(1)}" fill="none" stroke="#ffd27a" stroke-width="${(s * .07).toFixed(1)}"/>` : '';
    return `<circle r="${r}" fill="${gold ? '#fff3c9' : col}" ${st}/><circle r="${(r * .62).toFixed(1)}" fill="${gold ? '#ffd27a' : '#ffffff'}" opacity="${gold ? 1 : .55}"/>${ring}<g transform="scale(${(s * .27).toFixed(1)})">${uxGlyph('star')}</g>`;
  }
  const rwStickerArt = (id, s) => uxPic(rwImgName(id), -s / 2, -s / 2, s, s, rwStickerPlaceholder(id, s));
  /* The same, but for a sticker that is not earned yet: a grey shape. */
  const rwSilhouette = s => `<circle r="${s / 2}" fill="#8d96bd" opacity=".45" stroke="#c6ccea" stroke-width="2.5" stroke-dasharray="7 6"/>`;

  /* ---------- the celebration ---------- */
  function rwToastLayer() {
    let g = $('rewardPop');
    if (!g) { g = el('g', { id: 'rewardPop', 'pointer-events': 'none', 'aria-hidden': 'true' }); const subs = $('subs'); if (subs && subs.parentNode) subs.parentNode.insertBefore(g, subs); else $('stage').appendChild(g); }
    return g;
  }
  function rwStartToast(t) {
    const box = rwToastLayer();
    box.textContent = '';
    const g = el('g', {}, box), size = game.state === 'play' ? 104 : 130;
    const rays = el('g', {}, g), pop = el('g', {}, g);
    el('circle', { r: size * .95, fill: 'url(#warm)' }, g);
    for (let k = 0; k < 8; k++) el('path', { d: `M${size * .52} -4L${size * .98} 0L${size * .52} 4Z`, fill: '#ffe27a', opacity: .75, transform: `rotate(${k * 45})` }, rays);
    pop.innerHTML = t.wardrobe
      ? `<circle r="${size / 2}" fill="url(#plateGrad)" stroke="#fff" stroke-width="4"/><g transform="scale(${(size * .3).toFixed(1)})">${uxGlyph('wardrobe')}</g>`
      : rwStickerArt(t.id, size);
    rwState.toast = { g, rays, pop, t: 0, size, cx: 480, cy: game.state === 'play' ? 300 : 330 };
    g.setAttribute('transform', 'translate(480 330) scale(0)');
    try { sfx('unlock'); } catch (e) {}
    try { uxConfetti(box, rwState.toast.cx, rwState.toast.cy, 24); } catch (e) {}
  }
  function rwToastTick(dt) {
    let T0 = rwState.toast;
    if (!T0 && rwState.toasts.length) { rwStartToast(rwState.toasts.shift()); T0 = rwState.toast; }
    if (!T0) return;
    T0.t += dt;
    const t = T0.t, IN = .55, HOLD = 1.9, OUT = .45;
    let sc, y = T0.cy, op = 1;
    if (t < IN) { const u = t / IN, c1 = 1.9; sc = 1 + (c1 + 1) * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
    else if (t < IN + HOLD) sc = 1 + Math.sin((t - IN) * 5) * .035;
    else { const u = Math.min(1, (t - IN - HOLD) / OUT); sc = 1 - u * .25; y -= u * 40; op = 1 - u; }
    T0.g.setAttribute('transform', `translate(${T0.cx} ${y.toFixed(1)}) scale(${Math.max(0, sc).toFixed(3)})`);
    T0.g.setAttribute('opacity', op.toFixed(2));
    T0.rays.setAttribute('transform', `rotate(${(t * 40).toFixed(1)})`);
    T0.pop.setAttribute('transform', `rotate(${(Math.sin(t * 6) * 4 * Math.max(0, 1 - t / 1.2)).toFixed(2)})`);
    if (t > IN + HOLD + OUT) { T0.g.remove(); rwState.toast = null; }
  }
  /* Called every frame by updateToys (15-toys): the celebration, and now and then a look at the words heard. */
  function rewardsTick(dt) {
    try {
      rwToastTick(Math.min(dt, .05));
      if ((++rwState.tick & 63) === 0 && rwWordsKnown() !== rwState.wordsAt) awardStickers(null);
    } catch (e) { if (!rwState.err) { rwState.err = 1; console.error('[rewards]', e); } }
  }

  /* ---------- pointer helpers ---------- */
  function rwPoint(ev) {
    const m = $('overlay').getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  const rwInBoard = p => p.x >= RW_BOARD.x && p.x <= RW_BOARD.x + RW_BOARD.w && p.y >= RW_BOARD.y && p.y <= RW_BOARD.y + RW_BOARD.h;
  const rwClamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- sticker book ---------- */
  function showStickers(pageNo) {
    try { rwShowStickers(pageNo || 0); } catch (e) { console.error('[stickers]', e); try { showTitle(); } catch (e2) {} }
  }
  function rwShowStickers(pageNo) {
    const tok = uxScreen('stickers', false);
    awardStickers(null, true);
    const per = 18, cols = 3, cell = 64, tx0 = 738, ty0 = 112;
    let page = pageNo, first = true;
    const earned = () => rwSave().stickers.filter(id => rwCatalog().some(c => c.id === id));
    const board = () => rwSave().board;
    const free = () => earned().filter(id => !board().some(b => b.id === id));
    /* the tray shows the stickers that are not on the board, then grey shapes for the room stickers still to win */
    const trayList = () => {
      const out = free().map(id => ({ id, got: true }));
      for (const c of rwCatalog()) if (!c.words && !c.gold && !rwHas(c.id)) out.push({ id: c.id, got: false });
      return out;
    };

    const draw = () => {
      const list = trayList(), pages = Math.max(1, Math.ceil(list.length / per));
      page = rwClamp(page, 0, pages - 1);
      const tray = list.slice(page * per, page * per + per).map((it, k) => {
        const x = tx0 + (k % cols) * cell + cell / 2, y = ty0 + Math.floor(k / cols) * cell + cell / 2;
        if (!it.got) return `<g transform="translate(${x} ${y})">${rwSilhouette(52)}</g>`;
        return `<g transform="translate(${x} ${y})"><g class="ux-btn rw-item ${rwState.fresh.has(it.id) ? 'ux-bounce' : ''}" data-id="${it.id}" data-from="tray" data-ui="" tabindex="-1">
          <circle r="31" fill="#000" fill-opacity="0" pointer-events="all"/>${rwStickerArt(it.id, 56)}</g></g>`;
      }).join('');
      const placed = board().filter(b => rwHas(b.id)).map(b => {
        const x = RW_BOARD.x + b.x * RW_BOARD.w, y = RW_BOARD.y + b.y * RW_BOARD.h;
        return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="ux-btn rw-item" data-id="${b.id}" data-from="board" data-ui="" tabindex="-1">
          <circle r="${RW_STICKER / 2 + 2}" fill="#000" fill-opacity="0" pointer-events="all"/>${rwStickerArt(b.id, RW_STICKER)}</g></g>`;
      }).join('');
      const B = RW_BOARD;
      const boardArt = uxPic('sticker_board', B.x, B.y, B.w, B.h,
        `<rect x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="20" fill="#27357f"/>
         <rect x="${B.x}" y="${B.y + B.h * .62}" width="${B.w}" height="${B.h * .38}" rx="20" fill="#3b4a96"/>
         <path d="M${B.x + 120} ${B.y + B.h * .7}V${B.y + B.h * .34}l24 -34 24 34V${B.y + B.h * .7}ZM${B.x + 250} ${B.y + B.h * .7}V${B.y + B.h * .2}l40 -50 40 50V${B.y + B.h * .7}ZM${B.x + 410} ${B.y + B.h * .7}V${B.y + B.h * .36}l24 -34 24 34V${B.y + B.h * .7}Z" fill="#5a6fca" opacity=".8"/>
         <circle cx="${B.x + B.w - 90}" cy="${B.y + 70}" r="32" fill="#fff3c9" opacity=".85"/>`, 'clip-path="inset(0 round 20px)"');
      const html = `<g class="${first ? 'page' : ''}"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".62"/>
        ${boardArt}<rect id="rwBoardRing" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="20" fill="none" stroke="#ffd27a" stroke-width="5" opacity="0"/>
        <g id="rwPlaced">${placed}</g>
        <rect x="${tx0 - 10}" y="${ty0 - 14}" width="${cols * cell + 20}" height="${per / cols * cell + 24}" rx="18" fill="#141c52" opacity=".55"/>
        ${tray}
        ${uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 28 })}
        ${page > 0 ? `<g transform="translate(${tx0 + 40} 486) scale(-1 1)">${uxButton({ act: 'prev', ui: 'back', icon: 'next', x: 0, y: 0, r: 26 })}</g>` : ''}
        ${page < pages - 1 ? uxButton({ act: 'nextpage', ui: 'next', icon: 'next', x: tx0 + 150, y: 486, r: 26 }) : ''}
        <g id="rwDrag" pointer-events="none"></g></g>`;
      first = false;
      const root = uxPaint(html);
      uxBind(root, { back: () => showTitle(), prev: () => { page--; draw(); }, nextpage: () => { page++; draw(); } });
      root.querySelectorAll('.rw-item').forEach(n => n.addEventListener('pointerdown', ev => startDrag(ev, n)));
      rwState.fresh.clear();
    };

    /* a free spot for a sticker that was only tapped */
    const spot = () => {
      const taken = board().map(b => ({ x: b.x * RW_BOARD.w, y: b.y * RW_BOARD.h }));
      for (let k = 0; k < 60; k++) {
        const x = (.1 + ((k * 0.213) % .8)) * RW_BOARD.w, y = (.16 + ((k * 0.137 + Math.floor(k / 5) * .11) % .7)) * RW_BOARD.h;
        if (taken.every(t => Math.hypot(t.x - x, t.y - y) > RW_STICKER * .8)) return { fx: x / RW_BOARD.w, fy: y / RW_BOARD.h };
      }
      return { fx: .15 + Math.random() * .7, fy: .2 + Math.random() * .6 };
    };
    const place = (id, fx, fy) => {
      const b = board();
      const i = b.findIndex(x => x.id === id);
      if (i >= 0) b.splice(i, 1);
      b.push({ id, x: +rwClamp(fx, .06, .94).toFixed(4), y: +rwClamp(fy, .08, .94).toFixed(4) });   // last = on top
    };

    const startDrag = (ev, n) => {
      if (ev.button) return;
      ev.preventDefault(); ev.stopPropagation(); uxWake();
      const id = n.dataset.id, from = n.dataset.from, p0 = rwPoint(ev), dragBox = $('rwDrag');
      if (!dragBox) return;
      const proxy = el('g', { transform: `translate(${p0.x} ${p0.y}) scale(1.12)` }, dragBox);
      proxy.innerHTML = rwStickerArt(id, RW_STICKER);
      n.parentNode.setAttribute('opacity', '.28');
      uxSfx('click');
      let moved = false;
      const ring = $('rwBoardRing');
      const move = e => {
        const p = rwPoint(e);
        if (Math.hypot(p.x - p0.x, p.y - p0.y) > 6) moved = true;
        proxy.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(1.12)`);
        if (ring) ring.setAttribute('opacity', moved && rwInBoard(p) ? '.9' : '0');
      };
      const end = (e, cancel) => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', cancelUp);
        proxy.remove();
        if (!uxAlive(tok)) return;
        if (!cancel) {
          const p = rwPoint(e);
          if (!moved) {
            if (from === 'tray') { const s = spot(); place(id, s.fx, s.fy); uxSfx('pick'); }
            else { place(id, board().find(b => b.id === id).x, board().find(b => b.id === id).y); uxNudge(n.parentNode); }

  /* ---------- dress and hat ---------- */

  function rwHatOffset(who, frame) {

     hat_offsets are [dx, dy, scale?, rotation°?] in game units from there (dy > 0 = lower). */
  function rwPlaceHat(parent, who, frame, hatId) {

      n.setAttribute('x', (dx - w / 2).toFixed(2)); n.setAttribute('y', (by - h).toFixed(2));

  /* ---------- wardrobe ---------- */
  function showWardrobe() {

  function rwShowWardrobe() {
    const tok = uxScreen('wardrobe', false);

    let first = true;
    const outfit = who => rwSave().outfit[who];
    /* one choice: a round swatch. state: 'on' selected, 'open' free to pick, 'lock' not earned yet, 'miss' not delivered yet */
    const choice = (who, kind, val, x, y, art, need, ready) => {

      const enough = rwCount() >= need;

        <g transform="translate(-4 24)"><path transform="translate(-6 0) scale(8)" d="M0 -.8L.22 -.25L.8 -.22L.35 .15L.5 .72L0 .4L-.5 .72L-.35 .15L-.8 -.22L-.22 -.25Z" fill="#ffd27a"/><text class="latin" x="6" y="7" font-size="19" fill="#fff" stroke="#141c52" stroke-width="4" paint-order="stroke">${need}</text></g>` : '';

      ['frost', 'nuan'].forEach((who, i) => {

          return choice(who, 'dress', k, cx - 76 + k * 76, 372, art, need, ready);

        const hatList = RW_HATS.filter(h => tyHas('hat_' + h));
        RW_HATS.forEach(h => { if (!tyImgState['hat_' + h]) tyProbe('hat_' + h, ok => { if (ok && uxAlive(tok)) draw(); }); });
        const hats = hatList.length ? [null, ...hatList].map((h, k, a) => {
          const x = cx + (k - (a.length - 1) / 2) * 70;

        }).join('') : '';

      });
      html += uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 28 }) + '</g>';
      first = false;

      root.querySelectorAll('.rw-prev').forEach(node => {
        const who = node.dataset.who, o = outfit(who), sz = SIZES[who + '_idle'] || [80, 168, 40];
        const k = o.dress && rwDressReady(who, o.dress) ? o.dress : 0;
        img(rwDressName(who, 'idle', k), -sz[2] * SPRITE, 3 - sz[1] * SPRITE, sz[0] * SPRITE, sz[1] * SPRITE, node);
        rwPlaceHat(node, who, 'idle', o.hat);

      root.querySelectorAll('.rw-choice').forEach(n => hoverable(n, '', () => {
        const who = n.dataset.who, kind = n.dataset.kind, val = n.dataset.val, state = n.dataset.state;

  /* Input (CONTRACT §5). Solo: ← → ↑ Space controls Elsa; Anna assists. Duo keeps the two-person layout.

  const SOLO_KEYS = { ArrowLeft: 'l', ArrowRight: 'r', ArrowDown: 'd', ArrowUp: 'jump', Space: 'act', Enter: 'act', NumpadEnter: 'act' };
  const DUO_KEYS = {
    KeyA: ['frost', 'l'], KeyD: ['frost', 'r'], KeyS: ['frost', 'd'], KeyW: ['frost', 'jump'], KeyF: ['frost', 'act'],
    ArrowLeft: ['nuan', 'l'], ArrowRight: ['nuan', 'r'], ArrowDown: ['nuan', 'd'], ArrowUp: ['nuan', 'jump'],
    Enter: ['nuan', 'act'], NumpadEnter: ['nuan', 'act'], KeyL: ['nuan', 'act'],

  game.kbd = { l: 0, r: 0, up: 0, space: 0, tab: 0, teach: null };
  const KBD_OF = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'up', Space: 'space', Enter: 'space', NumpadEnter: 'space', Tab: 'tab' };
  /* What the player has done since the room started, for the tutorial. */
  const inputSeen = { move: false, jump: false, magic: false, swap: false };

  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');
  const touchHeld = { l: 0, r: 0 };
  let touchDuoId = 'frost';

  /* True while the room is live and nothing is covering it. */
  function canPlay() { return playFlow.phase === 'play' && game.state === 'play' && !storyIsOpen() && !uxState.modal; }
  /* The sister the arrow keys steer right now. */
  const steered = () => (game.mode === 'solo' ? 'frost' : 'nuan');

  function clearInput() {
    heldKeys.clear();

    for (const id of ['frost', 'nuan']) Object.assign(game.input[id], { l: 0, r: 0, d: 0 });
    for (const k of ['l', 'r', 'up', 'space', 'tab']) game.kbd[k] = 0;

  /* Gamepad: d-pad or left stick walks, A / up jumps, X / B magic; Elsa remains the solo lead. */

    const was = { jump: padState.jump, act: padState.act, swap: padState.swap, any: padState.any };
    if (!p) { Object.assign(padState, { l: 0, r: 0, d: 0, jump: false, act: false, swap: false, any: false }); return; }
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed), ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    padState.l = ax < -.45 || b(14) ? 1 : 0;
    padState.r = ax > .45 || b(15) ? 1 : 0;
    padState.d = ay > .75 || b(13) ? 1 : 0;

    if (storyIsOpen()) { if (padState.any && !was.any) advanceStoryPage(); return; }
    if (!canPlay()) return;
    if (padState.jump && !was.jump) pressPlay(steered(), 'jump');
    if (padState.act && !was.act) pressPlay(steered(), 'act');
    if (padState.swap && !was.swap) swapPlayer();
  }

  /* A jump / magic press from any device. */
  function pressPlay(id, what) {
    if (!canPlay()) return;
    game.press(id, what);
    if (what === 'jump') inputSeen.jump = true; else inputSeen.magic = true;
  }

  /* Copy the held keys / gamepad / touch into g.input for whoever is player-controlled. In solo only the player's entry is
     written; the other sister belongs to the companion. */
  function syncInput() {
    if (!canPlay()) {
      for (const id of ['frost', 'nuan']) Object.assign(game.input[id], { l: 0, r: 0, d: 0 });
      return;
    }
    const k = c => heldKeys.has(c);
    if (game.mode === 'solo') {
      const inp = game.input.frost;
      inp.l = k('ArrowLeft') || padState.l || touchHeld.l ? 1 : 0;
      inp.r = k('ArrowRight') || padState.r || touchHeld.r ? 1 : 0;
      inp.d = k('ArrowDown') || padState.d ? 1 : 0;

      fi.l = k('KeyA') || (tf && touchHeld.l) ? 1 : 0;
      fi.r = k('KeyD') || (tf && touchHeld.r) ? 1 : 0;
      fi.d = k('KeyS') ? 1 : 0;
      ni.l = k('ArrowLeft') || padState.l || (tn && touchHeld.l) ? 1 : 0;
      ni.r = k('ArrowRight') || padState.r || (tn && touchHeld.r) ? 1 : 0;
      ni.d = k('ArrowDown') || padState.d ? 1 : 0;

    if (mine.some(i => i.l || i.r)) inputSeen.move = true;
  }

  /* Legacy hook: the solo story keeps Elsa as lead rather than swapping roles. */
  function swapPlayer() {
    return false;
  }
  /* Called for the 'swap' event, wherever the swap came from (Tab, the avatar in the hud, the gamepad). */
  function onPlayerSwapped(e) {
    if (game.mode === 'solo') game.player = 'frost';
    setSetting('player', game.player);
    for (const id of ['frost', 'nuan']) Object.assign(game.input[id], { l: 0, r: 0, d: 0 });
    inputSeen.swap = true;

  /* ---- keyboard ---- */
  function wakeOnce() { if (typeof wakeAudio === 'function') { try { wakeAudio(); } catch (e) { console.error(e); } } }
  function advanceStoryPage() { if (typeof advanceStory === 'function') advanceStory(); }

  addEventListener('keydown', e => {

    wakeOnce();
    if (storyIsOpen()) {
      if (!e.repeat && ADVANCE_KEYS.includes(e.code)) { e.preventDefault(); advanceStoryPage(); }
      return;
    }
    const active = document.activeElement;
    const onPseudoButton = active && active.getAttribute && active.getAttribute('role') === 'button' && !/^(BUTTON|A|INPUT)$/.test(active.tagName);

  addEventListener('pointerdown', wakeOnce, { capture: true });

  /* ---- touch (basic) ---- */
  function bindHold(id, key) {
    const b = $(id);

    const on = e => { e.preventDefault(); wakeOnce(); b.classList.add('on'); touchHeld[key] = 1; inputSeen.move = true; };
    const off = () => { b.classList.remove('on'); touchHeld[key] = 0; };

  bindTap('tAct', () => pressPlay(steered(), 'act'));

  /* ---- fullscreen and scaling ---- */
  function toggleFullscreen() {

    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }

      if (req) { const p = req.call(root); if (p && p.catch) p.catch(() => {}); }

  /* The stage keeps its 960 x 520 proportions and takes whatever room the window has after the other blocks of the
     page (hint line, touch padState) and the body padding. Nothing may scroll: 1280x720, 1440x900 and 1920x1080 all fit. */
  const STAGE_RATIO = 960 / 520;
  function fitStage() {
    const st = $('stage'), body = document.body, root = document.documentElement;
    if (!st || !body) return;
    root.style.overflow = 'hidden';
    body.style.overflow = 'hidden';
    for (let pass = 0; pass < 2; pass++) {
      const cs = getComputedStyle(body);
      const px = k => parseFloat(cs[k]) || 0;
      const gap = px('rowGap');
      let others = 0, count = 0;
      for (const n of body.children) {
        if (n === st || /^(SCRIPT|STYLE|LINK|META|TITLE)$/.test(n.tagName)) continue;
        const ns = getComputedStyle(n);
        if (ns.display === 'none' || ns.position === 'fixed' || ns.position === 'absolute') continue;
        others += n.offsetHeight + (parseFloat(ns.marginTop) || 0) + (parseFloat(ns.marginBottom) || 0);
        count++;
      }
      const availW = root.clientWidth - px('paddingLeft') - px('paddingRight');
      const availH = root.clientHeight - px('paddingTop') - px('paddingBottom') - others - gap * count;
      const w = Math.max(240, Math.floor(Math.min(availW, availH * STAGE_RATIO)));
      st.style.width = w + 'px';
      st.style.height = Math.round(w / STAGE_RATIO) + 'px';

      if (info) info.style.width = w + 'px';

  addEventListener('orientationchange', fitStage);
  document.addEventListener('fullscreenchange', fitStage);
  document.addEventListener('webkitfullscreenchange', fitStage);
  /* Main: the flow title -> (prologue) -> recall -> chapter -> play -> clear -> next, and the frame loop.
     Order inside a frame (CONTRACT §5): solo -> companion.update(dt) -> g.step(dt); then the frame's events go to
     audioOnEvents -> talkOnEvents -> fx. Only this file steps the game. */
  const STEP = 1 / 120;
  const playFlow = { phase: 'boot', token: 0, tutoring: false };   // phase: boot | title | story | intro | play | clear | win
  const newToken = () => ++playFlow.token;
  const stale = tok => tok !== playFlow.token;
  const sleep = ms => new Promise(ok => setTimeout(ok, ms));

  /* d1's story pages set `story`; if that name is ever gone, nothing is open. */
  function storyIsOpen() {
    try { return typeof story !== 'undefined' && !!story; } catch (e) { return false; }
  }

  /* One broken helper in another file must not freeze the picture: report it once and keep the loop alive. */
  const reported = new Set();
  function guarded(label, fn) {
    try { return fn(); } catch (e) {
      if (!reported.has(label + e.message)) { reported.add(label + e.message); console.error(`[${label}]`, e); }
      return undefined;
    }
  }

  const companion = typeof createCompanion === 'function' ? createCompanion(game) : null;
  game.companion = companion;

  /* A voice line that never throws and never waits for a line that does not exist. */
  function vline(key, opts) {
    if (!hasLineKey(key) || typeof voice === 'undefined' || !voice || typeof voice.line !== 'function') return Promise.resolve();
    try { return Promise.resolve(voice.line(key, opts)).catch(() => {}); } catch (e) { return Promise.resolve(); }
  }
  /* Wait until cond() holds, `ms` pass or the flow moves on (token changes). */
  async function waitUntil(cond, ms, tok) {
    const end = performance.now() + ms;
    while (!stale(tok) && !cond() && performance.now() < end) await sleep(100);
  }

  /* ---- settings that change the game itself ---- */
  function onSettingChanged(key, value) {
    if (key === 'mode') { game.mode = value; clearInput(); }
    else if (key === 'player') game.player = value;
    else if (key === 'sound' && !value) voice.stop();
  }
  function applySettings() {
    game.mode = setting('mode');
    game.player = setting('player');
  }

  /* ---- events ---- */
  function handleEvents() {
    const events = game.events.splice(0);
    if (typeof audioOnEvents === 'function') guarded('audioOnEvents', () => audioOnEvents(events, game));
    if (typeof talkOnEvents === 'function') guarded('talkOnEvents', () => talkOnEvents(events, game));
    guarded('fx', () => fxOnEvents(events));
    for (const e of events) if (e.type === 'clear') onRoomClear().catch(err => console.error('[clear]', err));
  }

  /* ---- flow ---- */
  function goTitle() {
    newToken();
    playFlow.phase = 'title';
    game.kbd.teach = null;
    if (typeof voice !== 'undefined' && voice && typeof voice.stop === 'function') guarded('voice.stop', () => voice.stop());
    clearInput();
    applySettings();
    game.state = 'title';
    game.load(0);
    handleEvents();
    if (typeof showTitle === 'function') showTitle();
  }

  const storyPages = keys => keys.filter(hasLineKey).map(k => ({ art: lineOf(k).art, vo: k, key: k, line: k, lines: lineText(k) }));

  /* Called by the title buttons. No argument: the very first time play the prologue, afterwards continue where the
     child left off. With a room index (the room picker): go straight to that room. */
  function startGame(index) {
    wakeOnce();
    if (typeof hideTitle === 'function') hideTitle();
    const target = Number.isInteger(index) && index >= 0 && index < LEVELS.length ? index : (save.flags.prologue ? nextRoomIndex() : 0);
    const pages = save.flags.prologue ? [] : storyPages(['p1', 'p2', 'p3']);
    if (pages.length && typeof openStory === 'function') {
      newToken();
      playFlow.phase = 'story';
      openStory(pages, () => { save.flags.prologue = true; saveWrite(); enterRoom(target); });
    } else {
      save.flags.prologue = true; saveWrite();
      enterRoom(target);
    }
  }

  /* Recall of the previous room, the chapter card, then the room itself. The room is already drawn behind the cards. */
  async function enterRoom(i) {
    const tok = newToken();
    const lv = LEVELS[i];
    playFlow.wordBaseline = Object.fromEntries((lv.words || []).map(id => [id, (save.words[id] || {}).heard || 0]));
    playFlow.phase = 'intro';
    playFlow.tutoring = false;
    game.kbd.teach = null;
    clearInput();
    applySettings();
    game.state = 'title';
    game.load(i);
    handleEvents();
    /* a card that fails to open must not strand the child on a blank screen: treat it as already closed */
    const card = (fn, level) => new Promise(ok => { try { fn(level, ok); } catch (e) { console.error(e); ok(); } });
    if (i > 0 && typeof showRecall === 'function') await card(showRecall, LEVELS[i - 1]);
    if (stale(tok)) return;
    if (typeof showChapter === 'function') await card(showChapter, lv);
    if (stale(tok)) return;
    beginPlay(i, tok);
  }

  function beginPlay(i, tok) {
    applySettings();
    game.start(i);
    if (companion) companion.reset();
    handleEvents();
    Object.assign(inputSeen, { move: false, jump: false, magic: false, swap: false });
    playFlow.phase = 'play';
    flashPlayerMark(3);
    if (typeof startMusic === 'function') guarded('startMusic', () => startMusic(LEVELS[i].music));
    roomIntro(i, tok);
  }
  function restartRoom() {
    if (playFlow.phase !== 'play') return;
    clearInput();
    game.start(game.index);
    if (companion) companion.reset();
    handleEvents();
    flashPlayerMark(2);
  }

  /* The start_<room>_<n> lines belong to talkOnEvents (50-talk plays them when the room goes live). Here: wait until she
     has finished talking, then (first room, first time) the keyboard lessons. The game is live meanwhile. */
  async function roomIntro(i, tok) {
    await sleep(900);
    let quiet = 0;
    for (let n = 0; n < 200 && quiet < 8 && !stale(tok); n++) {   // 8 x 150 ms of silence in a row, at most 30 s
      quiet = typeof voice !== 'undefined' && voice && voice.busy ? 0 : quiet + 1;
      await sleep(150);
    }
    if (stale(tok)) return;
    if (i === 0 && !save.flags.tutorial) await runTutorial(tok);
  }

  /* PLAN A2: the companion teaches the keys one by one; the keyboard diagram lights the key being taught. */
  async function runTutorial(tok) {
    const kbd = game.kbd;
    const ask = async (key, teach, done, ms) => {
      if (stale(tok)) return false;
      kbd.teach = teach;
      const spoke = vline(key);
      if (!hasLineKey(key)) await sleep(1500);
      await Promise.race([spoke, waitUntil(done, 12000, tok)]);   // the key may be pressed while she is still talking
      await waitUntil(done, ms, tok);
      return !stale(tok);
    };
    if (!save.flags.fullscreenTip) {
      await vline('tutor_fullscreen');
      save.flags.fullscreenTip = true; saveWrite();
    }
    /* the walking lesson alternates the two arrows */
    playFlow.tutoring = true;   // the guide hint stays quiet while the keys are being taught
    const blinker = setInterval(() => { if (kbd.teach === 'l' || kbd.teach === 'r') kbd.teach = kbd.teach === 'l' ? 'r' : 'l'; }, 900);
    try {
      if (!await ask('tutor_move', 'r', () => inputSeen.move, 10000)) return;
      if (!await ask('tutor_jump', 'up', () => inputSeen.jump, 10000)) return;
      if (!await ask('tutor_magic', 'space', () => inputSeen.magic, 10000)) return;
      save.flags.tutorial = true; saveWrite();
    } finally {
      clearInterval(blinker);
      playFlow.tutoring = false;
      kbd.teach = null;
    }
  }

  /* The logic said 'clear': let the sisters cheer, record the stars, show the clear page, then on to the next room. */
  async function onRoomClear() {
    if (playFlow.phase !== 'play') return;
    const tok = playFlow.token;
    playFlow.phase = 'clear';
    game.kbd.teach = null;
    clearInput();
    const i = game.index, lv = LEVELS[i];
    const smalls = game.stars || { total: 0, got: 0 };
    markRoom(lv.id, { cleared: true, memory: !!game.memoryFound, stars: [true, !!game.memoryFound, smalls.total > 0 && smalls.got >= smalls.total] });
    await sleep(1500);
    if (stale(tok)) return;
    const next = () => {
      if (stale(tok)) return;
      if (i + 1 < LEVELS.length) enterRoom(i + 1); else finishGame();
    };
    if (typeof showClear === 'function') { try { showClear(lv, next); } catch (e) { console.error(e); next(); } } else next();
  }

  async function finishGame() {
    const tok = newToken();
    playFlow.phase = 'win';
    game.state = 'win';
    cheerBurst();
    if (typeof startMusic === 'function') guarded('startMusic', () => startMusic('end'));
    await sleep(2600);
    if (stale(tok)) return;
    const pages = storyPages(['win', 'end']);
    if (pages.length && typeof openStory === 'function') openStory(pages, goTitle); else goTitle();
  }

  /* ---- frame loop ---- */
  let last = 0, acc = 0, frameNo = 0;
  function frame(ms) {
    try {
      const dt = Math.min(.05, (ms - last) / 1000 || 0);
      last = ms;
      const now = ms / 1000;
      pollGamepad();
      const live = canPlay();
      if (live) {
        acc += dt;
        syncInput();
        while (acc >= STEP && game.state === 'play') {
          if (game.mode === 'solo' && companion) companion.update(STEP);
          game.step(STEP);
          acc -= STEP;
        }
        if (game.state !== 'play') acc = 0;
      } else { acc = 0; syncInput(); }
      handleEvents();
      drawSister('frost', now, dt);
      drawSister('nuan', now, dt);
      const n = game.sisters.nuan, fr = game.sisters.frost;
      lanternGlow.setAttribute('cx', (n.x + n.w / 2 + n.dir * 6).toFixed(1));
      lanternGlow.setAttribute('cy', (n.y + n.h - 26).toFixed(1));
      lanternGlow.setAttribute('visibility', n.splash > 0 ? 'hidden' : 'visible');
      lanternGlow.setAttribute('opacity', (.72 + Math.sin(now * 7) * .08).toFixed(2));
      frostGlow.setAttribute('cx', (fr.x + fr.w / 2).toFixed(1));
      frostGlow.setAttribute('cy', (fr.y + fr.h - 34).toFixed(1));
      frostGlow.setAttribute('visibility', fr.splash > 0 ? 'hidden' : 'visible');
      drawItemBob(now);
      drawFishFrame(now, dt);
      if (typeof updateToys === 'function') guarded('toys', () => updateToys(dt, now));   // 15-toys (+ 75-rewards tick)
      updateFragment(now);
      fxFrame(dt, now, live);
      if (typeof hud === 'function') guarded('hud', () => hud(game));
      if (++frameNo % 20 === 0) fitStage();
    } catch (e) {
      if (!reported.has('frame' + e.message)) { reported.add('frame' + e.message); console.error('[frame]', e); }
    }
    requestAnimationFrame(frame);
  }

  /* Decode every painting first, so frames never flash in empty. */
  const lineArts = Object.values(LINES.lines || {}).map(l => l && l.art).filter(Boolean);
  const names = [...new Set(['key', 'brick', 'water', 'pinkice', 'frozen', 'iceblock', 'door_open', 'door_closed', 'ball', 'two', 'snowman', 'flake', 'heart', 'gate', 'plate_up', 'plate_down', 'shelf0', 'shelf1', 'shelf2', 'drift0', 'drift1', ...lineArts, ...LEVELS.map(lv => lv.bg), ...Object.keys(SIZES).filter(k => k.startsWith('fx_') || /^fish_/.test(k) || /^(frost|nuan)_/.test(k))])];
  const loads = names.map(n => { const i = new Image(); i.src = SRC(n); return i.decode().catch(() => {}); });

  if (DEV) window.__dbg = { voice: typeof voice !== "undefined" ? voice : null, game, save, heardLog, playFlow, companion, guideFx, startGame, enterRoom, goTitle, inputSeen, saveWrite, markRoom };

  fitStage();
  applySettings();
  game.load(0);
  handleEvents();
  game.state = 'title';
  playFlow.phase = 'title';
  if (typeof showTitle === 'function') showTitle();
  const patience = new Promise(ok => setTimeout(ok, 1500));
  Promise.race([Promise.all(loads), patience]).finally(() => { fitStage(); requestAnimationFrame(frame); });
})();
</script>
