  const WORDS = [{"id":"heart","en":"heart","zh":"爱心","icon":"word_heart","room":"hall"},{"id":"star","en":"star","zh":"星星","icon":"word_star","room":"hall"},{"id":"door","en":"door","zh":"门","icon":"word_door","room":"hall"},{"id":"water","en":"water","zh":"水","icon":"word_water","room":"lake"},{"id":"ice","en":"ice","zh":"冰","icon":"word_ice","room":"lake"},{"id":"fish","en":"fish","zh":"小鱼","icon":"word_fish","room":"lake"},{"id":"slide","en":"slide","zh":"滑滑梯","icon":"word_slide","room":"slope"},{"id":"fast","en":"fast","zh":"快","icon":"word_fast","room":"slope"},{"id":"down","en":"down","zh":"向下","icon":"word_down","room":"slope"},{"id":"push","en":"push","zh":"推","icon":"word_push","room":"tower"},{"id":"open","en":"open","zh":"打开","icon":"word_open","room":"tower"},{"id":"gate","en":"gate","zh":"铁闸门","icon":"word_gate","room":"tower"},{"id":"jump","en":"jump","zh":"跳","icon":"word_jump","room":"spring"},{"id":"up","en":"up","zh":"向上","icon":"word_up","room":"spring"},{"id":"high","en":"high","zh":"高","icon":"word_high","room":"spring"},{"id":"bunny","en":"bunny","zh":"小雪兔","icon":"word_bunny","room":"bunny"},{"id":"home","en":"home","zh":"家","icon":"word_home","room":"bunny"},{"id":"carrot","en":"carrot","zh":"胡萝卜","icon":"word_carrot","room":"bunny"},{"id":"left","en":"left","zh":"左","icon":"word_left","room":"floe"},{"id":"right","en":"right","zh":"右","icon":"word_right","room":"floe"},{"id":"wait","en":"wait","zh":"等一等","icon":"word_wait","room":"floe"},{"id":"red","en":"red","zh":"红色","icon":"word_red","room":"music"},{"id":"yellow","en":"yellow","zh":"黄色","icon":"word_yellow","room":"music"},{"id":"blue","en":"blue","zh":"蓝色","icon":"word_blue","room":"music"},{"id":"snowman","en":"snowman","zh":"雪人","icon":"word_snowman","room":"ballroom"},{"id":"ball","en":"ball","zh":"球","icon":"word_ball","room":"ballroom"},{"id":"hat","en":"hat","zh":"帽子","icon":"word_hat","room":"ballroom"},{"id":"flower","en":"flower","zh":"花","icon":"word_flower","room":"garden"}   function drawTiles() {

     like a click. A learning scene still ignores the pad in its quiet first second, and a pad press with no ring on screen only

  function storyAcceptsPad(now) { return !story || !story.strict || now - story.openedAt >= STORY_QUIET_MS; }

  addEventListener('keydown', e => {
    const modal = uxState.modal;
    if (!modal && !story) return;
    uxWake();
    const t = /** @type {HTMLElement | null} */ (e.target), onBtn = t && t.classList && t.classList.contains && (t.classList.contains('ux-btn') || t.classList.contains('ux-card') || t.classList.contains('ux-tile'));
    if (modal) {
      if (e.code === 'Escape') { e.preventDefault(); $('modal').textContent = ''; uxState.modal = null; }
      else if (!onBtn && e.code !== 'F11' && !e.metaKey && !e.ctrlKey) e.stopImmediatePropagation();
      return;
    }
    const action = storyKeyAction(story, e.code, e.repeat, performance.now(), onBtn);
    if (action === 'pass') return;
    const activating = ['Enter', 'NumpadEnter', 'Space', 'Escape'].includes(e.code);
    if (!activating && (e.metaKey || e.ctrlKey || e.code === 'F11')) return;
    if (activating) e.preventDefault();
    e.stopImmediatePropagation();
    if (action === 'advance' && story.onKey) story.onKey();
  }, true);

  /* ---------- story pages ---------- */
  /* pages: [{ art, vo }] (art: image name, vo: voice line key). Older fields (title, lines, next) are ignored: no reading. */
  function openStory(pages, done) {
    const s = uxScreen('story', true);
    s.pages = pages; s.i = 0; s.done = done; s.onKey = () => uxStoryNext(s);
    uxInputReset();
    renderStory();
  }
  /* The funnel for touch and gamepad presses (80-input): strict scenes ignore a plain call, a jump or magic tap must not skip a
     lesson. `enterLike` (the gamepad's Start button, the same deliberate press as Enter) moves them after the quiet second. */
  function advanceStory(enterLike) {
    if (!story || !story.onKey) return;
    if (story.strict && !(enterLike === true && performance.now() - story.openedAt >= STORY_QUIET_MS)) return;
    story.onKey();
  }
  function uxStoryNext(s) {
    if (!uxAlive(s)) return;
    uxStopVoice();
    s.i++;
    if (s.i < s.pages.length) { renderStory(); return; }
    uxEnd(s, s.done);
  }
  function uxEnd(s, done) {
    if (!uxAlive(s)) return;
    uxState.tok = null; story = null;
    uxStopVoice();
    $('overlay').textContent = '';
    if (done) done();
  }
  function renderStory() {
    const s = story;
    if (!s || s.name !== 'story') return;
    const p = s.pages[s.i], n = s.pages.length, me = s.i;
    const art = p.art || (p.vo && uxLineArt(p.vo));
    const dots = n > 1 ? s.pages.map((_, k) => `<circle cx="${480 + (k - (n - 1) / 2) * 18}" cy="492" r="${k === me ? 6 : 4.5}" fill="${k === me ? '#ffd27a' : '#8090d6'}"/>`).join('') : '';
    const root = uxPaint(`<g class="page">
      ${art ? `<image href="${SRC(art)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>` : '<rect width="960" height="520" fill="#141c52"/>'}
      <rect y="360" width="960" height="160" fill="url(#bottomFade)"/>${dots}
      ${uxButton({ act: 'next', ui: 'next', icon: 'next', x: 880, y: 456, r: 38, plate: 'gold' })}</g>`);
    uxBind(root, { next: () => uxStoryNext(s) });
    if (p.vo) uxLine(p.vo).then(() => { if (uxAlive(s) && s.i === me) { const b = root.querySelector('[data-act="next"]'); if (b) b.classList.add('ux-pulse'); } });
    else root.querySelector('[data-act="next"]').classList.add('ux-pulse');
  }

  /* ---------- chapter card ---------- */
  function uxCardRow(words, y, w, h, gap, extra) {
    const n = words.length, x0 = (960 - (n * w + (n - 1) * gap)) / 2;
    return words.map((wd, k) => uxWordCard(wd, Object.assign({ x: x0 + k * (w + gap), y, w, h, slot: k }, extra && extra(wd, k)))).join('');
  }
  const uxPopSlot = (root, k) => { const n = root.querySelector(`[data-pop="${k}"]`); if (n) n.classList.add('show'); return n; };

  /* Room picture, one sentence from Anna, then the 3 words pop up one by one: "this level we look for heart", "say it", 1.5 s ear/mouth pause. */
  function showChapter(level, done) {
    const lv = uxLevel(level), words = uxRoomWords(lv), s = storyStrict(uxScreen('chapter', true));
    uxInputReset();
    /* the clear page of this room comes next: have its sentence, the quiz questions and the answers warm in the cache */
    uxPreload([uxKey('clear', lv.id), ...words.map(w => uxKey('quiz', w.id)), ...words.map(w => uxKey('word', w.id)), 'quiz_right_1', 'quiz_right_2', 'quiz_right_3', 'quiz_wrong_1', 'quiz_wrong_2', 'quiz_wrong_3']);
    const n = words.length, cw = 190, gap = 26, x0 = (960 - (n * cw + (n - 1) * gap)) / 2;
    const root = uxPaint(`<g class="page"><image href="${SRC(uxLineArt('ch_' + lv.id, lv.bg))}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect y="220" width="960" height="300" fill="url(#bottomFade)"/>
      ${uxCardRow(words, 296, cw, 190, gap)}
      <g id="uxCue" opacity="0" class="ux-soft"><g id="uxEar">${uxIcon('ear', 30)}</g><g id="uxMouth" visibility="hidden" class="ux-bounce">${uxIcon('mouth', 30)}</g></g>
      ${uxButton({ act: 'go', ui: 'next', icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' })}</g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { go: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    const cue = root.querySelector('#uxCue'), ear = root.querySelector('#uxEar'), mouth = root.querySelector('#uxMouth');
    const setCue = (k, kind) => {
      cue.setAttribute('transform', `translate(${x0 + k * (cw + gap) + cw / 2} 262)`);
      cue.setAttribute('opacity', kind ? '1' : '0');
      ear.setAttribute('visibility', kind === 'ear' ? 'visible' : 'hidden');
      mouth.setAttribute('visibility', kind === 'mouth' ? 'visible' : 'hidden');
    };
    (async () => {
      await uxLine('ch_' + lv.id);
      for (let k = 0; k < n; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page'); setCue(k, 'ear');
        await uxLine('learn_' + words[k].id);
        if (!uxAlive(s)) return;
        setCue(k, 'mouth');
        await uxWait(1500);
        if (!uxAlive(s)) return;
        setCue(k, null);
        await uxWait(250);
      }
      if (!uxAlive(s)) return;
      const b = root.querySelector('[data-act="go"]'); if (b) b.classList.add('ux-pulse');
    })();
  }

  /* ---------- recall (start of the next room) ---------- */
  /* The words of the room just left, then up to two older ones that are due for review (90-main builds `ids` with recallWordsFor;
     without `ids` it is just that room's words). An older word counts as reviewed once its line has been said, which keeps it
     out of the next recall. The room's own words are not marked: their recap is not a spaced review (src/lib/review.js). */
  function showRecall(prevLevel, done, ids) {
    const lv = prevLevel == null ? null : uxLevel(prevLevel), own = lv ? lv.words || [] : [];
    const words = uxWordList(Array.isArray(ids) ? ids : own);
    if (!lv || !words.length) { if (done) done(); return; }
    const s = storyStrict(uxScreen('recall', true));
    uxInputReset();
    const older = recallOlderIds(own, words.map(w => w.id));
    uxPreload(words.map(w => uxKey('recall', w.id)));
    const wide = words.length > 3;   // up to five cards: smaller, so the row still fits the page
    const root = uxPaint(`<g class="page"><image href="${SRC(lv.bg)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".5"/>
      ${wide ? uxCardRow(words, 150, 156, 196, 16) : uxCardRow(words, 140, 200, 230, 30)}
      ${uxButton({ act: 'skip', ui: 'next', icon: 'next', x: 886, y: 452, r: 34 })}</g>`);
    const finish = () => uxEnd(s, done);
    s.onKey = finish;
    uxBind(root, { skip: finish, word: el => { uxNudge(el); uxWordVoice(el.dataset.word); } });
    (async () => {
      for (let k = 0; k < words.length; k++) {
        if (!uxAlive(s)) return;
        uxPopSlot(root, k); uxSfx('page');
        await uxLine('recall_' + words[k].id);
        if (!uxAlive(s)) return;
        if (older.includes(words[k].id)) uxNoteReviewed(words[k].id);
        await uxWait(200);
      }
      await uxWait(500);
      finish();
    })();
  }

  /* ---------- clear page: stars, word cards, quiz ---------- */
  const UX_STAR_D = 'M0 -.8L.22 -.25L.8 -.22L.35 .15L.5 .72L0 .4L-.5 .72L-.35 .15L-.8 -.22L-.22 -.25Z';
  function uxStarsHtml(got) {
    const icon = [
      uxPic('door_open', -22, -34, 44, 68, `<rect x="-18" y="-30" width="36" height="60" rx="10" fill="#9fd6ff"/>`),
      uxPic('fx_glow', -34, -32, 68, 60, `<circle r="26" fill="#ffd27a" opacity=".6"/>`),
      uxPic('fx_star', -22, -22, 44, 44, `<g transform="scale(20)"><path d="${UX_STAR_D}" fill="#ffd27a"/></g>`),
    ];
    return got.map((g, k) => `<g transform="translate(${(k - 1) * 138} 0)"><g class="ux-pop" data-pop="s${k}">
      ${g ? '<circle r="62" fill="#fff0b8" opacity=".3"/>' : ''}
      <path d="${UX_STAR_D}" transform="scale(58)" fill="${g ? 'url(#goldGrad)' : '#1d2766'}" stroke="${g ? '#fff3c9' : '#5a6fca'}" stroke-width=".06" stroke-linejoin="round" opacity="${g ? 1 : .8}"/>
      <g transform="translate(0 78)" opacity="${g ? 1 : .35}">${icon[k]}</g></g></g>`).join('');
  }

  function showClear(level, done) {
    const lv = uxLevel(level), idx = uxLevelIndex(lv), words = uxRoomWords(lv), s = storyStrict(uxScreen('clear', true));
    uxInputReset();
    /* the next room opens with the recall of these words, then its chapter card: warm those lines while this page is up */
    const nextLv = LEVELS[idx + 1];
    if (nextLv) uxPreload([...words.map(w => uxKey('recall', w.id)), uxKey('ch', nextLv.id), ...uxRoomWords(nextLv).map(w => uxKey('learn', w.id))]);
    const g = game, memory = !!g.memoryFound;
    const small = !g.stars || g.stars.total === 0 ? true : g.stars.got >= g.stars.total;
    const got = [true, memory, small];   // 90-main has already stored these with markRoom()
    s.phase = 0; s.seq = 0;

    uxPaint(`<g class="page"><image id="uxBg" href="${SRC(uxLineArt('clear_' + lv.id, lv.bg))}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
      <rect width="960" height="520" fill="#0d1438" opacity=".55"/>
      <g id="uxStars" class="ux-star" style="transform:translate(480px,170px) scale(1)">${uxStarsHtml(got)}</g>
      <g id="uxBody"></g><g id="uxCtl"></g></g>`);
    const root = $('overlay'), body = root.querySelector('#uxBody'), ctl = root.querySelector('#uxCtl'), stars = /** @type {HTMLElement} */ (root.querySelector('#uxStars'));
    const word = el => { uxNudge(el); uxWordVoice(el.dataset.word); };
    const mark = () => { const me = ++s.seq; return () => uxAlive(s) && s.seq === me; };
    const setCtl = html => { ctl.innerHTML = html; uxBind(ctl, { next: () => s.onKey && s.onKey(), skip: () => finishPage(), replay: () => { if (uxAlive(s)) { uxEnd(s, null); uxHooks.replay(idx); } }, done: () => uxEnd(s, done) }); };
    const nextBtn = (act, ui) => uxButton({ act, ui, icon: 'next', x: 886, y: 452, r: 38, plate: 'gold' });

    /* A: stars pop, Anna's sentence */
    const phaseStars = () => {
      s.phase = 1; const ok = mark();
      s.onKey = () => { if (ok()) phaseWords(); };
      setCtl(nextBtn('next', 'next'));
      (async () => {
        const line = uxLine('clear_' + lv.id);
        for (let k = 0; k < 3; k++) {
          await uxWait(k ? 650 : 350);
          if (!ok()) return;
          uxPopSlot(root, 's' + k);
          if (got[k]) { uxSfx('star'); uxConfetti(root.querySelector('.page'), 480 + (k - 1) * 138, 170, 14); }
        }
        await line;
        await uxWait(500);
        if (ok()) phaseWords();
      })();
    };

    /* B: word cards, each said once; sparkle badge (no text) the first time. The next button shows as soon as all three have
       been said. Nothing is repeated to pad a count: the words come back in later recalls, quizzes and the review game. */
    const phaseWords = () => {
      s.phase = 2; const ok = mark();
      let ready = false;
      stars.style.transform = 'translate(480px,52px) scale(.42)';
      s.onKey = () => { if (ok() && ready) { uxStopVoice(); phaseQuiz(); } };
      const rec = words.map(w => uxWordRec(w.id));
      const isNew = rec.map(r => !r.seen);
      body.innerHTML = uxCardRow(words, 128, 200, 238, 30, (wd, k) => ({ isNew: isNew[k] }));
      uxBind(body, { word });
      setCtl('');
      (async () => {
        await uxWait(300);
        for (let k = 0; k < words.length; k++) {
          if (!ok()) return;
          uxPopSlot(root, k); uxSfx('page');
          rec[k].seen = true;
          await uxWordVoice(words[k].id);
          await uxWait(200);
        }
        if (!ok()) return;
        uxSaveNow();
        ready = true; setCtl(nextBtn('next', 'next')); ctl.querySelector('[data-act="next"]').classList.add('ux-pulse');
      })();
    };

    /* C: quiz, 3 big picture cards, spoken question, skippable. The wrong answers come from rooms already cleared, and every
       answer is stored as it is given (storyQuestion), so skipping or leaving half way loses nothing. */
    const phaseQuiz = () => {
      s.phase = 3; const ok = mark();
      s.onKey = null;   // the quiz has no keyboard way out: skip is the on-screen button only
      if (!words.length) { finishPage(); return; }
      const ids = words.map(w => w.id), rng = storyRng(), order = storyShuffle(words, rng), pool = uxQuizPool(lv);
      (async () => {
        for (let q = 0; q < order.length; q++) {
          if (!ok()) return;
          setCtl(uxButton({ act: 'skip', ui: 'quiz_skip', icon: 'next', x: 886, y: 452, r: 34 }));
          await storyQuestion(ok, body, order[q], quizOptions(order[q].id, ids, pool, save.words, rng), q, order.length);
          await uxWait(600);
        }
        if (ok()) { uxSaveNow(); finishPage(); }
      })();
    };

    /* D: done. Next is the big button; replay is the small one. */
    function finishPage() {
      if (!uxAlive(s)) return;
      s.phase = 4; ++s.seq;
      uxStopVoice();
      stars.style.transform = 'translate(480px,150px) scale(.8)';
      body.innerHTML = '';
      s.onKey = () => uxEnd(s, done);
      setCtl(uxButton({ act: 'done', ui: 'next', icon: 'next', x: 600, y: 360, r: 56, plate: 'gold', cls: 'ux-pulse' }) + uxButton({ act: 'replay', ui: 'replay', x: 360, y: 360, r: 42 }));
      uxLine('cheer_' + (1 + Math.floor(Math.random() * 4)));
      uxConfetti(root.querySelector('.page'), 480, 150, 24);
    }
    phaseStars();
  }

  /* ---------- questions: "which picture is it?", for the clear-page quiz and the wordbook's review game ---------- */
  /* Randomness comes from a seeded generator (src/lib/review.js), seeded from the save's room clock and a counter, never from the
     time of day: the same save asked the same way gives the same questions. */
  let storyDraws = 0;
  function storyRng() { return makeReviewRng(((save.roomClock || 0) * 7919 + ++storyDraws * 104729) >>> 0); }
  /* Fisher-Yates on a copy. */
  function storyShuffle(list, rng) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.min(i, Math.floor(rng() * (i + 1)));
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  /* One question: the picture cards pop up, Anna asks for `target` (quiz_<word>), and it ends when the child taps that card and
     the cheer has been said. A first wrong tap is stored at once as a miss; a right tap with no miss before it is stored at once
     as a first-try answer. Either way one answer per question, saved before the next question starts (uxNoteQuiz).
     target: the word asked for; ids: the word ids shown (3). q / total: the question number, for the dots and the cheer. */
  function storyQuestion(ok, body, target, ids, q, total) {
    const dots = Array.from({ length: total }, (_, k) => `<circle cx="${480 + (k - (total - 1) / 2) * 22}" cy="${112}" r="7" fill="${k < q ? '#ffd27a' : k === q ? '#fff' : '#5a6fca'}"/>`).join('');
    body.innerHTML = dots + uxCardRow(uxWordList(ids), 150, 210, 210, 28, () => ({ label: false, act: 'pick', show: false }));
    let wrong = 0, solved = false;
    /** @type {(value?: any) => void} */ let resolve = () => {};
    const result = new Promise(r => { resolve = r; });
    uxBind(body, {
      pick: el => {
        if (!ok() || solved) return;
        if (el.dataset.word === target.id) {
          solved = true;
          uxSfx('quiz_right'); uxConfetti(body, 480, 250, 36);
          if (!wrong) uxNoteQuiz(target.id, true);
          body.querySelectorAll('.ux-glowrect').forEach(n => { n.classList.remove('ux-glow'); n.setAttribute('opacity', '0'); });
          uxLine('quiz_right_' + (1 + q % 3), { interrupt: true }).then(() => resolve());
        } else {
          if (!wrong) uxNoteQuiz(target.id, false);
          wrong++; uxSfx('quiz_wrong');
          el.classList.remove('ux-shake'); void el.getBoundingClientRect(); el.classList.add('ux-shake');
          const right = body.querySelector(`[data-word="${target.id}"] .ux-glowrect`);
          if (right) right.classList.add('ux-glow');
          uxLine('quiz_wrong_' + (1 + (wrong - 1) % 3), { interrupt: true });
        }
      },
    });
    [0, 1, 2].forEach(k => { const n = body.querySelectorAll('[data-pop]')[k]; if (n) setTimeout(() => n.classList.add('show'), 80 * k); });
    uxLine('quiz_' + target.id);
    return result;
  }

  /* ---------- review game (wordbook): Anna says a word, the child taps its picture; 5 questions ---------- */
  const REVIEW_QUESTIONS = 5;
  /* done() runs when the child leaves. The questions are the words most in need of review (uxReviewQueue); the cards are the same
     as in the quiz, and each answer is stored the same way, so a missed word comes back sooner. */
  function showReview(done) {
    const queue = uxReviewQueue(REVIEW_QUESTIONS), pool = uxReviewPool();
    if (pool.length < 3 || !queue.length) { if (done) done(); return; }
    const s = storyStrict(uxScreen('review', true));
    uxInputReset();
    uxPreload([...queue.map(id => uxKey('quiz', id)), 'quiz_right_1', 'quiz_right_2', 'quiz_right_3', 'quiz_wrong_1', 'quiz_wrong_2', 'quiz_wrong_3']);
    uxPaint(`<g class="page"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".6"/>
      <g id="uxBody"></g><g id="uxCtl"></g></g>`);
    const root = $('overlay'), body = root.querySelector('#uxBody'), ctl = root.querySelector('#uxCtl');
    const setCtl = html => { ctl.innerHTML = html; uxBind(ctl, { back: () => uxEnd(s, done), done: () => uxEnd(s, done), replay: () => { if (uxAlive(s)) { uxEnd(s, null); showReview(done); } } }); };
    const rng = storyRng(), ok = () => uxAlive(s);
    (async () => {
      for (let q = 0; q < queue.length; q++) {
        if (!ok()) return;
        const target = uxWord(queue[q]), room = LEVELS.find(lv => (lv.words || []).includes(target.id)), roomIds = room ? room.words || [] : [];
        setCtl(uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 34 }));
        const shown = quizOptions(target.id, reviewLearned(save.words, roomIds), pool.filter(id => !roomIds.includes(id)), save.words, rng);
        await storyQuestion(ok, body, target, shown, q, queue.length);
        await uxWait(600);
      }
      if (!uxAlive(s)) return;
      uxSaveNow();
      uxStopVoice();
      s.onKey = () => uxEnd(s, done);
      body.innerHTML = '';
      setCtl(uxButton({ act: 'done', ui: 'next', icon: 'next', x: 600, y: 300, r: 56, plate: 'gold', cls: 'ux-pulse' }) + uxButton({ act: 'replay', ui: 'replay', x: 360, y: 300, r: 42 }));
      uxLine('cheer_' + (1 + (storyDraws % 4)));
      uxConfetti(root.querySelector('.page'), 480, 200, 24);
    })();
  }
  /* ===== d1 / view-ui: picture-button helpers, HUD, title, rooms, wordbook, meet-them, parent settings, subtitles =====
     Everything here is drawn as SVG strings into #hud / #overlay / #modal / #subs of the 960x520 stage.
     Private names carry the `ux` prefix so they cannot collide with the other view files (one shared scope).
     Cross-file names used (CONTRACT): voice.line/word/ui/stop, sfx, onSubtitle, setting/setSetting, save, markRoom, saveWrite,
     startMusic, wakeAudio, game, LEVELS, LINES, SRC, $. Each one is looked up through a guarded wrapper, so a missing piece
     degrades to silence instead of throwing. Nothing in this file calls into another file while the script is loading. */

  const uxState = { inited: false, tok: null, modal: null, hudBuilt: false, lit: {}, sig: '', player: '', tick: 0, seen: {} };
  const uxLocal = { subtitles: false, english: 'words+phrases', mode: 'solo', sound: true };
  const uxWait = ms => new Promise(r => setTimeout(r, ms));
  const uxInk = '#4a3a8c';
  const UX_HUE = ['#ff9cc0', '#ffd27a', '#9fd6ff', '#b9e3a5', '#d4b4ff', '#ffb98a'];

  /* ---------- guarded access to the other agents' APIs ---------- */
  function uxWake() { try { if (typeof wakeAudio === 'function') wakeAudio(); } catch (e) {} }
  function uxSetting(k) {
    try { if (typeof setting === 'function') { const v = setting(k); if (v !== undefined) return v; } } catch (e) {}
    return uxLocal[k];
  }
  function uxPutSetting(k, v) {
    uxLocal[k] = v;
    try { if (typeof setSetting === 'function') setSetting(k, v); } catch (e) {}
  }
  function uxLine(key, opts) {
    let p = null;
    try { if (typeof voice !== 'undefined' && voice && typeof voice.line === 'function') p = voice.line(key, opts); } catch (e) {}
    if (!p || typeof p.then !== 'function') return uxWait(800);
    return Promise.race([p.then(() => {}, () => {}), uxWait(20000)]);
  }
  function uxWordVoice(id) {
    let p = null;
    try { if (typeof voice !== 'undefined' && voice && typeof voice.word === 'function') p = voice.word(id); } catch (e) {}
    if (!p || typeof p.then !== 'function') return uxWait(900);
    return Promise.race([p.catch(() => false), uxWait(8000).then(() => false)]);
  }
  const uxKey = (stem, id) => stem + '_' + id;   // line keys built from a stem, e.g. uxKey('learn', 'heart')
  /* Warm the voice cache for lines that will play soon; unknown keys and a missing voice are ignored. */
  function uxPreload(keys) {

  const uxAlive = tok => uxState.tok === tok;
  function uxPaint(html) {
    const root = $('overlay');
    root.innerHTML = html;
    return root;
  }
  function uxClearOverlay() { $('overlay').textContent = ''; $('modal').textContent = ''; uxState.modal = null; }
  function uxInputReset() { try { if (typeof clearInput === 'function') clearInput(); } catch (e) {} }
  function uxApplySettings() {
    const on = !!uxSetting('subtitles'), b = document.body;
    const changed = b.classList.contains('subs') !== on;
    b.classList.toggle('subs', on);
    b.dataset.mode = uxSetting('mode') === 'duo' ? 'duo' : 'solo';
    if (!on) subtitleView(null);
    if (changed) dispatchEvent(new Event('resize'));   // 80-input refits the stage around the parent strip
  }
  /* The play flow belongs to 90-main: startGame(i) / goTitle() / enterRoom(i). These wrappers only keep this file
     usable if one of them is renamed (a plain game.start, no recall or chapter card). */
  const uxHooks = {
    play(i) {
      if (typeof startGame === 'function') { startGame(i); return; }
      uxClearOverlay(); story = null; uxState.tok = null;
      game.start(i === undefined ? 0 : i);
    },
    replay(i) {
      if (typeof enterRoom === 'function') { enterRoom(i); return; }
      uxHooks.play(i);
    },
    home() {
      if (typeof goTitle === 'function') { goTitle(); return; }
      uxStopVoice(); uxClearOverlay(); story = null;
      game.state = 'title'; try { game.load(0); } catch (e) {}
      showTitle();
    },
  };

  /* ---------- title ---------- */
  /* Four main buttons (start, rooms, wordbook, sticker book; PLAN D3). The two small corner buttons are not main buttons: "meet the
     sisters" (the wardrobe is a button inside that page) and the parent gear (a 2 s hold). */
  function showTitle() {
    const tok = uxScreen('title', false);
    uxClearOverlay();
    let cont = false;
    try { cont = !!(save.flags && save.flags.prologue) || LEVELS.some((_, i) => uxCleared(i)); } catch (e) {}
    const html = `<g class="page">
      <image href="${SRC('key')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>

      ${uxButton({ act: 'play', ui: cont ? 'continue' : 'start', icon: 'play', x: 480, y: 318, r: 66, plate: 'gold', cls: 'ux-pulse' })}
      ${uxButton({ act: 'rooms', ui: 'rooms', x: 372, y: 448, r: 36 })}
      ${uxButton({ act: 'words', ui: 'words', x: 480, y: 448, r: 36 })}
      ${uxButton({ act: 'stickers', ui: 'stickers', x: 588, y: 448, r: 36 })}
      ${uxButton({ act: 'meet', ui: 'meet', x: 42, y: 482, r: 24, cls: 'ux-minor' })}
      ${uxButton({ act: 'gear', ui: 'settings', icon: 'gear', x: 920, y: 484, r: 20, plate: 'dark', ring: true, cls: 'ux-minor' })}
    </g>`;
    const root = uxPaint(html);
    uxBind(root, {
      play: () => uxHooks.play(),

      gear: null,
    });
    const gear = root.querySelector('[data-act="gear"]');
    uxHold(gear, 2000, () => { if (uxAlive(tok)) showSettings(); });
    try { if (typeof startMusic === 'function') startMusic('title'); } catch (e) {}
  }
  function hideTitle() {
    const t = uxState.tok;
    if (t && ['title', 'rooms', 'words', 'meet'].includes(t.name)) { uxState.tok = null; uxClearOverlay(); }
  }

  /* ---------- rooms ---------- */
  /* One tile per room: its picture plus 1-4 dots (position in its row of four, colour by row), earned stars underneath. */
  function showRooms() {
    uxScreen('rooms', false);
    const cols = 4, rows = Math.ceil(LEVELS.length / cols), k = rows > 2 ? .88 : 1, tw = 176 * k, th = 99 * k, gx = 28, rowH = th + 40;
    const x0 = (960 - (cols * tw + (cols - 1) * gx)) / 2, y0 = 70 + (450 - (rows * rowH - 12)) / 2;

        ${dots}${open ? stars : ''}</g></g>`;

    const html = `<g class="page"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".62"/>

  /* ---------- meet them ---------- */

  /* ---------- wordbook ---------- */
  function uxBookPages() {
    const pages = [], all = uxAllWords();
    LEVELS.forEach(lv => {
      const ws = all.filter(w => w.room === lv.id);
      pages.push({ lv, words: (ws.length ? ws : uxRoomWords(lv)).slice(0, 3) });
    });
    const general = all.filter(w => !w.room);
    for (let i = 0; i < general.length; i += 3) pages.push({ lv: null, words: general.slice(i, i + 3) });
    return pages.filter(p => p.words.length);
  }
  function showWordbook(pageNo) {
    const tok = uxScreen('words', false);
    const pages = uxBookPages();
    let cur = Math.max(0, Math.min(pages.length - 1, pageNo || 0));
    const draw = () => {
      const pg = pages[cur];
      if (!pg) { showTitle(); return; }
      const n = pg.words.length, cw = 200, ch = 240, gap = 30, x0 = (960 - (n * cw + (n - 1) * gap)) / 2;
      const cards = pg.words.map((wd, k) => uxWordCard(wd, { x: x0 + k * (cw + gap), y: 150, w: cw, h: ch, silhouette: !uxWordKnown(wd.id), show: true })).join('');
      const head = pg.lv ? `<image href="${SRC(pg.lv.bg)}" x="400" y="26" width="160" height="90" preserveAspectRatio="xMidYMid slice" clip-path="inset(0 round 12px)"/><rect x="400" y="26" width="160" height="90" rx="12" fill="none" stroke="#ffd27a" stroke-width="3"/>`
        : `<g transform="translate(480 70) scale(34)">${uxGlyph('star')}</g>`;
      const dots = pages.map((_, k) => `<circle cx="${480 + (k - (pages.length - 1) / 2) * 16}" cy="478" r="${k === cur ? 6 : 4}" fill="${k === cur ? '#ffd27a' : '#8090d6'}"/>`).join('');
      const playable = uxReviewPool().length >= 3;   // the review game needs three words to choose between
      const html = `<g class="page"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".6"/>
        ${head}${cards}${dots}
        ${uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 28 })}
        ${uxButton({ act: 'review', ui: 'start', icon: 'ear', x: 906, y: 50, r: 34, plate: 'gold', cls: playable ? '' : 'dim' })}
        ${cur > 0 ? `<g transform="translate(54 270) scale(-1 1)">${uxButton({ act: 'prev', ui: 'back', icon: 'next', x: 0, y: 0, r: 34 })}</g>` : ''}
        ${cur < pages.length - 1 ? uxButton({ act: 'nextpage', ui: 'next', icon: 'next', x: 906, y: 270, r: 34 }) : ''}</g>`;
      const root = uxPaint(html);
      uxBind(root, {
        back: () => { uxStopVoice(); showTitle(); },
        prev: () => { cur--; draw(); },
        nextpage: () => { cur++; draw(); },
        review: el => {
          if (!playable) { uxNudge(el); return; }
          uxStopVoice();
          showReview(() => showWordbook(cur));
        },
        word: el => {
          const id = el.dataset.word;
          const was = uxWordKnown(id);
          uxNudge(el);
          if (!was && !uxWordOpen(id)) return;   // a silhouette of a room not opened yet: hearing it would count as learned
          uxWordVoice(id).then(() => {
            if (!uxAlive(tok) || was) return;
            draw();
          });
        },
      });
    };
    draw();
  }

  /* ---------- parent settings ---------- */
  /* Learning progress for the parent page (PLAN-2 C5): per core word, how often it was heard, the share of quiz questions
     answered right at the first tap (null before the first question) and how many rooms ago it was last met (null: never
     stamped). `lastSeen` is the room clock, not a date: the save has no wall clock. */
  function uxProgressRows() {
    const now = save.roomClock || 0;
    return LEVELS.map(lv => ({
      room: lv.id,
      words: (lv.words || []).map(id => {
        const w = save.words[id] || {}, tries = (w.quiz || 0) + (w.wrong || 0);
        return {
          id, en: uxWord(id).en, heard: w.heard || 0,
          accuracy: tries ? Math.round(100 * (w.quiz || 0) / tries) : null,
          ago: w.lastSeen > 0 ? Math.max(0, now - w.lastSeen) : null,
        };
      }),
    }));
  }
  function uxPlayTimeText(sec) {
    const total = Math.max(0, Math.floor(sec || 0)), m = Math.floor(total / 60);
    if (m >= 60) return `${Math.floor(m / 60)} 小时 ${m % 60} 分`;
    return m >= 1 ? `${m} 分 ${total % 60} 秒` : `${total} 秒`;
  }
  function uxProgressHtml() {
    const rows = uxProgressRows(), colW = 288, x0 = 62;
    const head = [0, 1, 2].map(c => `<text x="${x0 + c * colW + 130}" y="112" font-size="15" fill="#a9b6e2" text-anchor="middle">听过</text><text x="${x0 + c * colW + 190}" y="112" font-size="15" fill="#a9b6e2" text-anchor="middle">首答对</text><text x="${x0 + c * colW + 250}" y="112" font-size="15" fill="#a9b6e2" text-anchor="middle">最近</text>`).join('');
    const body = rows.map((r, i) => {
      const y = 126 + i * 34;
      const cells = r.words.map((w, c) => {
        const x = x0 + c * colW, low = w.accuracy !== null && w.accuracy < 60;
        return `<text class="latin" x="${x}" y="${y + 22}" font-size="18" fill="${w.heard ? '#f6f7ff' : '#8d96bd'}">${w.en}</text>
          <text x="${x + 130}" y="${y + 22}" font-size="17" fill="${w.heard ? '#f6f7ff' : '#8d96bd'}" text-anchor="middle">${w.heard}</text>
          <text x="${x + 190}" y="${y + 22}" font-size="17" fill="${low ? '#ffb1c9' : '#f6f7ff'}" text-anchor="middle">${w.accuracy === null ? '—' : w.accuracy + '%'}</text>
          <text x="${x + 250}" y="${y + 22}" font-size="15" fill="#c9d3f5" text-anchor="middle">${w.ago === null ? '—' : w.ago === 0 ? '刚刚' : w.ago + ' 间前'}</text>`;
      }).join('');
      return `<rect x="50" y="${y}" width="860" height="32" rx="10" fill="#1b2563" opacity="${i % 2 ? 0 : .7}"/>${cells}`;
    }).join('');
    return `<g class="page"><rect width="960" height="520" fill="#0d1438" opacity=".7"/>
      <rect x="30" y="20" width="900" height="480" rx="24" fill="#141c52" stroke="#4a5aa6" stroke-width="2"/>
      <text x="480" y="70" text-anchor="middle" font-size="30" fill="#f6f7ff">学习进度</text>
      <text x="880" y="70" text-anchor="end" font-size="20" fill="#ffd27a">累计游玩 ${uxPlayTimeText(save.totalPlaySeconds)}</text>
      ${head}${body}
      ${uxButton({ act: 'back', ui: 'back', icon: 'back', x: 78, y: 50, r: 28, plate: 'dark' })}</g>`;
  }

  const UX_OPT_H = 62;   // a settings option is a button too: 62 stage units are 66 CSS px on the reference tablet
  function showSettings(view) {

          ${icon ? `<g transform="translate(26 ${UX_OPT_H / 2}) scale(17)">${uxGlyph(icon, on ? '#4a2c05' : '#f6f7ff')}</g>` : ''}
          <text x="${icon ? w / 2 + 14 : w / 2}" y="${UX_OPT_H / 2 + 8}" text-anchor="middle" font-size="20" fill="${on ? '#4a2c05' : '#f6f7ff'}">${label}</text></g></g>`;

        ${row(100, '字幕', opt('subtitles', false, 336, 100, 216, '关') + opt('subtitles', true, 566, 100, 216, '开'))}
        ${row(170, '英文', opt('english', 'words', 336, 170, 216, '只念单词') + opt('english', 'words+phrases', 566, 170, 216, '单词 + 短语'))}
        ${row(240, '模式', opt('mode', 'solo', 336, 240, 216, '一个人玩', 'solo') + opt('mode', 'duo', 566, 240, 216, '和大人一起玩', 'duo'))}

        <g transform="translate(336 394)"><g class="ux-opt ux-btn" data-act="progress" data-ui="" tabindex="0" role="button" aria-label="学习进度">
          <rect class="ux-bg" width="446" height="${UX_OPT_H}" rx="14" fill="#27357f" stroke="#4a5aa6" stroke-width="2"/>

        ${uxButton({ act: 'close', ui: 'back', icon: 'close', x: 806, y: 30, r: 28, plate: 'dark' })}</g>`;
      uxBind(root, {

  /* ---------- subtitles (parents) ---------- */
  function subtitleView(sub) {
    const box = $('subs');
    if (!box) return;
    if (!sub || sub.bubble || !uxSetting('subtitles') || !sub.segments || !sub.segments.length) { box.textContent = ''; return; }   // sub.bubble: a sister speaking in play, 50-talk draws that one above her head
    const SIZE = 22, maxW = 640;
    const toks = [];
    for (const seg of sub.segments) {
      if (seg.en) toks.push({ t: seg.text, en: true, w: seg.text.length * 15 + 8 });
      else for (const ch of seg.text) toks.push({ t: ch, en: false, w: ch.charCodeAt(0) < 128 ? 12 : SIZE });
    }
    const lines = [[]]; let wsum = 0;
    for (const t of toks) {
      if (wsum + t.w > maxW && lines[lines.length - 1].length && !'，。、！？：；」…'.includes(t.t)) { lines.push([]); wsum = 0; }
      lines[lines.length - 1].push(t); wsum += t.w;
    }
    const width = Math.max(...lines.map(l => l.reduce((a, t) => a + t.w, 0))) + 56, h = lines.length * 36 + 20;
    const cx = 450, y = 506 - h;
    const hue = sub.who === 'frost' ? '#8fb6ea' : sub.who === 'nuan' ? '#e2a45e' : '#b9a8ff';
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const text = lines.map((l, i) => {
      let spans = '';
      for (const t of l) spans += t.en ? `<tspan class="latin" font-size="${SIZE + 4}" fill="#ffd27a" text-decoration="underline">${esc(t.t)}</tspan>` : `<tspan fill="#f6f7ff">${esc(t.t)}</tspan>`;
      return `<text x="${cx}" y="${y + 36 + i * 36 - 8}" text-anchor="middle" font-size="${SIZE}" xml:space="preserve">${spans}</text>`;
    }).join('');
    box.innerHTML = `<rect x="${cx - width / 2}" y="${y}" width="${width}" height="${h}" rx="16" fill="#0d1438" opacity=".82" stroke="${hue}" stroke-width="2"/>${text}`;
  }

  /* ---------- HUD ---------- */
  const UX_PILLS = [
    { id: 'flake', img: 'flake', col: '#cfe6ff' }, { id: 'heart', img: 'heart', col: '#ffb1c9' }, { id: 'ball', img: 'ball', col: '#f6f7ff' },
    { id: 'block', img: 'iceblock', col: '#cfe6ff' }, { id: 'star', img: 'fx_star', col: '#ffe4a8' },
  ];
  const UX_KEYS = [
    { id: 'left', kbd: 'l', x: 836, y: 466, w: 36 }, { id: 'right', kbd: 'r', x: 916, y: 466, w: 36 },
    { id: 'up', kbd: 'up', x: 876, y: 426, w: 36 }, { id: 'space', kbd: 'space', x: 696, y: 466, w: 132 },
  ];
  /* The four round buttons of the top bar, 68 apart: 30 stage units of plate is 64 CSS px on the reference tablet and the hold rings
     (restart, home) widen the touch area, so they must not crowd each other. The key diagram may reach up to the first of them. */
  const UX_HUD_X = { restart: 700, home: 768, hint: 836, fs: 904 };
  function buildHud() {
    uxInit();
    const keys = UX_KEYS.map(k => {
      const r = 8;
      return `<g transform="translate(${k.x + k.w / 2} ${k.y + 18})"><g class="ux-key" id="uxK_${k.id}"><g transform="translate(${-k.w / 2} -18)">
        <rect class="kb" width="${k.w}" height="36" rx="${r}" fill="#27357f" stroke="#cfe6ff" stroke-width="2" opacity=".82"/>

          <circle r="29" fill="${'#ffd27a'}" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
          <clipPath id="uxClipA"><circle r="25"/></clipPath>
          <g clip-path="url(#uxClipA)"><rect x="-25" y="-25" width="50" height="50" fill="#cfe0ff"/><image id="uxAvImg" x="-25" y="-25" width="50" height="50" preserveAspectRatio="xMidYMin slice"/></g>
          <g id="uxAvOther" transform="translate(30 20)"><circle r="14" fill="#cfe0ff" stroke="#fff" stroke-width="2" opacity=".95"/><clipPath id="uxClipB"><circle r="12"/></clipPath><image id="uxAvImg2" x="-12" y="-12" width="24" height="24" preserveAspectRatio="xMidYMin slice" clip-path="url(#uxClipB)"/></g>
        </g></g></g>
      <g id="uxPills" transform="translate(98 19)">${pills}</g>
      ${typeof restartRoomHeld === 'function' ? uxButton({ act: 'restart', ui: 'replay', icon: 'replay', x: UX_HUD_X.restart, y: 38, r: 30, plate: 'dark', keep: false, ring: true, cls: 'ux-minor' }) : ''}
      ${uxButton({ act: 'home', ui: 'back', icon: 'home', x: UX_HUD_X.home, y: 38, r: 30, plate: 'dark', keep: false, ring: true, cls: 'ux-minor' })}
      ${uxButton({ act: 'hint', ui: 'hint', icon: 'bulb', x: UX_HUD_X.hint, y: 38, r: 30, plate: 'dark', keep: false, cls: 'ux-minor' })}
      ${uxButton({ act: 'fs', ui: 'fullscreen', icon: 'fullscreen', x: UX_HUD_X.fs, y: 38, r: 30, plate: 'dark', keep: false, cls: 'ux-minor' })}
      <g id="uxKeysPos"><g id="uxKeys">${keys}</g></g></g>`;
    const root = $('hud');
    uxBind(root, {
      hint: el => {
        let tgt = null;
        try { tgt = game.guide && game.guide(); } catch (e) {}
        if (tgt && tgt.say) uxLine(tgt.say, { interrupt: true }); else uxNudge(el);
      },
      fs: () => {
        try {
          if (typeof toggleFullscreen === 'function') { toggleFullscreen(); return; }
          const d = document, r = d.documentElement;
          if (d.fullscreenElement) d.exitFullscreen(); else r.requestFullscreen();
        } catch (e) {}
      },
    });
    uxHold(root.querySelector('[data-act="home"]'), 1500, () => uxHooks.home());
    const restart = root.querySelector('[data-act="restart"]');   // a long press, never a tap: a stray finger must not wipe the room
    if (restart) uxHold(restart, 1000, () => { if (typeof restartRoomHeld === 'function') restartRoomHeld(); });
    uxState.hudBuilt = true; uxState.sig = '';
  }

  function hud(g) {
    g = g || game;
    if (!uxState.hudBuilt) buildHud();
    const root = $('uxHud');
    if (!root) return;
    if ((uxState.tick++ & 31) === 0) uxApplySettings();
    const show = g.state !== 'title' && !story && !uxState.modal;
    root.setAttribute('visibility', show ? 'visible' : 'hidden');
    if (!show) return;
    const solo = g.mode !== 'duo';
    /* avatar: the player's portrait big, the companion small */
    const me = 'frost', other = 'nuan';
    if (uxState.player !== me + g.mode) {
      uxState.player = me + g.mode;
      $('uxAvImg').setAttribute('href', SRC('portrait_' + me));
      $('uxAvImg2').setAttribute('href', SRC('portrait_' + other));
      $('uxAv').setAttribute('pointer-events', 'none');
    }
    /* counters with icons; only the kinds this room has, laid out left to right */
    const items = g.items || [];
    const cnt = k => { let a = 0, b = 0; for (const it of items) if (it.kind === k) { b++; if (it.got) a++; } return [a, b]; };
    const [f0, f1] = cnt('*'), [h0, h1] = cnt('h'), [b0, b1] = cnt('o');
    const st = g.stars ? [g.stars.got, g.stars.total] : cnt('+');
    const nb = g.blocks ? g.blocks.length : 0;
    const vals = { flake: [f0 + '/' + f1, f1 > 0], heart: [h0 + '/' + h1, h1 > 0], ball: [b0 + '/' + b1, b1 > 0], block: [nb + '/' + (typeof MAX_BLOCKS !== 'undefined' ? MAX_BLOCKS : 3), nb > 0], star: [st[0] + '/' + st[1], st[1] > 0] };
    let x = 0;
    for (const p of UX_PILLS) {
      const [txt, vis] = vals[p.id], n = $('uxP_' + p.id);
      if (!vis) { if (n.getAttribute('visibility') !== 'hidden') n.setAttribute('visibility', 'hidden'); continue; }
      if (n.getAttribute('visibility') !== 'visible') n.setAttribute('visibility', 'visible');
      n.setAttribute('transform', `translate(${x} 0)`);
      const t = n.lastElementChild;
      if (t.textContent !== txt) t.textContent = txt;
      x += 92;
    }
    /* keyboard diagram (solo only): game.kbd is kept by 80-input, teach = the key the tutorial asks for. A tap stays lit a moment. */
    /* The diagram rides in the top bar just after the counter pills (off the floor and the door).
       UX_KEYS span x 696..952, y 426..502 in stage units; KB_S keeps even 5 pills + diagram left of the buttons at x 750. */
    const kbX = 98 + x + 12, KB_S = Math.max(.34, Math.min(.62, (typeof restartRoomHeld === 'function' ? UX_HUD_X.restart - 44 - kbX : UX_HUD_X.home - 44 - kbX) / 256));   // 256 = width of UX_KEYS in stage units
    $('uxKeysPos').setAttribute('transform', `translate(${(kbX - 696 * KB_S).toFixed(1)} ${(14 - 426 * KB_S).toFixed(1)}) scale(${KB_S})`);
    const kroot = $('uxKeys'), kbd = g.kbd || {}, now = performance.now();
    kroot.setAttribute('visibility', solo ? 'visible' : 'hidden');
    if (solo) {
      for (const k of UX_KEYS) {
        if (kbd[k.kbd]) uxState.lit[k.id] = now;
        const n = $('uxK_' + k.id);
        n.classList.toggle('lit', !!kbd[k.kbd] || now - (uxState.lit[k.id] || -1e9) < 140);
        n.classList.toggle('teach', kbd.teach === k.kbd);
      }
    }
  }
  /* ===== e / view-rewards: sticker book, wardrobe, hat overlay, sticker-earned celebration (PLAN B2, CONTRACT §11) =====
     Save fields used: save.stickers[] (ids), save.board[{id,x,y}] (x, y are fractions 0..1 of the sticker board, the
     sticker's centre), save.outfit[who] {dress 0..2, hat id|null}.
     Sticker ids: '<lv>' (room cleared), '<lv>_gold' (all three stars), 'words5_<k>' (every 5 words heard). Pictures:
     sticker_<id> (words5_<k> uses sticker_words5), sticker_board; dresses '<who>_<frame>_d<k>' (all twelve frames or none);
     hats 'hat_<id>' with head offsets in SIZES.hat_offsets (see rwHatOffset). Anything not delivered is drawn as a vector shape.
     The screens reuse the picture-button helpers of 70-ui (uxScreen, uxPaint, uxButton, uxBind, uxPic, ...).
     Private names carry the `rw` prefix (one shared view scope). */

  const RW_UNLOCK = { dress1: 3, dress2: 6, bow: 3, clip: 6, wreath: 10, crown: 10 };   // stickers needed (PLAN B2: 3 / 6 / 10)
  const RW_HATS = ['bow', 'clip', 'wreath', 'crown'];
  const RW_DRESS_COL = { frost: ['#78bce2', '#75d8b8', '#ef6e9f'], nuan: ['#285e9b', '#2b8c89', '#8055ad'] };
  const RW_HAT_W = 28, RW_HAT_SINK = 7;   // hat width in game units, and how far its lower edge sits into the hair
  const RW_BOARD = { x: 40, y: 78, w: 672, h: 378 };
  const RW_STICKER = 76;                  // size of a sticker on the board
  const rwState = { ver: 0, toasts: [], toast: null, fresh: new Set(), wordsAt: -1, tick: 0, drawn: { frost: null, nuan: null } };

  /* ---------- the catalogue and the save ---------- */
  const rwSave = () => { try { return save; } catch (e) { return null; } };
  const rwHas = id => { const s = rwSave(); return !!(s && Array.isArray(s.stickers) && s.stickers.includes(id)); };
  const rwCount = () => { const s = rwSave(); return s && Array.isArray(s.stickers) ? s.stickers.length : 0; };
  const rwWordsKnown = () => { const s = rwSave(); return !s ? 0 : WORDS.filter(w => { const r = s.words && s.words[w.id]; return r && (r.heard > 0 || r.seen); }).length; };
  function rwCatalog() {
    const out = [];
    LEVELS.forEach((lv, i) => { out.push({ id: lv.id, room: i, gold: false }); out.push({ id: lv.id + '_gold', room: i, gold: true }); });
    for (let k = 1; k <= Math.floor(WORDS.length / 5); k++) out.push({ id: 'words5_' + k, words: k });
    return out;
  }
  const rwImgName = id => (/^words5_/.test(id) ? 'sticker_words5' : 'sticker_' + id);

  /* Give every sticker the save has earned the right to. levelId limits the room checks (null: all rooms). Returns the new ids.
     quiet: no celebration (the book catches up silently when it opens). Safe to call any number of times. */
  function awardStickers(levelId, quiet) {
    const s = rwSave();
    if (!s) return [];
    if (!Array.isArray(s.stickers)) s.stickers = [];
    const added = [];
    const give = id => { if (!s.stickers.includes(id)) { s.stickers.push(id); added.push(id); } };
    for (const lv of LEVELS) {
      if (levelId && lv.id !== levelId) continue;
      const r = s.rooms && s.rooms[lv.id];
      if (!r) continue;
      if (r.cleared) give(lv.id);
      if (r.cleared && r.stars && r.stars[0] && r.stars[1] && r.stars[2]) give(lv.id + '_gold');
    }
    const known = rwWordsKnown();
    rwState.wordsAt = known;
    for (let k = 1; k <= Math.floor(known / 5); k++) give('words5_' + k);
    if (added.length) {
      const before = s.stickers.length - added.length;
      try { saveWrite(); } catch (e) {}
      added.forEach(id => rwState.fresh.add(id));
      if (!quiet) {
        added.forEach(id => rwState.toasts.push({ id }));
        if ([3, 6, 10].some(n => before < n && s.stickers.length >= n)) rwState.toasts.push({ wardrobe: true });
      }
    }
    return added;
  }

  /* ---------- sticker pictures ---------- */
  function rwStickerPlaceholder(id, s) {
    const r = s / 2, st = 'stroke="#ffffff" stroke-width="' + Math.max(3, s * .06).toFixed(1) + '"';
    if (/^words5_/.test(id)) {
      return `<circle r="${r}" fill="#ff9cc0" ${st}/><g transform="scale(${(s * .3).toFixed(1)})">${uxGlyph('book')}</g>`;
    }
    const gold = /_gold$/.test(id), lvId = id.replace(/_gold$/, ''), i = Math.max(0, LEVELS.findIndex(l => l.id === lvId));
    const col = UX_HUE[i % UX_HUE.length];
    const ring = gold ? `<circle r="${(r - s * .07).toFixed(1)}" fill="none" stroke="#ffd27a" stroke-width="${(s * .07).toFixed(1)}"/>` : '';
    return `<circle r="${r}" fill="${gold ? '#fff3c9' : col}" ${st}/><circle r="${(r * .62).toFixed(1)}" fill="${gold ? '#ffd27a' : '#ffffff'}" opacity="${gold ? 1 : .55}"/>${ring}<g transform="scale(${(s * .27).toFixed(1)})">${uxGlyph('star')}</g>`;
  }
  const rwStickerArt = (id, s) => uxPic(rwImgName(id), -s / 2, -s / 2, s, s, rwStickerPlaceholder(id, s));
  /* The same, but for a sticker that is not earned yet: a grey shape. */
  const rwSilhouette = s => `<circle r="${s / 2}" fill="#8d96bd" opacity=".45" stroke="#c6ccea" stroke-width="2.5" stroke-dasharray="7 6"/>`;

  /* ---------- the celebration ---------- */
  function rwToastLayer() {
    let g = $('rewardPop');
    if (!g) { g = el('g', { id: 'rewardPop', 'pointer-events': 'none', 'aria-hidden': 'true' }); const subs = $('subs'); if (subs && subs.parentNode) subs.parentNode.insertBefore(g, subs); else $('stage').appendChild(g); }
    return g;
  }
  function rwStartToast(t) {
    const box = rwToastLayer();
    box.textContent = '';
    const g = el('g', {}, box), size = game.state === 'play' ? 104 : 130;
    const rays = el('g', {}, g), pop = el('g', {}, g);
    el('circle', { r: size * .95, fill: 'url(#warm)' }, g);
    for (let k = 0; k < 8; k++) el('path', { d: `M${size * .52} -4L${size * .98} 0L${size * .52} 4Z`, fill: '#ffe27a', opacity: .75, transform: `rotate(${k * 45})` }, rays);
    pop.innerHTML = t.wardrobe
      ? `<circle r="${size / 2}" fill="url(#plateGrad)" stroke="#fff" stroke-width="4"/><g transform="scale(${(size * .3).toFixed(1)})">${uxGlyph('wardrobe')}</g>`
      : rwStickerArt(t.id, size);
    rwState.toast = { g, rays, pop, t: 0, size, cx: 480, cy: game.state === 'play' ? 300 : 330 };
    g.setAttribute('transform', 'translate(480 330) scale(0)');
    try { sfx('unlock'); } catch (e) {}
    try { uxConfetti(box, rwState.toast.cx, rwState.toast.cy, 24); } catch (e) {}
  }
  function rwToastTick(dt) {
    let T0 = rwState.toast;
    if (!T0 && rwState.toasts.length) { rwStartToast(rwState.toasts.shift()); T0 = rwState.toast; }
    if (!T0) return;
    T0.t += dt;
    const t = T0.t, IN = .55, HOLD = 1.9, OUT = .45;
    let sc, y = T0.cy, op = 1;
    if (t < IN) { const u = t / IN, c1 = 1.9; sc = 1 + (c1 + 1) * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
    else if (t < IN + HOLD) sc = 1 + Math.sin((t - IN) * 5) * .035;
    else { const u = Math.min(1, (t - IN - HOLD) / OUT); sc = 1 - u * .25; y -= u * 40; op = 1 - u; }
    T0.g.setAttribute('transform', `translate(${T0.cx} ${y.toFixed(1)}) scale(${Math.max(0, sc).toFixed(3)})`);
    T0.g.setAttribute('opacity', op.toFixed(2));
    T0.rays.setAttribute('transform', `rotate(${(t * 40).toFixed(1)})`);
    T0.pop.setAttribute('transform', `rotate(${(Math.sin(t * 6) * 4 * Math.max(0, 1 - t / 1.2)).toFixed(2)})`);
    if (t > IN + HOLD + OUT) { T0.g.remove(); rwState.toast = null; }
  }
  /* Called every frame by updateToys (15-toys): the celebration, and now and then a look at the words heard. */
  function rewardsTick(dt) {
    try {
      rwToastTick(Math.min(dt, .05));
      if ((++rwState.tick & 63) === 0 && rwWordsKnown() !== rwState.wordsAt) awardStickers(null);
    } catch (e) { if (!rwState.err) { rwState.err = 1; console.error('[rewards]', e); } }
  }

  /* ---------- pointer helpers ---------- */
  function rwPoint(ev) {
    const m = /** @type {any} */ ($('overlay')).getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  const rwInBoard = p => p.x >= RW_BOARD.x && p.x <= RW_BOARD.x + RW_BOARD.w && p.y >= RW_BOARD.y && p.y <= RW_BOARD.y + RW_BOARD.h;
  const rwClamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- sticker book ---------- */
  function showStickers(pageNo) {
    try { rwShowStickers(pageNo || 0); } catch (e) { console.error('[stickers]', e); try { showTitle(); } catch (e2) {} }
  }
  function rwShowStickers(pageNo) {
    const tok = uxScreen('stickers', false);
    awardStickers(null, true);
    const per = 18, cols = 3, cell = 64, tx0 = 738, ty0 = 112;
    let page = pageNo, first = true;
    const earned = () => rwSave().stickers.filter(id => rwCatalog().some(c => c.id === id));
    const board = () => rwSave().board;
    const free = () => earned().filter(id => !board().some(b => b.id === id));
    /* the tray shows the stickers that are not on the board, then grey shapes for the room stickers still to win */
    const trayList = () => {
      const out = free().map(id => ({ id, got: true }));
      for (const c of rwCatalog()) if (!c.words && !c.gold && !rwHas(c.id)) out.push({ id: c.id, got: false });
      return out;
    };

    const draw = () => {
      const list = trayList(), pages = Math.max(1, Math.ceil(list.length / per));
      page = rwClamp(page, 0, pages - 1);
      const tray = list.slice(page * per, page * per + per).map((it, k) => {
        const x = tx0 + (k % cols) * cell + cell / 2, y = ty0 + Math.floor(k / cols) * cell + cell / 2;
        if (!it.got) return `<g transform="translate(${x} ${y})">${rwSilhouette(52)}</g>`;
        return `<g transform="translate(${x} ${y})"><g class="ux-btn rw-item ${rwState.fresh.has(it.id) ? 'ux-bounce' : ''}" data-id="${it.id}" data-from="tray" data-ui="" tabindex="-1">
          <circle r="31" fill="#000" fill-opacity="0" pointer-events="all"/>${rwStickerArt(it.id, 56)}</g></g>`;
      }).join('');
      const placed = board().filter(b => rwHas(b.id)).map(b => {
        const x = RW_BOARD.x + b.x * RW_BOARD.w, y = RW_BOARD.y + b.y * RW_BOARD.h;
        return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="ux-btn rw-item" data-id="${b.id}" data-from="board" data-ui="" tabindex="-1">
          <circle r="${RW_STICKER / 2 + 2}" fill="#000" fill-opacity="0" pointer-events="all"/>${rwStickerArt(b.id, RW_STICKER)}</g></g>`;
      }).join('');
      const B = RW_BOARD;
      const boardArt = uxPic('sticker_board', B.x, B.y, B.w, B.h,
        `<rect x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="20" fill="#27357f"/>
         <rect x="${B.x}" y="${B.y + B.h * .62}" width="${B.w}" height="${B.h * .38}" rx="20" fill="#3b4a96"/>
         <path d="M${B.x + 120} ${B.y + B.h * .7}V${B.y + B.h * .34}l24 -34 24 34V${B.y + B.h * .7}ZM${B.x + 250} ${B.y + B.h * .7}V${B.y + B.h * .2}l40 -50 40 50V${B.y + B.h * .7}ZM${B.x + 410} ${B.y + B.h * .7}V${B.y + B.h * .36}l24 -34 24 34V${B.y + B.h * .7}Z" fill="#5a6fca" opacity=".8"/>
         <circle cx="${B.x + B.w - 90}" cy="${B.y + 70}" r="32" fill="#fff3c9" opacity=".85"/>`, 'clip-path="inset(0 round 20px)"');
      const html = `<g class="${first ? 'page' : ''}"><image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/><rect width="960" height="520" fill="#0d1438" opacity=".62"/>
        ${boardArt}<rect id="rwBoardRing" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="20" fill="none" stroke="#ffd27a" stroke-width="5" opacity="0"/>
        <g id="rwPlaced">${placed}</g>
        <rect x="${tx0 - 10}" y="${ty0 - 14}" width="${cols * cell + 20}" height="${per / cols * cell + 24}" rx="18" fill="#141c52" opacity=".55"/>
        ${tray}
        ${uxButton({ act: 'back', ui: 'back', x: 52, y: 44, r: 28 })}
        ${page > 0 ? `<g transform="translate(${tx0 + 40} 486) scale(-1 1)">${uxButton({ act: 'prev', ui: 'back', icon: 'next', x: 0, y: 0, r: 26 })}</g>` : ''}
        ${page < pages - 1 ? uxButton({ act: 'nextpage', ui: 'next', icon: 'next', x: tx0 + 150, y: 486, r: 26 }) : ''}
        <g id="rwDrag" pointer-events="none"></g></g>`;
      first = false;
      const root = uxPaint(html);
      uxBind(root, { back: () => showTitle(), prev: () => { page--; draw(); }, nextpage: () => { page++; draw(); } });
      root.querySelectorAll('.rw-item').forEach(n => n.addEventListener('pointerdown', ev => startDrag(ev, n)));
      rwState.fresh.clear();
    };

    /* a free spot for a sticker that was only tapped */
    const spot = () => {
      const taken = board().map(b => ({ x: b.x * RW_BOARD.w, y: b.y * RW_BOARD.h }));
      for (let k = 0; k < 60; k++) {
        const x = (.1 + ((k * 0.213) % .8)) * RW_BOARD.w, y = (.16 + ((k * 0.137 + Math.floor(k / 5) * .11) % .7)) * RW_BOARD.h;
        if (taken.every(t => Math.hypot(t.x - x, t.y - y) > RW_STICKER * .8)) return { fx: x / RW_BOARD.w, fy: y / RW_BOARD.h };
      }
      return { fx: .15 + Math.random() * .7, fy: .2 + Math.random() * .6 };
    };
    const place = (id, fx, fy) => {
      const b = board();
      const i = b.findIndex(x => x.id === id);
      if (i >= 0) b.splice(i, 1);
      b.push({ id, x: +rwClamp(fx, .06, .94).toFixed(4), y: +rwClamp(fy, .08, .94).toFixed(4) });   // last = on top
    };

    /* One finger (pointer) owns a drag from its pointerdown to its up / cancel; the pointer is captured by the sticker so the moves
       and the lift arrive even outside the picture, and every other pointer (a second finger, the mouse) is ignored meanwhile. */
    let dragPointer = null;
    const startDrag = (ev, n) => {
      if (ev.button || dragPointer !== null) return;
      ev.preventDefault(); ev.stopPropagation(); uxWake();
      const id = n.dataset.id, from = n.dataset.from, p0 = rwPoint(ev), dragBox = $('rwDrag');
      if (!dragBox) return;
      const pid = ev.pointerId;
      dragPointer = pid;
      try { if (n.setPointerCapture) n.setPointerCapture(pid); } catch (e) {}
      const proxy = el('g', { transform: `translate(${p0.x} ${p0.y}) scale(1.12)` }, dragBox);
      proxy.innerHTML = rwStickerArt(id, RW_STICKER);
      n.parentNode.setAttribute('opacity', '.28');
      uxSfx('click');
      let moved = false;
      const ring = $('rwBoardRing');
      const move = e => {
