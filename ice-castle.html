<style>
/* Layout: a painted picture-book page fills the screen; a quiet caption band sits under it. */
:root {
  --night: #141c46;
  --ink: #1b2559;
  --line: #4a5aa6;
  --ice: #cfe6ff;
  --paper: #f6f7ff;
  --gold: #ffd27a;
  --ember: #ffbd7e;
  --muted: #a9b6e2;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --latin: "Fredoka", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  overscroll-behavior: none;
}
/* The stage is as big as the window allows (960:520), never scrolls. Parent subtitles reserve a band under it. */
#stage {
  display: block;
  width: min(100vw, calc(100dvh * 960 / 520));
  height: auto;
  background: #2a3a86;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
}
body.subs #stage { width: min(100vw, calc((100dvh - 84px) * 960 / 520)); }
body.touch #stage { width: min(100vw, calc((100dvh - 84px) * 960 / 520)); }
#stage text { font-family: var(--display); }
#stage .latin { font-family: var(--latin); font-weight: 600; }
.btn { cursor: pointer; outline: none; }
.page { animation: pageIn .45s ease-out both; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
.gateArt { transition: transform .35s ease; }
.flicker { animation: flicker 3.2s ease-in-out infinite alternate; }
@keyframes flicker { 0% { opacity: .55; } 40% { opacity: .9; } 70% { opacity: .68; } 100% { opacity: 1; } }
.shimmer { animation: shimmer 2.4s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .82; } to { opacity: 1; } }
.flake { animation: fall linear infinite; }
@keyframes fall { from { transform: translate(0, -30px); } to { transform: translate(38px, 560px); } }

/* ---- Picture buttons (60-story.js / 70-ui.js build them; position lives on an outer <g>, scale on .ux-btn) ---- */
.ux-btn, .ux-card, .ux-tile { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center; transition: transform .14s ease-out; -webkit-tap-highlight-color: transparent; }
.ux-btn:hover, .ux-btn:focus-visible, .ux-tile:hover, .ux-tile:focus-visible { transform: scale(1.1); }
.ux-card:hover, .ux-card:focus-visible { animation: uxWig .6s ease-in-out; }
.ux-btn:active, .ux-tile:active { transform: scale(.95); }
.ux-btn:focus-visible .ux-plate, .ux-tile:focus-visible .ux-frame { stroke: var(--gold); stroke-width: 4; }
.ux-btn.dim { opacity: .5; }
.ux-pulse { animation: uxPulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
.ux-pop { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; }
.ux-pop.show { animation: uxPop .55s cubic-bezier(.3, 1.5, .5, 1) forwards; }
@keyframes uxPop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.ux-wig { animation: uxWig .5s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes uxWig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg) scale(1.05); } 75% { transform: rotate(5deg) scale(1.05); } }
.ux-shake { animation: uxShake .4s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes uxShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.ux-glow { animation: uxGlow 1s ease-in-out infinite alternate; }
@keyframes uxGlow { from { opacity: .25; } to { opacity: 1; } }
.ux-bob { animation: uxBob .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
@keyframes uxBob { from { transform: translateY(0) scale(1); } to { transform: translateY(-8px) scale(1.03); } }
.ux-bounce { animation: uxBounce .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes uxBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.ux-star { transition: transform .7s cubic-bezier(.3, 1.2, .4, 1); }
.ux-ring { transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; stroke-dashoffset: var(--len); transition: stroke-dashoffset .25s ease-out; }
.ux-hold .ux-ring { stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold, 2s) linear; }
.ux-key { transition: transform .08s, opacity .2s; transform-box: fill-box; transform-origin: center; opacity: .8; }   /* slightly quiet until pressed or taught; it sits in the top bar after the counters */
.ux-key.lit, .ux-key.teach { opacity: 1; }
.ux-key.lit { transform: scale(1.14); }
.ux-key.teach { animation: uxPulse .7s ease-in-out infinite; }
.ux-conf { animation: uxConf 1.5s cubic-bezier(.15, .7, .35, 1) forwards; transform-box: fill-box; transform-origin: center; }
@keyframes uxConf { 0% { transform: translate(0, 0) rotate(0) scale(.4); opacity: 1; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; } }
.rw-item { cursor: grab; touch-action: none; }
.rw-item:active { cursor: grabbing; }
.rw-choice[data-state="lock"], .rw-choice[data-state="miss"] { cursor: not-allowed; }
.ux-opt rect { transition: fill .12s; }
.ux-opt:hover rect.ux-bg { fill: #5a6fca; }
.ux-soft { transition: opacity .3s; }
@media (prefers-reduced-motion: reduce) {
  .flake, .flicker, .shimmer, .page, .ux-pulse, .ux-bob, .ux-bounce, .ux-glow, .ux-key.teach { animation: none; }
  .flake { display: none; }
}

/* ---- Parent strip under the stage: hint line and key legends, only while parent subtitles are on ---- */
#info {
  width: min(100vw, calc((100dvh - 84px) * 960 / 520));
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 28px; align-items: start;
  font-size: 13px; line-height: 1.5; padding: 0 12px; box-sizing: border-box; max-height: 68px; overflow: hidden;
}
body:not(.subs) #info { display: none; }
#hint { min-width: 0; color: var(--ice); text-wrap: pretty; }
.keys { color: var(--muted); white-space: nowrap; }
.keys b { font-weight: 600; display: block; }
.keys.frost b { color: var(--ice); } .keys.nuan b { color: var(--ember); }
body[data-mode="solo"] .keys.frost, body:not([data-mode]) .keys.frost { display: none; }
body[data-mode="duo"] .keys.solo { display: none; }
body[data-mode="solo"] .keys.nuan, body:not([data-mode]) .keys.nuan { display: none; }
body[data-mode="solo"] #tSwitch { display: none; }
body[data-mode="solo"] #touch { grid-template-columns: repeat(4, minmax(0, 1fr)); }
kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--paper); }

/* ---- Touch pad: symbols only ---- */
#touch { display: none; width: min(100%, 720px); gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 12px; box-sizing: border-box; }
#touch button {
  appearance: none; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); color: var(--paper);
  font-family: var(--display); font-size: 26px; min-height: 64px; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
#touch button.on { background: #5a6fca; }
#touch #tSwitch { color: var(--gold); }
body.touch #touch { display: grid; }
body.touch #info { grid-template-columns: minmax(0, 1fr); }
body.touch .keys { display: none; }

<script id="logic">
/* Companion AI (PLAN A1): in solo mode the sister the child does not control is driven from here.
   Plain global function, no module syntax: inlined in a <script> and loadable in node.

   Rules of the house
   - It may only write g.input[other], call g.press(other, ...) and g.blink(other, ...). It never touches positions or physics.
   - The view calls update(dt) once per fixed step BEFORE g.step(dt), in solo mode only, and reset() when a room is (re)loaded.
     A new room or a swap of the controlled sister is also noticed here, so reset() is a convenience, not a requirement.
   - companion.idle: seconds the player has not moved (the view says an encouraging line after a few).

   Priorities, highest first (PLAN A1)
     1. the room's `assists` (levels.js)                    2. generic help: melt a pink wall (Nuan), freeze water ahead (Frost),
     hold the plate while the player passes a closed gate   3. follow 36 px behind, jump walls, wait at water
     4. magic blink: > 6 tiles away, > 3 tiles of height difference, or 2 s without getting closer   5. look at the player

   The S3 toys (src/CONTRACT.md section 9)
     ramps / and \\   passable: she walks and slides like the player; a spot on a ramp counts as a place to stand (blink)
     spring J         solid like a wall; when the player is much higher she walks to a mushroom, lets it throw her up and steers to the
                      player in the air (springHelp); the blink stays the fallback
     lost bunnies R   nothing to do, they follow the player (the logic makes the player their leader in solo)
     ice floe M       at the water's edge she waits for a floe to come within reach and then steps / hops on; no generic ice in a room with floes
     note steps 1..5  she never jumps near them, never blinks onto one and never counts a note step as a place to stand
     ice flowers F    she keeps away from a flower until the player has made one bloom; then her own touch (and, for Nuan, her magic) may
   Positions: `cx` is the horizontal centre of a sister in pixels, her "feet" are s.y + s.h; a tile is T px. */
function createCompanion(g, opts) {
  const FOLLOW = 36;            // px behind the player
  const DEAD = 10;              // px: close enough to the follow point to stand still
  const FAR = 6 * T;            // blink when farther than this ...
  const HIGH = 3 * T;           // ... or when the height difference is larger than this ...
  const STUCK = 2;              // ... or when she has not got closer for this many seconds
  const BLINK_COOL = 1;         // s between two follow blinks
  const HELP_COOL = 0.5;        // s between two helps
  const GATE_NEAR = 6 * T, GATE_FAR = 7 * T, GATE_PASS = 3 * T;
  const HOLD_MAX = 8, HOLD_WAIT = 3, HOLD_COOL = 4;   // s on the plate at most / s before she gives it up when the player stays far on her own side / s before she tries again

  let st = null;
  const other = id => (id === 'frost' ? 'nuan' : 'frost');
  const cxOf = s => s.x + s.w / 2;
  const feetOf = s => s.y + s.h;
  const rowOf = s => Math.floor((s.y + s.h - 1) / T);
  const chAt = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? '#' : g.grid[r][c];
  /* the logic's own rule (walls, ice, blocks, the spring mushroom J, note steps, a shut gate); ramps are NOT solid, floes are entities */
  const solid = ch => (typeof isSolidTile === 'function'
    ? isSolidTile(ch, g.gatesOpen)
    : (ch === '#' || ch === 'X' || ch === 'I' || ch === 'B' || ch === 'J' || (ch >= '1' && ch <= '5') || (ch === 'G' && !g.gatesOpen)));
  const isRamp = ch => ch === '/' || ch === '\\';
  const isNote = ch => ch >= '1' && ch <= '5' && ch.length === 1;
  const sign = v => (v > 0 ? 1 : v < 0 ? -1 : 0);

  function fresh() {
    return {
      items: g.items, player: g.player,
      px: 0, py: 0, idle: 0, pMoved: false,
      dir: 1, runT: 0,              // the way the player is heading (stable: a short tap the other way does not flip it)
      blinkCool: 0, helpCool: 0, jumpCool: 0,
      best: Infinity, stuckT: 0,
      hold: null,                   // standing on a plate: { plate, gate, side }
      fired: [],                    // assists already done
      forceBlink: false,
      hopT: 0, floeT: 0,            // s left of a hop onto a floe / s since she last stood on a floe
      spring: null, springCool: 0,  // { phase: 'walk' | 'fly', col, t, jt }: using a spring mushroom to follow the player up
      bloomCool: 0,
      holdT: 0, holdCool: 0,        // s since she took the plate / s before she may take it again after giving up
    };
  }
  st = fresh();

  /* ---------- geometry helpers ---------- */

  const onFloe = (x, y) => g.floes.some(f => x >= f.x && x <= f.x + f.w && Math.abs(f.y - y) <= 6);
  const floeOf = s => (s.ground ? g.floes.find(f => cxOf(s) >= f.x && cxOf(s) <= f.x + f.w && Math.abs(f.y - feetOf(s)) <= 2) : null) || null;
  const ridesFloe = s => !!floeOf(s);

  /* ice flowers (S3): until the player has made one bloom the companion keeps out of their reach (the child does it first) */
  const flowerHold = () => g.flowers.length > 0 && g.flowers.every(f => !f.open);
  function inFlowerZone(x0, x1, y0, y1) {
    for (const f of g.flowers) {
      if (!f.open && x0 < (f.c + 1) * T + 4 && x1 > f.c * T - 4 && y0 < (f.r + 1) * T && y1 > f.r * T) return true;
    }
    return false;
  }

  /* a sister can stand in tile (c, r): room for the body, not water, something to stand on (never a note step: those are the child's) */
  function standCell(c, r) {
    if (solid(chAt(c, r)) || solid(chAt(c, r - 1)) || chAt(c, r) === '~' || chAt(c, r) === '=') return false;
    if (isRamp(chAt(c, r))) return true;                      // the surface of a ramp
    const below = chAt(c, r + 1);
    if (isNote(below)) return false;
    return solid(below) || below === '=';
  }

  /* does a body centred on x with its feet on row r fit and stand? (used to pick a blink spot) */
  function fitsStand(x, r, w, h) {
    const c0 = Math.floor((x - w / 2) / T), c1 = Math.floor((x + w / 2 - 0.001) / T);
    for (let c = c0; c <= c1; c++) if (solid(chAt(c, r)) || solid(chAt(c, r - 1))) return false;
    if (flowerHold() && inFlowerZone(x - w / 2, x + w / 2, (r + 1) * T - (h || 58), (r + 1) * T)) return false;
    if (onFloe(x, (r + 1) * T)) return true;
    return standCell(Math.floor(x / T), r);
  }

  /* walking one tile further in `dir` would drop her into water */
  function waterAhead(s, dir) {
    const c = Math.floor(cxOf(s) / T) + dir, r0 = rowOf(s);
    if (solid(chAt(c, r0))) return false;
    for (let r = r0; r < ROWS; r++) {
      const ch = chAt(c, r);
      if (ch === '~') return true;
      if (solid(ch) || ch === '=') return false;
    }
    return false;
  }

  /* something solid directly in front of her body (feet row): its tile character, or null */
  function wallAhead(s, dir) {
    const c = Math.floor((cxOf(s) + dir * (s.w / 2 + 6)) / T), r = Math.floor((s.y + s.h - 1) / T);
    return solid(chAt(c, r)) ? chAt(c, r) : null;
  }

  /* until the player has made a flower bloom: a closed flower within reach of a jump straight above or beside her */
  function flowerAbove(c) {
    if (!flowerHold()) return false;
    const x = cxOf(c);
    return g.flowers.some(f => !f.open && Math.abs(f.c * T + T / 2 - x) <= 1.6 * T && f.r * T < c.y && c.y - f.r * T < 5.2 * T);
  }

  /* note steps close by: she does not jump there (a jump might land on one), the blink has to bring her */
  function notesNear(c) {
    const col = Math.floor(cxOf(c) / T), r0 = rowOf(c);
    for (let r = r0 - 5; r <= r0 + 1; r++) for (let k = col - 3; k <= col + 3; k++) if (isNote(chAt(k, r))) return true;
    return false;
  }

  /* ---------- actions (blink + magic) ---------- */

  /* Blink to the feet-centre (x, y) and, optionally, use the magic facing `dir`. The facing comes from a tiny step of movement
     in the same tick (the logic turns her before the magic is read), then she is back in the dead zone of the follow code. */
  function cast(cid, x, y, dir) {
    const inp = g.input[cid];
    if (x != null && !g.blink(cid, x, y)) return false;
    inp.l = dir < 0 ? 1 : 0; inp.r = dir > 0 ? 1 : 0;
    g.press(cid, 'act');
    st.helpCool = HELP_COOL;
    st.best = Infinity; st.stuckT = 0;
    return true;
  }

  const spotOf = (c, r) => [c * T + T / 2, (r + 1) * T];

  /* ---------- 1. assists from the room data ---------- */

  function nearPlayer(a, p) {
    const w = a.when || {};
    if (w.gateClosed && g.gatesOpen) return false;
    if (w.near) {
      const dx = (cxOf(p) - (w.near[0] * T + T / 2)) / T, dy = (p.y + p.h / 2 - (w.near[1] * T + T / 2)) / T;
      if (Math.hypot(dx, dy) > (w.r == null ? 3 : w.r)) return false;
    }
    return true;
  }

  function runAssists(p, c, cid) {
    const list = (LEVELS[g.index] && LEVELS[g.index].assists) || [];
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (st.fired[i] || (a.who && a.who !== 'any' && a.who !== cid) || !nearPlayer(a, p)) continue;
      if (a.do === 'standOnPlate') {
        if (!st.hold && !g.gatesOpen && startHold(p, cid, i)) return true;
        continue;
      }
      if (st.helpCool > 0 || !a.from) continue;
      const dir = a.dir || 1;
      st.fired[i] = true;
      const [x, y] = spotOf(a.from[0], a.from[1]);
      if (cast(cid, x, y, dir)) return true;
    }
    return false;
  }

  /* ---------- 2. generic help ---------- */

  /* Stand on a plate while the player gets through the gate; blink across once she is 3 tiles beyond it. */
  function startHold(p, cid, assistIndex) {
    if (!g.gates.length || !g.plates.length) return false;
    const pcx = cxOf(p);
    let gate = g.gates[0];
    for (const gt of g.gates) if (Math.abs(gt.c * T + T / 2 - pcx) < Math.abs(gate.c * T + T / 2 - pcx)) gate = gt;
    let plate = g.plates[0];
    for (const pl of g.plates) if (Math.abs(pl.c * T + T / 2 - pcx) < Math.abs(plate.c * T + T / 2 - pcx)) plate = pl;
    const [x, y] = spotOf(plate.c, plate.r);
    if (!g.blink(cid, x, y)) return false;
    st.hold = { plate, gate, side: sign(pcx - (gate.c * T + T / 2)) || 1, assist: assistIndex };
    st.helpCool = HELP_COOL; st.holdT = 0;
    return true;
  }

  function plateHelp(p, c, cid) {
    if (st.hold) {
      const h = st.hold, dx = cxOf(p) - (h.gate.c * T + T / 2);
      const passed = sign(dx) === -h.side && Math.abs(dx) >= GATE_PASS;
      const high = Math.abs(feetOf(p) - (h.plate.r + 1) * T) > 3 * T;     // up on a platform, not at the gate
      const idle = st.holdT > HOLD_WAIT && (high || (sign(dx) === h.side && Math.abs(dx) > GATE_PASS));   // standing about, not going through
      if ((st.holdT > HOLD_MAX && !passed) || idle) {       // the player is not going through after all: give the plate up for a while
        st.hold = null; st.holdCool = HOLD_COOL;
        return false;
      }
      if (passed || Math.abs(dx) > GATE_FAR) {
        if (passed && h.assist != null) st.fired[h.assist] = true;
        st.hold = null; st.forceBlink = passed;           // across the gate to the player's side
        return false;
      }
      const pl = h.plate;
      if (!(c.x < (pl.c + 1) * T && c.x + c.w > pl.c * T && c.y < (pl.r + 1) * T && c.y + c.h > pl.r * T)) {
        const [x, y] = spotOf(pl.c, pl.r);
        g.blink(cid, x, y);
      }
      return true;                                         // stands still on the plate
    }
    if (g.gatesOpen || !g.gates.length || !g.plates.length || st.helpCool > 0 || st.holdCool > 0) return false;
    const pcx = cxOf(p), pr = rowOf(p);
    // a gate close by that the player is heading for (not one she has just come through)
    const near = g.gates.some(gt => Math.abs(gt.c * T + T / 2 - pcx) < GATE_NEAR && Math.abs(gt.r - pr) <= 4
      && sign(gt.c * T + T / 2 - pcx) === st.dir);
    return near && startHold(p, cid, null);
  }

  /* Nuan: the player is close to a pink wall in front of her, melt it. */
  function meltHelp(p, c, cid) {
    if (cid !== 'nuan' || !p.ground) return false;
    const pc = Math.floor(cxOf(p) / T), pr = rowOf(p);
    for (const d of [p.dir, -p.dir]) {
      for (let k = 1; k <= 3; k++) {
        const wc = pc + d * k;
        if (solid(chAt(wc, pr)) && chAt(wc, pr) !== 'X') break;
        if (chAt(wc, pr) === 'X' || chAt(wc, pr - 1) === 'X') {
          const sc = wc - d;
          if (!standCell(sc, pr)) break;
          const [x, y] = spotOf(sc, pr);
          return cast(cid, x, y, d);
        }
      }
    }
    return false;
  }

  /* Frost: the player is about to walk into water ahead of her (up to 3 tiles away), freeze a path. */
  function freezeHelp(p, c, cid) {
    if (cid !== 'frost' || !p.ground || g.floes.length) return false;     // (near a floe her magic pauses it: no ice in a river room)
    const pc = Math.floor(cxOf(p) / T), pr = rowOf(p), d = p.dir;
    for (let k = 1; k <= 3; k++) {
      const wc = pc + d * k;
      if (solid(chAt(wc, pr))) return false;
      let water = false;
      for (let r = pr; r <= pr + 3 && !water; r++) water = chAt(wc, r) === '~';
      if (!water) continue;
      const sc = wc - d;
      if (!standCell(sc, pr)) return false;
      const [x, y] = spotOf(sc, pr);
      return cast(cid, x, y, d);
    }
    return false;
  }

  /* ---------- 3 + 4. follow and blink ---------- */

  function blinkBehind(p, cid) {
    const pcx = cxOf(p), pr = rowOf(p), y = feetOf(p);
    for (const x of [pcx - st.dir * FOLLOW, pcx - st.dir * 2 * FOLLOW, pcx + st.dir * FOLLOW, pcx]) {
      if (fitsStand(x, pr, g.sisters[cid].w, g.sisters[cid].h) && g.blink(cid, x, y)) {
        st.blinkCool = BLINK_COOL; st.best = Infinity; st.stuckT = 0; st.forceBlink = false;
        return true;
      }
    }
    return false;
  }

  function follow(p, c, cid, dt) {
    const inp = g.input[cid];
    const pcx = cxOf(p), ccx = cxOf(c);
    // on a floe while the player is on firm ground: go right up to her (onto the bank), a floe sails away from under a bystander
    let tx = st.floeT > 0 && !ridesFloe(p) ? pcx : pcx - st.dir * FOLLOW;
    const pf = floeOf(p);
    if (pf) tx = Math.max(pf.x + 14, Math.min(pf.x + pf.w - 14, tx));       // the player sails: her place is on the floe, not in the water behind it
    const dy = feetOf(p) - feetOf(c);
    const dist = Math.hypot(tx - ccx, dy);

    // 4. magic blink
    // "no progress": she is not at her place, the player is standing still, and she is not getting any closer
    if (st.pMoved || dist < DEAD + 4 || dist < st.best - 6) { st.best = dist; st.stuckT = 0; }
    else st.stuckT += dt;
    const high = c.ground && Math.abs(dy) > HIGH;                 // measured on the ground, not in the middle of a jump
    const lost = Math.hypot(pcx - ccx, dy) > FAR || high || st.stuckT > STUCK;
    if ((st.forceBlink || (lost && st.blinkCool <= 0)) && p.ground && blinkBehind(p, cid)) return;

    // 3. follow
    const want = tx - ccx;
    let mv = Math.abs(want) > DEAD ? sign(want) : 0;
    let hop = false;                                        // a floe is within reach: jump onto it
    if (mv && waterAhead(c, mv)) {                          // wait at the water, unless a floe comes by
      if (c.ground) { const f = floeStep(c, mv); mv = f.mv; hop = f.jump; if (hop) st.hopT = 0.8; }
      else if (st.hopT <= 0) mv = 0;                        // (in the air only the hop onto a floe goes on over the water, until she is over it)
    }
    if (mv && !c.ground && st.hopT > 0 && g.floes.some(f => f.y >= feetOf(c) - 4 && f.y - feetOf(c) < 3 * T && ccx >= f.x + 8 && ccx <= f.x + f.w - 8)) mv = 0;
    if (mv && c.ground && flowerHold() && inFlowerZone(c.x + mv * 14, c.x + c.w + mv * 14, c.y, c.y + c.h)) mv = 0;   // the child blooms the first flower
    inp.l = mv < 0 ? 1 : 0; inp.r = mv > 0 ? 1 : 0;

    const toward = mv || sign(pcx - ccx);
    const climb = dy < -T * 0.7 && Math.abs(pcx - ccx) <= 3 * T       // the player stands higher, close by
      && !(dy < -2.6 * T && springNear(c) != null && st.springCool <= 0);   // (out of reach of a jump but not of a mushroom: springHelp waits for its moment)
    const wall = mv !== 0 ? wallAhead(c, mv) : null;
    const blocked = !!wall && wall !== 'J';                 // a spring mushroom is not jumped at by accident (springHelp does that)
    const jumpOk = !notesNear(c) && !flowerAbove(c) && !ridesFloe(c);   // never hop around the note steps, up into an unopened flower, or on a floe (it sails away from under her)
    if (c.ground) {
      if (hop && st.jumpCool <= 0) { g.press(cid, 'jump'); st.jumpCool = 0.5; }
      else if (jumpOk && (blocked || climb) && st.jumpCool <= 0) { g.press(cid, 'jump'); st.jumpCool = 0.3; }
      else if (!mv && dy > T * 0.8 && Math.abs(pcx - ccx) < 1.5 * T && chAt(Math.floor(ccx / T), rowOf(c) + 1) === '=') inp.d = 1;   // down through a platform
    } else if (jumpOk && !c.doubled && c.vy >= -40 && ((blocked && wallAhead(c, mv) && wallAhead(c, mv) !== 'J') || (climb && feetOf(c) > feetOf(p) + 8))) {
      g.press(cid, 'jump');                                  // second jump at the top of the first
    }

    // 5. nothing to do: look at the player
    if (!mv && c.ground && Math.abs(pcx - ccx) > 6 && c.dir !== toward) { inp.l = toward < 0 ? 1 : 0; inp.r = toward > 0 ? 1 : 0; }
  }

  /* ---------- the S3 toys ---------- */

  /* A river room: she stands at the water's edge. A floe at her height that is about to touch the bank (or sails towards it) is stepped
     onto (gap <= 24 px) or hopped onto (<= 64 px, not while it sails away); otherwise she waits. { mv, jump } */
  function floeStep(c, mv) {
    const feet = feetOf(c);
    let best = null;
    for (const f of g.floes) {
      if (Math.abs(f.y - feet) > 6) continue;
      const gap = mv > 0 ? f.x - (c.x + c.w) : c.x - (f.x + f.w);
      if (gap < -2) continue;                               // she is on it or past it
      if (!best || gap < best.gap) best = { f, gap };
    }
    if (!best) return { mv: 0, jump: false };
    const away = best.f.vx * mv > 0 && best.f.paused === false;
    if (best.gap <= 24) return { mv, jump: false };
    if (best.gap <= 64 && (!away || best.gap <= 36)) return { mv, jump: true };
    return { mv: 0, jump: false };
  }

  /* The player stands much higher than she does and there is a spring mushroom in her row: walk to it, jump onto it (landing on it throws
     her up about six tiles), steer to the player in the air. Returns true while it is her turn. Gives up after a few seconds
     (then the blink brings her). */
  function springHelp(p, c, cid, dt) {
    const inp = g.input[cid];
    let ss = st.spring;
    if (ss) {
      ss.t += dt;
      const dx = cxOf(p) - cxOf(c);
      if (ss.phase === 'fly') {
        if (c.ground || ss.t > 3.5) { st.spring = null; st.springCool = c.ground ? 0.5 : 4; return false; }
        inp.l = dx < -6 ? 1 : 0; inp.r = dx > 6 ? 1 : 0;
        return true;
      }
      if (!c.ground && c.vy < -620) { ss.phase = 'fly'; ss.t = 0; return true; }      // thrown up
      if (ss.t > 4.5 || c.splash > 0) { st.spring = null; st.springCool = 6; return false; }
      const jx = ss.col * T + T / 2, jd = jx - cxOf(c);
      if (c.ground) {
        const mv = sign(jd);
        if (Math.abs(jd) > T * 1.15) {                        // walk up to it (never into the water)
          if (waterAhead(c, mv)) { st.spring = null; st.springCool = 6; return false; }
          inp.l = mv < 0 ? 1 : 0; inp.r = mv > 0 ? 1 : 0;
        } else if (st.jumpCool <= 0) {                        // next to it: hop onto its top
          inp.l = mv < 0 ? 1 : 0; inp.r = mv > 0 ? 1 : 0;
          g.press(cid, 'jump'); st.jumpCool = 0.6; ss.jt = 0;
        } else if (Math.abs(jd) > T * 0.9) { inp.l = mv < 0 ? 1 : 0; inp.r = mv > 0 ? 1 : 0; }
      } else if (ss.jt != null) {                             // in the first hop: lean towards the mushroom for a moment, then drop straight down
        ss.jt += dt;
        if (ss.jt < 0.22 && Math.abs(jd) > 10) { const mv = sign(jd); inp.l = mv < 0 ? 1 : 0; inp.r = mv > 0 ? 1 : 0; }
      }
      return true;
    }
    if (st.springCool > 0 || !c.ground || feetOf(c) - feetOf(p) < 2.6 * T || !(p.ground || p.vy < -600)) return false;
    const col = springNear(c);
    if (col == null) return false;
    st.spring = { phase: 'walk', col, t: 0, jt: null };
    return true;
  }

  /* the column of a spring mushroom standing in her row within nine tiles (the nearest), or null */
  function springNear(c) {
    const r0 = rowOf(c), c0 = Math.floor(cxOf(c) / T);
    for (let k = 0; k <= 9; k++) for (const d of (k ? [-k, k] : [0])) if (chAt(c0 + d, r0) === 'J') return c0 + d;
    return null;
  }

  /* Nuan as the companion: once the child has made a flower bloom, a flower within her reach blooms with her lantern magic. */
  function bloomHelp(p, c, cid) {
    if (cid !== 'nuan' || !g.flowers.length || flowerHold() || st.bloomCool > 0 || !c.ground) return false;
    const x = cxOf(c), y = c.y + c.h / 2;
    const near = g.flowers.some(f => !f.open && Math.hypot(f.c * T + T / 2 - x, f.r * T + T / 2 - y) <= 70);
    if (!near) return false;
    st.bloomCool = 1.2;
    g.press(cid, 'act');
    return true;
  }

  /* ---------- the public object ---------- */

  function update(dt) {
    if (!g.sisters.frost || !g.sisters.nuan) return;
    if (st.items !== g.items || st.player !== g.player) st = fresh();
    const pid = g.player, cid = other(pid);
    const inp = g.input[cid];
    inp.l = 0; inp.r = 0; inp.d = 0;
    if (g.state !== 'play') return;
    const p = g.sisters[pid], c = g.sisters[cid];

    // the way the player is heading, and how long she has been standing still
    const pin = g.input[pid], heading = (pin.r ? 1 : 0) - (pin.l ? 1 : 0);
    if (heading) { st.runT += dt; if (st.runT > 0.25 || st.dir === heading) st.dir = heading; } else st.runT = 0;
    st.pMoved = Math.abs(p.x - st.px) + Math.abs(p.y - st.py) >= 0.5;
    if (!st.pMoved && !heading) st.idle += dt; else st.idle = 0;
    st.px = p.x; st.py = p.y;
    if (ridesFloe(c)) st.floeT = 0.8; else st.floeT -= dt;
    st.blinkCool -= dt; st.helpCool -= dt; st.jumpCool -= dt; st.springCool -= dt; st.bloomCool -= dt; st.hopT -= dt; st.holdT += dt; st.holdCool -= dt;

    if (c.splash > 0 || p.splash > 0) { st.stuckT = 0; return; }
    if (runAssists(p, c, cid)) return;
    if (plateHelp(p, c, cid)) { st.stuckT = 0; return; }
    if (st.helpCool <= 0 && (meltHelp(p, c, cid) || freezeHelp(p, c, cid))) return;
    if (springHelp(p, c, cid, dt)) { st.stuckT = 0; return; }
    if (bloomHelp(p, c, cid)) return;
    follow(p, c, cid, dt);
  }

  return {
    reset() { st = fresh(); },
    update,
    get idle() { return st.idle; },
  };
}

   Built together with logic.js and companion.js in filename order (companion, levels, logic); nothing in here
   may touch another file's top-level bindings while loading, only inside functions.

   Room order (src/CONTRACT.md section 8): hall lake slope tower spring bunny floe music ballroom garden. The game ends after `garden`.

   Map: 13 rows x 24 columns, one character per tile.
     .  empty                                 #  wall
     =  one-way platform (drop with Down)     ~  water (splash, back to the bank)
     X  pink ice wall (Nuan melts it)         I  frozen water (Frost freezes ~)
     B  ice block (made by Frost, max 3)      G  iron gate (open while a plate is held)
     P  pressure plate                        *  snowflake (Frost collects)
     h  heart (Nuan collects)                 o  snowball
     +  small star (decorative, either sister, never needed for the door)
     D  door    S  snowman spot (goal)        E / A  Frost / Nuan spawn
   The six toys of PLAN B1 (numbers in TOYS, logic.js):
     /  \  ramps: `\` is high on the left and slides down to the right, `/` the other way. Ramps are surfaces, not solid: the foot of a run
            that drops one row per tile is a flat floor one row lower, the floor beside the top is in the ramp's row. Fill the tiles
            under a ramp with # (a sister cannot walk under a ramp, its high face is a wall).
     J  spring mushroom (solid, lands -> bounce about six tiles; a ledge 5 tiles above its top is comfortable, the ceiling stops a head)
     R  lost bunny (a body standing on the tile below it)      N  bunny home (non-solid, in the row the bunnies stand in)
     M  moving ice floe, a run of M is one floe; it needs `~` directly below every M and is level with the bank when the M row is the
        row of the bank's solid tiles (bank tiles in rows 11-12, water in row 12, stand row 10)
     1 2 3 4 5  note steps (do re mi fa so; red orange yellow green blue), solid; the room's `melody` says which, in which order
     F  ice flower (non-solid, blooms when touched)

   Level object:
     id        stable key ('hall'); new code indexes by id, not by position
     name      { en, zh }
     words     the 3 core English words of the room (PLAN A5)
     goal      'door' | 'snowman' | 'garden' (no door: every flower F open clears the room)
     map       13 strings of 24 characters
     melody    [n, ...] notes 1..5 to step on in this order (the music room); the door opens when it is played
     guide     [{ c, r, say }] targets in the order a stuck player should be led to them (items, then the door);
               `say` is the line key of the spoken prompt (guide_<id>_<n>, src/CONTRACT.md section 3). logic.js g.guide() walks this list:
               an entry is done when the item on that tile is collected, or a sister reaches that tile (the door: once it is open);
               a lost bunny on (c, r) (or `bunny: id`): once it follows; `note: k` (k-th note of the melody): once the melody is past it;
               a flower: once it has bloomed; a nest N: once every bunny is home
     assists   hints for the companion AI (PLAN A1, companion.js), [] when the room needs none:
                 { when: { near: [c, r], r: 3, gateClosed?: true }, who: 'frost' | 'nuan' | 'any', do: 'freeze' | 'melt' | 'block',
                   from: [c, r], dir: 1 | -1 }       the companion blinks to tile `from` (feet row r), faces `dir`, uses her magic
                 { when: { gateClosed: true, near: [c, r] }, who: 'any', do: 'standOnPlate' }
               `near` = the player is within `r` tiles (default 3) of that tile. Each assist fires once per room visit.
               (The S3 rooms need none: the generic helps and the toy rules in companion.js are enough.)
     memory    [c, r] of the hidden memory fragment, or undefined
     music     key of the THEMES entry in view/40-audio.js
   Presentation data that used to live in parallel arrays of the view script:
     memoryId  id of the matching entry in LINES.memory (content/lines.json); the memory fragment itself is picked up by logic.js
     bg        background image name         glows  [[x, y, radius, 'warm' | 'cool']] painted lights in that background (the S3 rooms: [])
   The view finds room-start, door-open, chapter and clear lines by naming convention (src/CONTRACT.md section 3), not through this file.
   Small decorative stars are '+' tiles in the map (3-5 per room), they are not a field.

   Kid rules the rooms follow (PLAN B1): one new toy per room, taught, used, then a small twist; every climb of the main route is a
   single jump (one-way steps), nothing needs a double jump; falling into water only sends you back to the bank.

/* Game rules: plain global const/function declarations, no module syntax, so this file can be inlined in a <script>
   and also evaluated in node (new Function / vm). It reads LEVELS (levels.js) only when a level is loaded.
   Since S3 it also holds the six new toys (src/CONTRACT.md section 9): ramps / and backslash, spring mushrooms J, snow bunnies R + nests N,
   ice floes M, note steps 1-5 with LEVELS[i].melody, and ice flowers F (goal 'garden'). Their numbers are in TOYS. */
const T = 40, COLS = 24, ROWS = 13;
const PHYS = { gravity: 1800, speed: 220, jump: 575, maxFall: 900, coyote: 0.09, buffer: 0.12 };
/* Solo mode (a child plays, PLAN A2): slower, more forgiving. Same jump height, so every room keeps its geometry. */
const KID_PHYS = Object.assign({}, PHYS, { speed: 180, coyote: 0.14, buffer: 0.18 });
const MAX_BLOCKS = 3;

/* Every legal map character (the meanings are listed in levels.js). All of them are live since S3; `future` stays for the next reservation. */
const TILE_CHARS = {
  live: '.#=~XIBGP*hoDSEA+/\\JRNM12345F',
  future: '',
};

/* The six new toys of PLAN B1 (src/CONTRACT.md section 9). All numbers in one place; the view and level design read them from here. */
const TOYS = {
  springV: 960,              // px/s up when launched by a spring mushroom J: ~252 px = 6.3 tiles of rise with gravity 1800 (a normal jump is 2.3),
                             // so a ledge exactly 6 tiles above the mushroom's top is reachable with some margin, a 7-tile one is not
  slideBase: 1.4,            // sliding speed on a slope, times the run speed of the mode (solo 180 -> 252 px/s)
  slideInput: 0.2,           // holding the arrow with / against the slide adds / takes away this much (so 1.2 .. 1.6 times the run speed)
  slideMax: 1.6,             // hard cap of the horizontal speed while sliding or flying off a slide
  slideAcc: 1000,            // px/s^2 the slide speeds up (about 0.25 s from rest)
  slideStep: 12,             // px a body may climb along a ramp in one step; a taller edge is a wall
  floeSpeed: 60,             // px/s of a moving ice floe
  floePause: 3,              // s a floe stands still after Frost's magic
  floeReach: 3 * T,          // Frost's magic pauses floes whose box is within this many px
  bunnyW: 22, bunnyH: 22,    // body of a snow bunny
  bunnyWake: 1.5 * T,        // a lost bunny starts to follow a sister this close (box to box)
  bunnyWakeLantern: 3 * T,   // ... this close when the sister is Nuan (her lantern)
  bunnyGap: 30,              // px a following bunny keeps behind the one ahead
  bunnyHop: 470,             // px/s of a bunny's hop (1.5 tiles: over a 1-tile step)
  bunnyFar: 6 * T,           // a following bunny blinks to the leader when farther than this
  bunnyStuck: 2.5,           // ... or when it has not got closer for this many seconds (and is > 2 tiles away)
  nestPull: 2.5 * T,         // a following bunny this close to a nest tile N (leader within 3.5 tiles of it) walks in
  bloomReach: 2 * T,         // Nuan's magic blooms flowers this close
};

/* Solid for walking: walls, ice, the spring mushroom and the note steps, and an iron gate while it is shut.
   (Slopes are not solid, they are a surface; floes are entities. Both have their own rules in createGame.) */
function isSolidTile(ch, gatesOpen) {
  return ch === '#' || ch === 'X' || ch === 'I' || ch === 'B' || ch === 'J' || (ch >= '1' && ch <= '5') || (ch === 'G' && !gatesOpen);
}

function createGame() {
  const g = {
    state: 'title', index: 0, grid: [], items: [], blocks: [], events: [],
    sisters: {}, plates: [], gates: [], gatesOpen: false, door: null, goal: 'door',
    doorOpen: false, clearT: 0, time: 0,
    input: { frost: { l: 0, r: 0, d: 0 }, nuan: { l: 0, r: 0, d: 0 } },
    /* PLAN A1: 'solo' = one child plays g.player, companion.js drives the other sister; 'duo' = two players, the original rules.
       Set before g.start / g.load. */
    mode: 'solo', player: 'nuan',
    progress: 0,                       // counts real progress (the view's stuck timer watches it)
    stars: { total: 0, got: 0 },       // small decorative '+' stars of the room
    memory: null, memoryFound: false,  // hidden memory fragment: { c, r, x, y } of LEVELS[i].memory
    guideDone: [],
    /* S3 toys (CONTRACT section 9). Rebuilt by g.load. */
    floes: [],                         // [{ id, x, y, w, vx, paused }]  x, y = top-left in px, w in px, 1 tile tall
    bunnies: [],                       // [{ id, c, r, x, y, state, dir, ... }]  x = centre, y = feet in px; state lost | follow | home
    bunniesHome: 0,
    melody: null,                      // { seq, pos, done } when the room has LEVELS[i].melody
    flowers: [],                       // [{ c, r, open }]
  };
  const phys = () => (g.mode === 'solo' ? KID_PHYS : PHYS);
  let nests = [];                      // [{ c, r }] bunny homes of this room
  const otherOf = id => (id === 'frost' ? 'nuan' : 'frost');
  const emit = (type, data) => g.events.push(Object.assign({ type }, data));

  function makeSister(id, c, r) {
    const w = 26, h = id === 'frost' ? 58 : 54;
    const x = c * T + (T - w) / 2, y = (r + 1) * T - h;
    return { id, x, y, w, h, vx: 0, vy: 0, dir: 1, ground: false, coyote: 0, jumpBuf: 0, actBuf: 0,
      doubled: false, dropT: 0, splash: 0, atGoal: false, safe: { x, y },
      slide: 0, slope: 0, slackT: 0, noteAt: null };   // slide: px/s of ramp momentum; slope: +1 / -1 while standing on a ramp (downhill direction); noteAt: the note step she stands on
  }

  g.load = i => {
    const lv = LEVELS[i];
    g.index = i; g.items = []; g.blocks = []; g.plates = []; g.gates = [];
    g.gatesOpen = false; g.doorOpen = false; g.goal = lv.goal || 'door'; g.door = null;
    g.floes = []; g.bunnies = []; g.bunniesHome = 0; g.flowers = []; nests = [];
    g.melody = lv.melody && lv.melody.length ? { seq: lv.melody.slice(), pos: 0, done: false } : null;
    g.progress = 0; g.stars = { total: 0, got: 0 }; g.memoryFound = false; g.guideDone = (lv.guide || []).map(() => false);
    g.memory = lv.memory ? { c: lv.memory[0], r: lv.memory[1], x: lv.memory[0] * T + T / 2, y: lv.memory[1] * T + T / 2 } : null;
    g.grid = lv.map.map((row, r) => row.split('').map((ch, c) => {
      if (ch === 'R') { addBunny(c, r); return '.'; }
      if (ch === 'F') { g.flowers.push({ c, r, open: false }); return '.'; }
      if (ch === 'N') nests.push({ c, r });                 // stays in the grid: the view draws the nest from it
      if (ch === 'M') return '.';                          // floes are entities, made below from the runs of M
      if (ch === 'E') { g.sisters.frost = makeSister('frost', c, r); return '.'; }
      if (ch === 'A') { g.sisters.nuan = makeSister('nuan', c, r); return '.'; }
      if (ch === '*' || ch === 'h' || ch === 'o' || ch === '+') {
        g.items.push({ kind: ch, c, r, x: c * T + T / 2, y: r * T + T / 2, got: false });
        if (ch === '+') g.stars.total++;
        return '.';
      }
      if (ch === 'D' || ch === 'S') { g.door = { c, r, x: c * T + T / 2, bottom: (r + 1) * T }; return '.'; }
      if (ch === 'P') g.plates.push({ c, r, down: false });
      if (ch === 'G') g.gates.push({ c, r });
      return ch;
    }));
    lv.map.forEach((row, r) => {
      for (const m of row.matchAll(/M+/g)) {
        g.floes.push({ id: g.floes.length, x: m.index * T, y: r * T, w: m[0].length * T, vx: TOYS.floeSpeed, paused: false, pauseT: 0, dir: 1 });
      }
    });
    emit('load');
  };

  /* A lost snow bunny. Bodies of bunnies use the same moveX / moveY as the sisters. */
  function addBunny(c, r) {
    const w = TOYS.bunnyW, h = TOYS.bunnyH, x = c * T + (T - w) / 2, y = (r + 1) * T - h;
    const b = { id: g.bunnies.length, c, r, state: 'lost', dir: 1, leader: null, order: 0, safe: { x, y }, stuckT: 0, jumpCool: 0,
      body: { x, y, w, h, vx: 0, vy: 0, ground: false, dropT: 0, slide: 0, slope: 0, slackT: 0 } };
    b.x = x + w / 2; b.y = y + h;
    g.bunnies.push(b);
  }

  const cell = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? '#' : g.grid[r][c];
  const hardSolid = ch => isSolidTile(ch, g.gatesOpen);

  function overlapsTile(s, c, r) {
    return s.x < (c + 1) * T && s.x + s.w > c * T && s.y < (r + 1) * T && s.y + s.h > r * T;
  }

  /* slack: the feet may dip this far into a solid tile of row minRow or below without a hit, except in the column under the middle of
     the body. A body standing on a ramp has half its width over the neighbouring floor, which is higher than the ramp surface under
     its centre (that floor is in the ramp's row). */
  function hits(s, x, y, slack = 0, minRow = 0) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + s.w - 0.001) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + s.h - 0.001) / T), mid = Math.floor((x + s.w / 2) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (hardSolid(cell(c, r)) && !(slack && c !== mid && r >= minRow && y + s.h - r * T <= slack)) return { c, r };
    }
    return null;
  }
  const rampSlack = s => (s.slope || s.slackT > 0 ? s.w / 2 + 2 : 0);   // (slackT: a moment after the body left a ramp)

  function moveX(s, dx) {
    if (!dx) return;
    const hit = hits(s, s.x + dx, s.y, rampSlack(s), s.rampRow);
    if (!hit) { s.x += dx; return; }
    s.x = dx > 0 ? hit.c * T - s.w : (hit.c + 1) * T;
    s.vx = 0; s.slide = 0;
  }

  function moveY(s, dy) {
    s.ground = false;
    if (dy > 0) {
      const oldBottom = s.y + s.h, newBottom = oldBottom + dy;
      const hit = hits(s, s.x, s.y + dy, rampSlack(s), s.rampRow);
      if (hit) { s.y = hit.r * T - s.h; s.vy = 0; s.ground = true; return; }
      if (s.dropT <= 0) {
        const r = Math.floor((newBottom - 0.001) / T);
        const top = r * T;
        if (oldBottom <= top + 0.001 && newBottom > top) {
          const c0 = Math.floor(s.x / T), c1 = Math.floor((s.x + s.w - 0.001) / T);
          for (let c = c0; c <= c1; c++) if (cell(c, r) === '=') {
            s.y = top - s.h; s.vy = 0; s.ground = true; return;
          }
        }
        for (const f of g.floes) {        // an ice floe is a one-way platform too (and Down drops through it)
          if (s.x < f.x + f.w && s.x + s.w > f.x && oldBottom <= f.y + 0.001 && newBottom > f.y) {
            s.y = f.y - s.h; s.vy = 0; s.ground = true; return;
          }
        }
      }
      s.y += dy;
    } else if (dy < 0) {
      const hit = hits({ w: s.w, h: -dy }, s.x, s.y + dy);          // only what is above the head can stop a rising body
      if (hit) { s.y = (hit.r + 1) * T; s.vy = 0; return; }
      s.y += dy;
    }
  }

  /* ---------- ramps ( / and backslash ) ----------
     A ramp tile is not solid, it is a surface: the backslash is high on the left and runs down to the right, `/` the other way round.
     A body (sister or bunny) stands on the surface under the centre of its feet. Ramps are slippery: standing on one slides downhill. */
  const isRamp = ch => ch === '/' || ch === '\\';
  const rampY = (c, r, cx) => {
    const ch = cell(c, r);
    if (!isRamp(ch)) return null;
    const u = Math.min(T, Math.max(0, cx - c * T));
    return r * T + (ch === '\\' ? u : T - u);
  };

  /* After a body moved: put it on the ramp surface under it, or stop it at the high face of a ramp (a step taller than slideStep is a wall).
     prev = { x, feet, ground } from before the move. Sets s.slope (+1 downhill to the right, -1 to the left, 0 not on a ramp). */
  function rampSnap(s, prev, dt) {
    rampSnapNow(s, prev, false);
    s.slackT = s.slope ? 0.25 : Math.max(0, (s.slackT || 0) - dt);
  }
  function rampSnapNow(s, prev, noWall) {
    const cx = s.x + s.w / 2, c = Math.floor(cx / T), feet = s.y + s.h;
    const was = s.slope;
    s.slope = 0;
    if (c < 0 || c >= COLS) return;
    const rf = Math.floor((feet - 0.001) / T), moved = Math.abs(s.x - prev.x);
    const entering = Math.floor((prev.x + s.w / 2) / T) !== c;
    for (const r of [rf, rf + 1, rf - 1]) {
      const surf = rampY(c, r, cx);
      if (surf == null) continue;
      const below = feet - surf;                          // > 0: the feet are inside the ramp
      if (entering && !noWall && below > TOYS.slideStep) {
        s.x = prev.x; s.vx = 0; s.slide = 0;
        return rampSnapNow(s, prev, true);
      }
      if (s.vy < 0) continue;                             // going up: pass through
      const ok = prev.ground ? (below >= -(TOYS.slideStep + moved) && below <= TOYS.slideStep)
        : (below >= 0 && prev.feet <= surf + moved + 1);
      if (!ok) continue;
      s.y = surf - s.h; s.vy = 0; s.ground = true;
      s.slope = cell(c, r) === '\\' ? 1 : -1; s.rampRow = r;
      if (!was) s.slide = s.vx;                           // keep the speed you ran onto the ramp with
      return;
    }
  }

  /* ---------- spring mushrooms (J) ---------- */
  function springBelow(s) {
    const r = Math.floor((s.y + s.h + 0.5) / T);
    for (const c of [Math.floor((s.x + s.w / 2) / T), Math.floor(s.x / T), Math.floor((s.x + s.w - 0.001) / T)]) {
      if (cell(c, r) === 'J') return { c, r };
    }
    return null;
  }

  function bounce(s, sp) {
    s.vy = -TOYS.springV; s.jumpBuf = 0; s.coyote = 0; s.ground = false; s.doubled = false;
    emit('bounce', { who: s.id, c: sp.c, r: sp.r });
  }

  /* ---------- note steps (1..5) ---------- */
  function stepNotes(s) {
    let at = null, n = 0;
    if (s.ground) {
      const r = Math.floor((s.y + s.h + 0.5) / T), c = Math.floor((s.x + s.w / 2) / T), ch = cell(c, r);
      if (ch >= '1' && ch <= '5') { at = c + ',' + r; n = Number(ch); }
    }
    const fresh = at && at !== s.noteAt;
    s.noteAt = at;
    if (!fresh || (g.mode === 'solo' && s.id !== g.player)) return;     // solo: only the child's sister plays the steps
    const m = g.melody, playing = m && !m.done;
    const ok = !playing || n === m.seq[m.pos];
    if (playing && ok) { m.pos++; g.progress++; }
    emit('note', { n, ok, who: s.id, c: Math.floor((s.x + s.w / 2) / T), r: Math.floor((s.y + s.h + 0.5) / T), pos: m ? m.pos : 0 });
    if (playing && m.pos >= m.seq.length) { m.done = true; g.progress++; emit('melody'); }
  }

  /* ---------- ice floes (M) ---------- */
  /* may the floe move one more step in `dir`: nothing solid ahead in its row, and water under the leading edge */
  function floeCanGo(f, dir, step) {
    const nx = f.x + dir * step, r = Math.floor(f.y / T);
    const col = dir > 0 ? Math.floor((nx + f.w - 0.001) / T) : Math.floor(nx / T);
    return !hardSolid(cell(col, r)) && cell(col, r + 1) === '~';
  }

  const rides = (b, f) => b.ground && Math.abs(b.y + b.h - f.y) < 0.5 && b.x + b.w / 2 >= f.x && b.x + b.w / 2 <= f.x + f.w;

  function updateFloes(dt) {
    const bodies = Object.values(g.sisters).concat(g.bunnies.map(b => b.body));
    for (const f of g.floes) {
      if (f.pauseT > 0) {
        f.pauseT -= dt;
        if (f.pauseT <= 0) { f.pauseT = 0; f.paused = false; emit('floe', { id: f.id, paused: false }); }
      }
      let d = 0;
      if (!f.paused) {
        const step = TOYS.floeSpeed * dt;
        if (floeCanGo(f, f.dir, step)) d = f.dir * step;
        else if (floeCanGo(f, -f.dir, step)) { f.dir = -f.dir; d = f.dir * step; }
      }
      f.vx = d ? d / dt : 0;
      if (!d) continue;
      const riders = bodies.filter(b => !(b.splash > 0) && rides(b, f));
      f.x += d;
      for (const b of riders) moveX(b, d);
    }
  }

  /* Frost's magic: floes within reach stand still for a few seconds. Returns true when it did something. */
  function pauseFloes(s) {
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    let any = false;
    for (const f of g.floes) {
      const dx = Math.max(f.x - cx, 0, cx - (f.x + f.w)), dy = Math.max(f.y - cy, 0, cy - (f.y + T));
      if (Math.hypot(dx, dy) > TOYS.floeReach) continue;
      if (!f.paused) { f.paused = true; f.vx = 0; emit('floe', { id: f.id, paused: true }); }
      f.pauseT = TOYS.floePause; any = true;
    }
    if (any) { g.progress++; emit('magic', { who: 'frost' }); }
    return any;
  }

  function freeze(fromC, r, dir) {
    let n = 0;
    for (let c = fromC; n < 3 && cell(c, r) === '~'; c += dir, n++) {
      g.grid[r][c] = 'I';
      emit('freeze', { c, r });
    }
    if (n) g.progress++;
    return n;
  }

  function canBlock(c, r) {
    const ch = cell(c, r);
    if (ch !== '.' && ch !== 'P') return false;
    if (g.items.some(it => !it.got && it.kind !== '+' && it.c === c && it.r === r)) return false;   // (a small star never blocks the magic)
    if (g.door && c === g.door.c && (r === g.door.r || r === g.door.r - 1)) return false;
    if (g.floes.some(f => f.x < (c + 1) * T && f.x + f.w > c * T && f.y < (r + 1) * T && f.y + T > r * T)) return false;
    if (g.bunnies.some(b => overlapsTile(b.body, c, r))) return false;
    return !Object.values(g.sisters).some(s => overlapsTile(s, c, r));
  }

  function frostMagic(s) {
    if (pauseFloes(s)) return;                       // a floe in reach: the magic holds it still instead
    const fc = s.dir > 0 ? Math.floor((s.x + s.w - 0.001) / T) + 1 : Math.floor(s.x / T) - 1;
    const fr = Math.floor((s.y + s.h - 0.001) / T);
    const own = Math.floor((s.x + s.w / 2) / T);
    for (let r = fr; r <= fr + 3; r++) {
      if (cell(fc, r) === '~' && freeze(fc, r, s.dir)) { emit('magic', { who: 'frost' }); return; }
      if (cell(own, r) === '~' && freeze(own, r, s.dir)) { emit('magic', { who: 'frost' }); return; }
    }
    for (const r of [fr, fr - 1]) {
      if (canBlock(fc, r)) {
        if (g.blocks.length >= MAX_BLOCKS) removeBlock(g.blocks[0]);
        g.blocks.push({ c: fc, r, under: g.grid[r][fc] });
        g.grid[r][fc] = 'B';
        emit('block', { c: fc, r });
        g.progress++;
        return;
      }
    }
    emit('fizz', { who: 'frost', x: s.x + s.w / 2, y: s.y });
  }

  function removeBlock(b) {
    g.blocks.splice(g.blocks.indexOf(b), 1);
    g.grid[b.r][b.c] = b.under;
    emit('unblock', { c: b.c, r: b.r });
  }

  function nuanMagic(s) {
    const pad = 26;
    const box = { x: s.x - pad, y: s.y - 10, w: s.w + pad * 2, h: s.h + 20 };
    const seeds = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (g.grid[r][c] === 'X' && overlapsTile(box, c, r)) seeds.push([c, r]);
    }
    const bloomed = bloomNear(s);
    if (!seeds.length) {
      if (bloomed) emit('magic', { who: 'nuan' });
      else emit('fizz', { who: 'nuan', x: s.x + s.w / 2, y: s.y });
      return;
    }
    while (seeds.length) {
      const [c, r] = seeds.pop();
      if (cell(c, r) !== 'X') continue;
      g.grid[r][c] = '.';
      emit('melt', { c, r });
      seeds.push([c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]);
    }
    g.progress++;
    emit('magic', { who: 'nuan' });
  }

  function updateSister(s, dt) {
    if (s.splash > 0) {
      s.splash -= dt;
      s.slide = 0; s.slope = 0; s.slackT = 0; s.noteAt = null;
      if (s.splash <= 0) {
        let { x, y } = s.safe;
        if (hits(s, x, y)) {                         // an ice block (or a closed gate) has come to stand on the spot: the nearest free place
          const pos = placeBody(s, x + s.w / 2, y + s.h);
          if (pos) { x = pos.x; y = pos.y; }
        }
        s.x = x; s.y = y; s.vx = 0; s.vy = 0; s.ground = false;
        emit('respawn', { who: s.id });
      }
      return;
    }
    const P = phys();
    const inp = g.input[s.id];
    const move = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    if (s.slope) {
      // standing on a ramp: slide downhill; the arrows add or take away a little (1.2 .. 1.6 times the run speed)
      const target = s.slope * TOYS.slideBase * P.speed + move * TOYS.slideInput * P.speed;
      const acc = TOYS.slideAcc * dt;
      s.slide += Math.max(-acc, Math.min(acc, target - s.slide));
      s.vx = s.slide;
      if (!move && Math.abs(s.slide) > 30) s.dir = s.slide > 0 ? 1 : -1;
    } else {
      // off the ramp the slide speed is only momentum: it fades quickly on the ground, slowly in the air
      const fade = (s.ground ? 1800 : 500) * dt;
      s.slide = Math.abs(s.slide) <= fade ? 0 : s.slide - Math.sign(s.slide) * fade;
      const cap = TOYS.slideMax * P.speed;
      s.vx = Math.max(-cap, Math.min(cap, move * P.speed + s.slide));
    }
    if (move) s.dir = move;
    if (inp.d) s.dropT = 0.18;
    s.dropT = Math.max(0, s.dropT - dt);
    s.coyote = s.ground ? P.coyote : Math.max(0, s.coyote - dt);
    s.jumpBuf = Math.max(0, s.jumpBuf - dt);

    if (s.jumpBuf > 0) {
      if (s.coyote > 0) {
        const sp = s.ground ? springBelow(s) : null;
        if (sp) bounce(s, sp);                  // pressing jump on a spring mushroom launches ~6 tiles
        else {
          s.vy = -P.jump; s.jumpBuf = 0; s.coyote = 0; s.ground = false; s.doubled = false;
          emit('jump', { who: s.id });
        }
      } else if ((s.id === 'nuan' || g.mode === 'solo') && !s.doubled) {   // solo: both sisters double jump
        s.vy = -P.jump; s.jumpBuf = 0; s.doubled = true;
        emit('doublejump', { x: s.x + s.w / 2, y: s.y + s.h });
      }
    }
    if (s.actBuf > 0) {
      s.actBuf = 0;
      if (s.id === 'frost') frostMagic(s); else nuanMagic(s);
    }

    const prev = { x: s.x, feet: s.y + s.h, ground: s.ground };
    const wasSlope = s.slope;
    s.vy = Math.min(P.maxFall, s.vy + P.gravity * dt);
    moveX(s, s.vx * dt);
    moveY(s, s.vy * dt);
    rampSnap(s, prev, dt);
    if (s.slope && !wasSlope) emit('slide', { who: s.id });
    if (s.ground && !prev.ground) {                // a landing on a spring mushroom bounces
      const sp = springBelow(s);
      if (sp) bounce(s, sp);
    }
    if (s.ground) s.doubled = false;
    stepNotes(s);

    const footR = Math.floor((s.y + s.h - 6) / T), midC = Math.floor((s.x + s.w / 2) / T);
    if (cell(midC, footR) === '~') {
      s.splash = 0.75;
      emit('splash', { x: s.x + s.w / 2, y: s.y + s.h });
      return;
    }
    if (s.ground && steadyUnder(s)) s.safe = { x: s.x, y: s.y };
  }

  /* both feet on something that stays (wall, ice, one-way platform): a good place to come back to after the water */
  function steadyUnder(s) {
    const below = Math.floor((s.y + s.h + 1) / T);
    const left = cell(Math.floor(s.x / T), below), right = cell(Math.floor((s.x + s.w - 0.001) / T), below);
    const steady = ch => ch === '#' || ch === 'I' || ch === '=';
    return steady(left) && steady(right);
  }

  function updateGates() {
    const sisters = Object.values(g.sisters);
    let pressed = false;
    for (const p of g.plates) {
      p.down = cell(p.c, p.r) === 'B' || sisters.some(s => s.splash <= 0 && overlapsTile(s, p.c, p.r));
      pressed = pressed || p.down;
    }
    const blocked = g.gates.some(gt => sisters.some(s => overlapsTile(s, gt.c, gt.r)));
    const next = pressed || (g.gatesOpen && blocked);
    if (next !== g.gatesOpen) { g.gatesOpen = next; if (next) g.progress++; emit('gate', { open: next }); }
  }

  function collect() {
    const solo = g.mode === 'solo';
    for (const it of g.items) {
      if (it.got) continue;
      for (const s of Object.values(g.sisters)) {
        if (s.splash > 0) continue;
        // duo: snowflakes are Frost's, hearts Nuan's. Solo: either sister takes either. Small stars: always either.
        if (!solo && ((it.kind === '*' && s.id !== 'frost') || (it.kind === 'h' && s.id !== 'nuan'))) continue;
        const dx = Math.abs(s.x + s.w / 2 - it.x), dy = Math.abs(s.y + s.h / 2 - it.y);
        if (dx < 28 && dy < s.h / 2 + 14) {
          it.got = true; g.progress++;
          if (it.kind === '+') { g.stars.got++; emit('collect', { kind: '+', x: it.x, y: it.y, n: g.stars.got }); }
          else emit('collect', { kind: it.kind, x: it.x, y: it.y });
          break;
        }
      }
    }
  }

  /* The door opens when every item is taken, every bunny is home and the melody (if the room has one) is played.
     A garden room (goal 'garden') has no door: it is cleared by the flowers instead. */
  function updateDoor() {
    if (g.goal === 'garden' || g.doorOpen) return;
    const open = g.items.every(it => it.got || it.kind === '+') && g.bunnies.every(b => b.state === 'home') && (!g.melody || g.melody.done);
    if (open) { g.doorOpen = true; g.progress++; emit('open'); }
  }

  /* ---------- snow bunnies (R) ---------- */
  /* a lost bunny wakes when a sister is this close (box to box); the next steps keep it trailing behind the one ahead */
  const boxDist = (s, x, y) => Math.hypot(Math.max(s.x - x, 0, x - (s.x + s.w)), Math.max(s.y - y, 0, y - (s.y + s.h)));

  /* walking one step further in `dir` would drop a body into water (an ice floe at its height counts as ground) */
  function wetAhead(body, dir) {
    const x = body.x + body.w / 2 + dir * (body.w / 2 + 4), c = Math.floor(x / T), feet = body.y + body.h;
    if (g.floes.some(f => x >= f.x && x <= f.x + f.w && Math.abs(f.y - feet) <= 6)) return false;
    for (let r = Math.floor((feet - 1) / T); r < ROWS; r++) {
      const ch = cell(c, r);
      if (ch === '~') return true;
      if (hardSolid(ch) || ch === '=' || isRamp(ch)) return false;
    }
    return false;
  }

  /* the nest this bunny should walk into: it is close, and so is the sister it follows */
  function nestFor(body, lead) {
    const bx = body.x + body.w / 2, br = Math.floor((body.y + body.h - 1) / T);
    for (const n of nests) {
      const nx = n.c * T + T / 2;
      if (Math.abs(br - n.r) <= 1 && Math.abs(bx - nx) <= TOYS.nestPull
        && Math.abs(lead.x + lead.w / 2 - nx) <= TOYS.nestPull + T && Math.abs(Math.floor((lead.y + lead.h - 1) / T) - n.r) <= 1) return nx;
    }
    return null;
  }

  function bunnyHome(b) {
    b.state = 'home'; b.body.vx = 0; g.bunniesHome++; g.progress++;
    emit('bunny', { id: b.id, state: 'home' });
  }

  function updateBunnies(dt) {
    if (!g.bunnies.length) return;
    const P = phys(), solo = g.mode === 'solo';
    const sisters = Object.values(g.sisters);
    // 1. lost bunnies wake up
    for (const b of g.bunnies) {
      if (b.state !== 'lost') continue;
      const bx = b.body.x + b.body.w / 2, by = b.body.y + b.body.h / 2;
      let who = null, best = Infinity;
      for (const s of sisters) {
        if (s.splash > 0) continue;
        const d = boxDist(s, bx, by);
        if (d <= (s.id === 'nuan' ? TOYS.bunnyWakeLantern : TOYS.bunnyWake) && d < best) { who = s; best = d; }
      }
      if (!who) continue;
      b.state = 'follow'; b.leader = who.id; b.order = 1 + Math.max(0, ...g.bunnies.map(o => o.order));
      g.progress++; emit('bunny', { id: b.id, state: 'follow' });
    }
    // 2. followers walk behind the one ahead (the sister, then each bunny in the order they woke up)
    const chains = {};
    for (const b of g.bunnies) if (b.state === 'follow') {
      if (solo) b.leader = g.player;
      (chains[b.leader] = chains[b.leader] || []).push(b);
    }
    const driving = new Map();
    for (const id of Object.keys(chains)) {
      const lead = g.sisters[id], list = chains[id].sort((p, q) => p.order - q.order);
      list.forEach((b, i) => driving.set(b, { lead, ahead: i ? list[i - 1].body : lead }));
    }
    for (const b of g.bunnies) {
      const body = b.body, d = driving.get(b);
      const prev = { x: body.x, feet: body.y + body.h, ground: body.ground };
      let want = 0, far = false, farDx = false;
      b.jumpCool -= dt;
      if (d) {
        const bcx = body.x + body.w / 2, lead = d.lead;
        let tx = d.ahead.x + d.ahead.w / 2, gap = TOYS.bunnyGap;
        const nest = nestFor(body, lead);
        if (nest != null) { tx = nest; gap = 2; }
        const dx = tx - bcx;
        if (Math.abs(dx) > gap) want = Math.sign(dx);
        if (want && wetAhead(body, want)) want = 0;
        const vmax = P.speed * 1.1;
        body.vx = want * Math.min(vmax, 25 + (Math.abs(dx) - gap) * 10);
        if (want) b.dir = want;
        if (want && body.ground && b.jumpCool <= 0 && hits(body, body.x + want * 3, body.y)) {     // hop over a one-tile step
          body.vy = -TOYS.bunnyHop; b.jumpCool = 0.35;
        }
        far = Math.hypot(lead.x + lead.w / 2 - bcx, lead.y + lead.h - (body.y + body.h)) > TOYS.bunnyFar;
        // not close to the one ahead: more than two tiles sideways, or more than two tiles above / below the sister (a ledge right over her head)
        farDx = Math.abs(dx) > 2 * T || Math.abs(lead.y + lead.h - (body.y + body.h)) > 2 * T;
      } else body.vx = 0;
      body.vy = Math.min(P.maxFall, body.vy + P.gravity * dt);
      moveX(body, body.vx * dt);
      moveY(body, body.vy * dt);
      rampSnap(body, prev, dt);
      const mid = Math.floor((body.x + body.w / 2) / T);
      if (cell(mid, Math.floor((body.y + body.h - 6) / T)) === '~') {      // into the water: back to dry ground
        emit('bunnysplash', { id: b.id, x: body.x + body.w / 2, y: body.y + body.h });
        body.x = b.safe.x; body.y = b.safe.y; body.vx = 0; body.vy = 0; body.ground = false;
      } else if (body.ground && steadyUnder(body)) b.safe = { x: body.x, y: body.y };
      if (b.state === 'follow' && body.ground && cell(mid, Math.floor((body.y + body.h - 1) / T)) === 'N') bunnyHome(b);
      // lost the trail (too far, or standing still more than two tiles from the one ahead): blink to the sister, like the sisters' own magic
      if (d && b.state === 'follow') {
        b.stuckT = farDx && Math.abs(body.x - prev.x) < 0.05 ? b.stuckT + dt : 0;
        const lead = d.lead;
        if ((far || b.stuckT > TOYS.bunnyStuck) && lead.ground && lead.splash <= 0) {
          const pos = placeBody(body, lead.x + lead.w / 2 - lead.dir * TOYS.bunnyGap, lead.y + lead.h);
          if (pos) {
            const from = { x: body.x + body.w / 2, y: body.y + body.h };
            body.x = pos.x; body.y = pos.y; body.vx = 0; body.vy = 0; body.ground = false; body.slope = 0; body.slide = 0; b.stuckT = 0;
            emit('bunnyblink', { id: b.id, from, to: { x: body.x + body.w / 2, y: body.y + body.h } });
          }
        }
      }
    }
    for (const b of g.bunnies) { b.x = b.body.x + b.body.w / 2; b.y = b.body.y + b.body.h; }
  }

  /* ---------- ice flowers (F) ---------- */
  function bloom(f) {
    f.open = true; g.progress++;
    emit('bloom', { c: f.c, r: f.r, n: g.flowers.filter(x => x.open).length, total: g.flowers.length });
  }

  /* Nuan's magic: flowers within two tiles open. Returns how many did. */
  function bloomNear(s) {
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    let n = 0;
    for (const f of g.flowers) {
      if (!f.open && Math.hypot(f.c * T + T / 2 - cx, f.r * T + T / 2 - cy) <= TOYS.bloomReach) { bloom(f); n++; }
    }
    return n;
  }

  /* Touching a flower opens it: either sister in solo, only Nuan in duo. */
  function updateFlowers() {
    for (const f of g.flowers) {
      if (f.open) continue;
      for (const s of Object.values(g.sisters)) {
        if (s.splash > 0 || (g.mode === 'duo' && s.id !== 'nuan')) continue;
        if (s.x < (f.c + 1) * T + 4 && s.x + s.w > f.c * T - 4 && s.y < (f.r + 1) * T && s.y + s.h > f.r * T) { bloom(f); break; }
      }
    }
  }

  /* The hidden memory fragment: either sister picks it up by touching it (same reach the view used to use). */
  function collectMemory() {
    const m = g.memory;
    if (!m || g.memoryFound) return;
    for (const s of Object.values(g.sisters)) {
      if (s.splash > 0 || m.x < s.x - 12 || m.x > s.x + s.w + 12 || m.y < s.y - 12 || m.y > s.y + s.h + 6) continue;
      g.memoryFound = true; g.progress++;
      emit('memory', { id: LEVELS[g.index].memoryId, x: m.x, y: m.y });
      return;
    }
  }

  /* Guide (PLAN A3): LEVELS[i].guide is the order a stuck player is led through. An entry is done when the item standing there is
     collected, or, for a plain spot (plate, door, snowman), when a sister reaches it (the door only once it is open). */
  function updateGuide() {
    const list = LEVELS[g.index].guide || [];
    list.forEach((e, i) => {
      if (g.guideDone[i]) return;
      // a bunny: done once it follows (or is home); a note: once the melody went past it; a flower: once it bloomed; a nest: once all bunnies are home
      const bunny = e.bunny != null ? g.bunnies.find(b => b.id === e.bunny) : g.bunnies.find(b => b.c === e.c && b.r === e.r);
      if (e.bunny != null || bunny) { if (!bunny || bunny.state !== 'lost') g.guideDone[i] = true; return; }
      if (e.note != null) { if (!g.melody || g.melody.done || g.melody.pos > e.note) g.guideDone[i] = true; return; }
      const flower = g.flowers.find(f => f.c === e.c && f.r === e.r);
      if (flower) { if (flower.open) g.guideDone[i] = true; return; }
      if (g.grid[e.r][e.c] === 'N') { if (g.bunnies.length && g.bunniesHome === g.bunnies.length) g.guideDone[i] = true; return; }
      const item = g.items.find(it => it.c === e.c && it.r === e.r && it.kind !== '+');
      if (item) { if (item.got) g.guideDone[i] = true; return; }          // collecting already counted as progress
      const isGoal = g.door && g.door.c === e.c && g.door.r === e.r;
      if (isGoal && !g.doorOpen) return;
      for (const s of Object.values(g.sisters)) {
        if (s.splash > 0 || Math.abs(s.x + s.w / 2 - (e.c * T + T / 2)) > T * 0.75) continue;
        if (s.y < (e.r + 1) * T && s.y + s.h > e.r * T) { g.guideDone[i] = true; g.progress++; return; }
      }
    });
  }

  function checkGoal() {
    const list = Object.values(g.sisters);
    if (g.goal === 'garden') {                     // no door: every flower open clears the room
      if (g.flowers.length && g.flowers.every(f => f.open)) { g.state = 'clear'; g.clearT = 1.5; emit('clear'); }
      return;
    }
    if (!g.door) return;                           // a room without a door or a snowman cannot be left through one
    const atDoor = s => g.doorOpen && s.ground && s.splash <= 0
      && Math.abs(s.x + s.w / 2 - g.door.x) < 44
      && Math.abs(s.y + s.h - g.door.bottom) < 4;
    for (const s of list) s.atGoal = atDoor(s);
    if (g.mode === 'solo') {
      // the player reached the goal: the companion's magic carries her there too
      const me = g.sisters[g.player], other = g.sisters[otherOf(g.player)];
      if (me.atGoal && !other.atGoal && other.splash <= 0) {
        const side = me.x + me.w / 2 >= g.door.x ? -1 : 1;
        if (g.blink(other.id, g.door.x + side * 22, g.door.bottom)) { other.ground = true; other.atGoal = atDoor(other); }
      }
    }
    if (list.every(s => s.atGoal)) {
      g.state = 'clear'; g.clearT = 1.5;
      emit('clear');
    }
  }

  g.start = i => { g.load(i); g.state = 'play'; };
  g.press = (id, what) => {
    if (g.state !== 'play') return;
    const s = g.sisters[id];
    if (what === 'jump') s.jumpBuf = phys().buffer;
    if (what === 'act') s.actBuf = 1;
  };

  /* Solo: switch the sister the child controls. */
  g.swap = () => {
    if (g.mode !== 'solo') return;
    g.player = otherOf(g.player);
    for (const id of ['frost', 'nuan']) Object.assign(g.input[id], { l: 0, r: 0, d: 0 });
    emit('swap', { player: g.player });
  };

  /* Magic blink (PLAN A1): teleport sister `id` so that her feet centre is at (x, y) in pixels (y = the ground line, like door.bottom).
     The spot is nudged to the nearest place where she fits and does not stand in water. Returns true when she moved.
     Emits { type: 'blink', who, from: {x, y}, to: {x, y} } with the same feet-centre convention. */
  /* Where body `s` fits when its feet centre should be at (x, y): the nearest place where it does not overlap anything solid
     and does not stand over water; { x, y } top-left, or null. */
  function placeBody(s, x, y) {
    const fits = (nx, ny) => {
      if (hits(s, nx, ny)) return false;
      const feet = ny + s.h;
      if (g.floes.some(f => nx + s.w / 2 >= f.x && nx + s.w / 2 <= f.x + f.w && f.y >= feet - 2 && f.y <= feet + 10)) return true;   // on an ice floe
      const midC = Math.floor((nx + s.w / 2) / T);
      for (let r = Math.floor((ny + s.h - 6) / T); r < ROWS; r++) {     // what she would land on: never water
        const ch = cell(midC, r);
        if (ch === '~') return false;
        if (hardSolid(ch) || isRamp(ch) || (ch === '=' && r * T >= ny + s.h - 1)) return true;
      }
      return true;
    };
    for (const dy of [0, -8, -T / 2, -T, -T * 1.5, -T * 2]) {
      for (const dx of [0, -T / 2, T / 2, -T, T, -T * 1.5, T * 1.5]) {
        const nx = x - s.w / 2 + dx, ny = y - s.h + dy;
        if (nx >= 0 && nx + s.w <= COLS * T && ny >= 0 && fits(nx, ny)) return { x: nx, y: ny };
      }
    }
    return null;
  }

  g.blink = (id, x, y) => {
    const s = g.sisters[id];
    if (!s || g.state !== 'play') return false;
    const pos = placeBody(s, x, y);
    if (!pos) return false;
    const from = { x: s.x + s.w / 2, y: s.y + s.h };
    s.x = pos.x; s.y = pos.y; s.vx = 0; s.vy = 0; s.ground = false; s.splash = 0;
    s.coyote = 0; s.jumpBuf = 0; s.actBuf = 0; s.doubled = false; s.dropT = 0; s.slide = 0; s.slope = 0; s.noteAt = null;
    if (steadyUnder(s)) s.safe = { x: s.x, y: s.y };
    emit('blink', { who: id, from, to: { x: s.x + s.w / 2, y: s.y + s.h } });
    return true;
  };

  g.guide = () => {
    const list = LEVELS[g.index].guide || [];
    const i = list.findIndex((e, k) => !g.guideDone[k]);
    if (i < 0) return null;
    const e = list[i];
    const out = { i, c: e.c, r: e.r, say: e.say, x: e.c * T + T / 2, y: e.r * T + T / 2 };
    if (e.bunny != null) out.bunny = e.bunny;
    if (e.note != null) out.note = e.note;
    return out;
  };

  g.step = dt => {
    g.time += dt;
    if (g.state === 'clear') {
      g.clearT -= dt;
      if (g.clearT <= 0) {
        if (g.index + 1 < LEVELS.length) g.start(g.index + 1);
        else { g.state = 'win'; emit('win'); }
      }
      return;
    }
    if (g.state !== 'play') return;
    updateFloes(dt);
    updateSister(g.sisters.frost, dt);
    updateSister(g.sisters.nuan, dt);
    updateGates();
    collect();
    updateBunnies(dt);
    updateFlowers();
    updateDoor();
    collectMemory();
    updateGuide();
    checkGoal();
  };
  return g;
}

    const out = [];
    for (let r = 0; r < ROWS; r++) {
      let start = -1;
      for (let c = 0; c <= COLS; c++) {
        const on = c < COLS && test(c, r);
        if (on && start < 0) start = c;
        if (!on && start >= 0) { out.push({ r, c: start, len: c - start }); start = -1; }

    return out;
  }

  function drawTiles() {

      for (let i = 0; i < n; i++) img('shelf' + ((run.c + i) % 3), run.c * T + i * piece - 5, run.r * T - 6, piece + 10, Math.min(46, piece * .36 + 6), box);
    }

  }

  const fishSwarm = [];
  function drawFish() {
    const box = layer('decor', 'goal');
    box.textContent = '';

    const lv = LEVELS[game.index];
    if (!lv || !(lv.words || []).includes('fish') || !SIZES.fish_1 || !SIZES.fish_2) return;
    for (const run of runs((c, r) => cellAt(c, r) === '~')) {

      for (let k = 0; k < n; k++) {

        const frames = [1, 2].map(f => {
          const [w, h] = SIZES['fish_' + f];

  /* The memory fragment: a glowing star that waits at level.memory until the logic reports it found (event 'memory'). */

  function drawFragment() {

    const mx = +fragNode.dataset.x, my = +fragNode.dataset.y;
    fragNode.remove(); fragNode = null;

  /* Everything that depends on the room: called for the 'load' event, whenever the logic (re)loads a level. */
  function rebuild() {
    const lv = LEVELS[game.index];
    $('bg').setAttribute('href', SRC(lv.bg));
    drawTiles(); drawGlows(); drawItems(); drawGoal(); drawGates(); drawFish(); drawFragment();
    if (typeof drawToys === 'function') drawToys();   // 15-toys
    clearFx();
    guideReset();
  }
  /* ===== e / view-rewards: the six new toys (CONTRACT §9 state, §10 pictures) =====
     Slopes, spring mushrooms, note steps, bunny nests and ice flowers are read from game.grid; floes from game.floes,
     bunnies from game.bunnies, flowers from game.flowers, the melody from game.melody. Everything degrades: a picture that
     is not delivered yet is replaced by a small vector drawing (probed first, so no broken-image icon ever shows), and a
     piece of logic state that is not there yet simply draws nothing.
     Hooks (CONTRACT §7): 10-stage rebuild() calls drawToys(); 90-main frame() calls updateToys(dt, now).
     Events: the frame loop drains game.events before updateToys runs, so this file tees game.events.push once and reads
     its own copy. Private names carry the `ty` prefix (one shared view scope). */

  const TY_NOTE_COL = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#74c0fc'];   // red orange yellow green blue = do re mi so la
  const TY_NOTE_HZ = [523.25, 587.33, 659.25, 783.99, 880];
    const tyState = { springs: [], notes: [], flowers: [], floes: new Map(), bunnies: new Map(), melodySig: '', strip: null, lines: {} };
  const tyQueue = [];

  /* ---------- pictures: probe first, draw the vector placeholder until the picture is known to load ---------- */
  const tyImgState = {};
  const tyImgWait = {};
  function tyProbe(name, cb) {
    const st = tyImgState[name];
    if (st === 'ok') { cb(true); return; }
    if (st === 'bad') { cb(false); return; }
    (tyImgWait[name] || (tyImgWait[name] = [])).push(cb);
    if (st) return;
    tyImgState[name] = 'wait';
    const im = new Image();
    const done = ok => { tyImgState[name] = ok ? 'ok' : 'bad'; const l = tyImgWait[name] || []; tyImgWait[name] = []; l.forEach(f => { try { f(ok); } catch (e) {} }); };
    im.onload = () => done(true);
    im.onerror = () => done(false);
    im.src = SRC(name);
  }
  const tyHas = name => tyImgState[name] === 'ok';
  /* A <g> that holds the picture `name` in the box, or fallback(g) until the picture exists. */
  function tyPic(parent, name, x, y, w, h, fallback, extra) {
    const g = el('g', {}, parent);
    const put = () => { g.textContent = ''; img(name, x, y, w, h, g, Object.assign({ preserveAspectRatio: 'xMidYMax meet' }, extra)); };
    if (tyImgState[name] === 'ok') { put(); return g; }
    if (fallback) fallback(g);
    if (tyImgState[name] !== 'bad') tyProbe(name, ok => { if (ok) put(); });
    return g;
  }
  const tyShow = (node, on) => { if (node) node.setAttribute('visibility', on ? 'visible' : 'hidden'); };

  /* ---------- sound (own synthesis on the shared audio context; silent if audio is not awake) ---------- */
  function tyAudioReady() {
    try { return typeof audio !== 'undefined' && !!audio && typeof bus !== 'undefined' && !!bus && typeof bell === 'function'; } catch (e) { return false; }
  }
  function tyTone(n, soft) {
    if (!tyAudioReady() || !(n >= 1 && n <= 5)) return;

  }
  function tyBoing() {

  /* ---------- toy reaction lines: toy_<family>_<n>, played when the key exists (c-content writes them) ----------
     cool: seconds between two plays of a family, max: plays per room, byN: the variation is the note number (toy_note_ok_<n>
     names the colour of note n), hard: may interrupt a line that is still running (milestones). */
  const TY_LINES = {
    slide: { cool: 9, max: 4 }, bounce: { cool: 9, max: 4 }, bunny: { cool: 5, max: 6 }, bunny_home: { cool: 3, max: 6, wait: 3000 },
    floe: { cool: 9, max: 3 }, note_ok: { cool: 1, max: 99, byN: true, wait: 1200 }, note_wrong: { cool: 6, max: 3 },
    melody: { cool: 0, max: 99, hard: true }, bloom: { cool: 4, max: 6 },

  function tyToyLine(family, n) {
    try {
      const cfg = TY_LINES[family];
      if (!cfg || game.state !== 'play' || typeof voice === 'undefined' || !voice || typeof voice.line !== 'function') return;
      if (typeof storyIsOpen === 'function' && storyIsOpen()) return;
      if (voice.busy && !cfg.hard) return;
      const rec = tyState.lines[family] || (tyState.lines[family] = { t: -99, n: 0, played: 0 }), now = performance.now() / 1000;
      if (now - rec.t < cfg.cool || rec.played >= cfg.max) return;

    } catch (e) {}

  /* ---------- build ---------- */
  function tyCells(test) {
    const out = [];

    const ev = game.events;

      return push.apply(this, items);

  }

  function drawToys() {

      const dirR = ch === '\\', x = c * T, y = r * T;

      tyPic(lit, `note_${n}_lit`, -1, -1, T + 2, T + 2, f => tyNoteShape(f, n, true), { preserveAspectRatio: 'none' });
      tyState.notes.push({ c, r, n, g, lit, inner, flash: 0, wob: 0 });

      const f0 = tyPic(inner, 'spring_0', 0, -2, T, T + 2, n => tySpringShape(n, false));
