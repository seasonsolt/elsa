<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>艾莎和安娜的冰堡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a painted picture-book page fills the screen; a quiet caption band sits under it. */
:root {
  --night: #141c46;
  --ink: #1b2559;
  --line: #4a5aa6;
  --ice: #cfe6ff;
  --paper: #f6f7ff;
  --gold: #ffd27a;
  --ember: #ffbd7e;
  --muted: #a9b6e2;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --latin: "Fredoka", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  overscroll-behavior: none;
}
/* The stage is as big as the window allows (960:520), never scrolls. Parent subtitles reserve a band under it. */
#stage {
  display: block;
  width: min(100vw, calc(100dvh * 960 / 520));
  height: auto;
  background: #2a3a86;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
}
body.subs #stage { width: min(100vw, calc((100dvh - 84px) * 960 / 520)); }
body.touch #stage { width: min(100vw, calc((100dvh - 84px) * 960 / 520)); }
#stage text { font-family: var(--display); }
#stage .latin { font-family: var(--latin); font-weight: 600; }
.btn { cursor: pointer; outline: none; }
.page { animation: pageIn .45s ease-out both; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
.gateArt { transition: transform .35s ease; }
.flicker { animation: flicker 3.2s ease-in-out infinite alternate; }
@keyframes flicker { 0% { opacity: .55; } 40% { opacity: .9; } 70% { opacity: .68; } 100% { opacity: 1; } }
.shimmer { animation: shimmer 2.4s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .82; } to { opacity: 1; } }
.flake { animation: fall linear infinite; }
@keyframes fall { from { transform: translate(0, -30px); } to { transform: translate(38px, 560px); } }

/* ---- Picture buttons (60-story.js / 70-ui.js build them; position lives on an outer <g>, scale on .ux-btn) ---- */
.ux-btn, .ux-card, .ux-tile { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: center; transition: transform .14s ease-out; -webkit-tap-highlight-color: transparent; }
.ux-btn:hover, .ux-btn:focus-visible, .ux-tile:hover, .ux-tile:focus-visible { transform: scale(1.1); }
.ux-card:hover, .ux-card:focus-visible { animation: uxWig .6s ease-in-out; }
.ux-btn:active, .ux-tile:active { transform: scale(.95); }
.ux-btn:focus-visible .ux-plate, .ux-tile:focus-visible .ux-frame { stroke: var(--gold); stroke-width: 4; }
.ux-btn.dim { opacity: .5; }
.ux-pulse { animation: uxPulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes uxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
.ux-pop { opacity: 0; transform: scale(.4); transform-box: fill-box; transform-origin: center; }
.ux-pop.show { animation: uxPop .55s cubic-bezier(.3, 1.5, .5, 1) forwards; }
@keyframes uxPop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.ux-wig { animation: uxWig .5s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes uxWig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg) scale(1.05); } 75% { transform: rotate(5deg) scale(1.05); } }
.ux-shake { animation: uxShake .4s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes uxShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.ux-glow { animation: uxGlow 1s ease-in-out infinite alternate; }
@keyframes uxGlow { from { opacity: .25; } to { opacity: 1; } }
.ux-bob { animation: uxBob .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
@keyframes uxBob { from { transform: translateY(0) scale(1); } to { transform: translateY(-8px) scale(1.03); } }
.ux-bounce { animation: uxBounce .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes uxBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.ux-star { transition: transform .7s cubic-bezier(.3, 1.2, .4, 1); }
.ux-ring { transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; stroke-dashoffset: var(--len); transition: stroke-dashoffset .25s ease-out; }
.ux-hold .ux-ring { stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold, 2s) linear; }
.ux-key { transition: transform .08s, opacity .2s; transform-box: fill-box; transform-origin: center; opacity: .8; }   /* slightly quiet until pressed or taught; it sits in the top bar after the counters */
.ux-key.lit, .ux-key.teach { opacity: 1; }
.ux-key.lit { transform: scale(1.14); }
.ux-key.teach { animation: uxPulse .7s ease-in-out infinite; }
.ux-conf { animation: uxConf 1.5s cubic-bezier(.15, .7, .35, 1) forwards; transform-box: fill-box; transform-origin: center; }
@keyframes uxConf { 0% { transform: translate(0, 0) rotate(0) scale(.4); opacity: 1; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; } }
.rw-item { cursor: grab; touch-action: none; }
.rw-item:active { cursor: grabbing; }
.rw-choice[data-state="lock"], .rw-choice[data-state="miss"] { cursor: not-allowed; }
.ux-opt rect { transition: fill .12s; }
.ux-opt:hover rect.ux-bg { fill: #5a6fca; }
.ux-soft { transition: opacity .3s; }
@media (prefers-reduced-motion: reduce) {
  .flake, .flicker, .shimmer, .page, .ux-pulse, .ux-bob, .ux-bounce, .ux-glow, .ux-key.teach { animation: none; }
  .flake { display: none; }
}

/* ---- Parent strip under the stage: hint line and key legends, only while parent subtitles are on ---- */
#info {
  width: min(100vw, calc((100dvh - 84px) * 960 / 520));
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 28px; align-items: start;
  font-size: 13px; line-height: 1.5; padding: 0 12px; box-sizing: border-box; max-height: 68px; overflow: hidden;
}
body:not(.subs) #info { display: none; }
#hint { min-width: 0; color: var(--ice); text-wrap: pretty; }
.keys { color: var(--muted); white-space: nowrap; }
.keys b { font-weight: 600; display: block; }
.keys.frost b { color: var(--ice); } .keys.nuan b { color: var(--ember); }
body[data-mode="solo"] .keys.frost, body:not([data-mode]) .keys.frost { display: none; }
body[data-mode="duo"] .keys.solo { display: none; }
body[data-mode="solo"] .keys.nuan, body:not([data-mode]) .keys.nuan { display: none; }
kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--paper); }

/* ---- Touch pad: symbols only ---- */
#touch { display: none; width: min(100%, 720px); gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 12px; box-sizing: border-box; }
#touch button {
  appearance: none; border: 1px solid var(--line); border-radius: 14px; background: var(--ink); color: var(--paper);
  font-family: var(--display); font-size: 26px; min-height: 64px; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
#touch button.on { background: #5a6fca; }
#touch #tSwitch { color: var(--gold); }
body.touch #touch { display: grid; }
body.touch #info { grid-template-columns: minmax(0, 1fr); }
body.touch .keys { display: none; }
</style>

<svg id="stage" viewBox="0 0 960 520" role="img" aria-label="艾莎和安娜在冰堡里的游戏画面">
  <defs>
    <pattern id="brick" width="160" height="160" patternUnits="userSpaceOnUse"><image href="game/brick.webp" width="160" height="160"/></pattern>
    <pattern id="water" width="116" height="30" patternUnits="userSpaceOnUse"><image href="game/water.webp" width="116" height="30" preserveAspectRatio="none"/></pattern>
    <radialGradient id="warm"><stop offset="0" stop-color="#ffd089" stop-opacity=".75"/><stop offset=".45" stop-color="#ffb35f" stop-opacity=".26"/><stop offset="1" stop-color="#ffb35f" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".62"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop offset="0" stop-color="#ff9cc0" stop-opacity=".6"/><stop offset="1" stop-color="#ff9cc0" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".74"><stop offset=".62" stop-color="#0d1438" stop-opacity="0"/><stop offset="1" stop-color="#0d1438" stop-opacity=".5"/></radialGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c52" stop-opacity=".5"/><stop offset="1" stop-color="#141c52" stop-opacity="0"/></linearGradient>
    <radialGradient id="chillEdge" cx=".5" cy=".5" r=".72"><stop offset=".48" stop-color="#e4f4ff" stop-opacity="0"/><stop offset=".82" stop-color="#d6ecff" stop-opacity=".38"/><stop offset="1" stop-color="#f2faff" stop-opacity=".9"/></radialGradient>
    <linearGradient id="storyTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1438" stop-opacity=".82"/><stop offset=".6" stop-color="#0d1438" stop-opacity=".55"/><stop offset="1" stop-color="#0d1438" stop-opacity="0"/></linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a4c" stop-opacity=".78"/><stop offset=".5" stop-color="#101a4c" stop-opacity=".12"/><stop offset=".78" stop-color="#101a4c" stop-opacity="0"/><stop offset="1" stop-color="#101a4c" stop-opacity=".68"/></linearGradient>
    <filter id="silhouette" x="-5%" y="-5%" width="110%" height="110%"><feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .46  0 0 0 0 .62  0 0 0 .92 0"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0d1438" flood-opacity=".45"/></filter>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#cfe0ff" stop-opacity=".9"/></linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9ae"/><stop offset="1" stop-color="#ffbf5c"/></linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1438" stop-opacity="0"/><stop offset="1" stop-color="#0d1438" stop-opacity=".78"/></linearGradient>
    <clipPath id="avatarClip"><circle r="1" cx="0" cy="0"/></clipPath>
  </defs>
  <image id="bg" width="960" height="520" preserveAspectRatio="none"/>
  <g id="glows"></g>
  <g id="snowBack" aria-hidden="true"></g>
  <g id="gates"></g>
  <g id="tiles"></g>
  <g id="goal"></g>
  <g id="items"></g>
  <g id="shadows"></g>
  <g id="sisters"></g>
  <g id="fx"></g>
  <g id="memory"></g>
  <g id="snowFront" aria-hidden="true"></g>
  <rect id="chill" width="960" height="520" fill="url(#chillEdge)" opacity="0" pointer-events="none"/>
  <rect width="960" height="520" fill="url(#vignette)" pointer-events="none"/>
  <g id="talk" aria-live="polite"></g>
  <g id="hud"></g>
  <g id="overlay"></g>
  <g id="modal"></g>
  <g id="subs" pointer-events="none"></g>
</svg>

<div id="touch">
  <button id="tLeft" aria-label="left">&#9664;</button><button id="tRight" aria-label="right">&#9654;</button><button id="tJump" aria-label="jump">&#9650;</button><button id="tAct" aria-label="magic">&#10022;</button><button id="tSwitch" aria-label="swap">&#8646;</button>
</div>

<div id="info">
  <div id="hint"></div>
  <div class="keys solo"><b>单人模式</b><kbd>←</kbd> <kbd>→</kbd> 走 <kbd>↑</kbd> 跳 <kbd>空格</kbd> 魔法 <kbd>Tab</kbd> 换人</div>
  <div class="keys frost"><b>艾莎：造冰块、冻住水面</b><kbd>A</kbd> <kbd>D</kbd> 走 <kbd>W</kbd> 跳 <kbd>S</kbd> 下 <kbd>F</kbd> 魔法</div>
  <div class="keys nuan"><b>安娜：二段跳、融化粉冰墙</b><kbd>←</kbd> <kbd>→</kbd> 走 <kbd>↑</kbd> 跳 <kbd>↓</kbd> 下 <kbd>Enter</kbd> 魔法</div>
</div>
