<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霜霜和暖暖的冰堡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a painted picture-book page fills the screen; a quiet caption band sits under it. */
:root {
  --night: #141c46;
  --ink: #1b2559;
  --line: #4a5aa6;
  --ice: #cfe6ff;
  --paper: #f6f7ff;
  --gold: #ffd27a;
  --ember: #ffbd7e;
  --muted: #a9b6e2;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  overscroll-behavior: none;
}
#stage {
  display: block;
  width: min(100%, calc((100dvh - 132px) * 1.846));
  height: auto;
  border-radius: 12px;
  background: #2a3a86;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
}
#stage text { font-family: var(--display); }
.btn { cursor: pointer; outline: none; }
.btn rect { transition: fill .12s; }
.btn:hover rect, .btn:focus-visible rect { fill: #5a6fca; }
.btn:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
.primary rect { fill: #ffd27a; }
.primary text { fill: #4a2c05 !important; }
.primary:hover rect, .primary:focus-visible rect { fill: #ffe5ad; }
.page { animation: pageIn .45s ease-out both; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
.gateArt { transition: transform .35s ease; }
.flicker { animation: flicker 3.2s ease-in-out infinite alternate; }
@keyframes flicker { 0% { opacity: .55; } 40% { opacity: .9; } 70% { opacity: .68; } 100% { opacity: 1; } }
.shimmer { animation: shimmer 2.4s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .82; } to { opacity: 1; } }
.flake { animation: fall linear infinite; }
@keyframes fall { from { transform: translate(0, -30px); } to { transform: translate(38px, 560px); } }
@media (prefers-reduced-motion: reduce) {
  .flake, .flicker, .shimmer, .page { animation: none; }
  .flake { display: none; }
}
#info {
  width: min(100%, calc((100dvh - 132px) * 1.846));
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 28px; align-items: start;
  font-size: 13px; line-height: 1.55;
}
#hint { min-width: 0; color: var(--ice); text-wrap: pretty; }
.keys { color: var(--muted); white-space: nowrap; }
.keys b { font-weight: 600; display: block; }
.keys.frost b { color: var(--ice); } .keys.nuan b { color: var(--ember); }
kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--paper); }
#touch { display: none; width: min(100%, 720px); gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
#touch button {
  appearance: none; border: 1px solid var(--line); border-radius: 12px; background: var(--ink); color: var(--paper);
  font-family: var(--display); font-size: 17px; padding-block: 14px; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
#touch button.on { background: #5a6fca; }
#touch #tSwitch { color: var(--gold); }
body.touch #touch { display: grid; }
body.touch #info { grid-template-columns: minmax(0, 1fr); }
body.touch .keys { display: none; }
@media (max-width: 640px) {
  #info { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #hint { grid-column: 1 / -1; }
  .keys { white-space: normal; }
}
</style>

<svg id="stage" viewBox="0 0 960 520" role="img" aria-label="霜霜和暖暖在冰堡里的游戏画面">
  <defs>
    <pattern id="brick" width="160" height="160" patternUnits="userSpaceOnUse"><image href="game/brick.webp" width="160" height="160"/></pattern>
    <pattern id="water" width="116" height="30" patternUnits="userSpaceOnUse"><image href="game/water.webp" width="116" height="30" preserveAspectRatio="none"/></pattern>
    <radialGradient id="warm"><stop offset="0" stop-color="#ffd089" stop-opacity=".75"/><stop offset=".45" stop-color="#ffb35f" stop-opacity=".26"/><stop offset="1" stop-color="#ffb35f" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".62"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop offset="0" stop-color="#ff9cc0" stop-opacity=".6"/><stop offset="1" stop-color="#ff9cc0" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".74"><stop offset=".62" stop-color="#0d1438" stop-opacity="0"/><stop offset="1" stop-color="#0d1438" stop-opacity=".5"/></radialGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c52" stop-opacity=".5"/><stop offset="1" stop-color="#141c52" stop-opacity="0"/></linearGradient>
    <radialGradient id="chillEdge" cx=".5" cy=".5" r=".72"><stop offset=".48" stop-color="#e4f4ff" stop-opacity="0"/><stop offset=".82" stop-color="#d6ecff" stop-opacity=".38"/><stop offset="1" stop-color="#f2faff" stop-opacity=".9"/></radialGradient>
    <linearGradient id="storyTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1438" stop-opacity=".82"/><stop offset=".6" stop-color="#0d1438" stop-opacity=".55"/><stop offset="1" stop-color="#0d1438" stop-opacity="0"/></linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a4c" stop-opacity=".78"/><stop offset=".5" stop-color="#101a4c" stop-opacity=".12"/><stop offset=".78" stop-color="#101a4c" stop-opacity="0"/><stop offset="1" stop-color="#101a4c" stop-opacity=".68"/></linearGradient>
  </defs>
  <image id="bg" width="960" height="520" preserveAspectRatio="none"/>
  <g id="glows"></g>
  <g id="snowBack" aria-hidden="true"></g>
  <g id="gates"></g>
  <g id="tiles"></g>
  <g id="goal"></g>
  <g id="items"></g>
  <g id="shadows"></g>
  <g id="sisters"></g>
  <g id="fx"></g>
  <g id="memory"></g>
  <g id="snowFront" aria-hidden="true"></g>
  <rect id="chill" width="960" height="520" fill="url(#chillEdge)" opacity="0" pointer-events="none"/>
  <rect width="960" height="520" fill="url(#vignette)" pointer-events="none"/>
  <g id="talk" aria-live="polite"></g>
  <g id="hud"></g>
  <g id="overlay"></g>
</svg>

<div id="touch">
  <button id="tLeft">向左</button><button id="tRight">向右</button><button id="tJump">跳</button><button id="tAct">魔法</button><button id="tSwitch">换人</button>
</div>

<div id="info">
  <div id="hint">两个人一起玩，或者一个人轮流操作两姐妹都可以。</div>
  <div class="keys frost"><b>霜霜：造冰块、冻住水面</b><kbd>A</kbd> <kbd>D</kbd> 走 <kbd>W</kbd> 跳 <kbd>S</kbd> 下 <kbd>F</kbd> 魔法</div>
  <div class="keys nuan"><b>暖暖：二段跳、融化粉冰墙</b><kbd>←</kbd> <kbd>→</kbd> 走 <kbd>↑</kbd> 跳 <kbd>↓</kbd> 下 <kbd>Enter</kbd> 魔法</div>
</div>

<script id="logic">
const T = 40, COLS = 24, ROWS = 13;
const PHYS = { gravity: 1800, speed: 220, jump: 575, maxFall: 900, coyote: 0.09, buffer: 0.12 };
const MAX_BLOCKS = 3;

const LEVELS = [
  {
    name: '冰堡大厅',
    hint: '霜霜收蓝雪花，暖暖收红爱心。墙太高时，霜霜用魔法造冰块当台阶，暖暖可以连跳两下。暖暖走到粉冰墙边用魔法融化它，然后两人一起走到门口。',
    map: [
      '########################',
      '#................#.....#',
      '#................#.....#',
      '#................#.....#',
      '#.........h......#.....#',
      '#................#.....#',
      '#.......====.....#.....#',
      '#................#.....#',
      '#.........*......#.....#',
      '#......#####.....X.....#',
      '#......#####.....X.....#',
      '#EA.h..#####.*...X..D..#',
      '########################',
    ],
  },
  {
    name: '冰湖长廊',
    hint: '水很冷，掉下去会回到岸边。霜霜站在水边用魔法，就能把湖面冻成冰路。最多同时存在 3 块冰块，再造时最早的一块会消失。',
    map: [
      '########################',
      '#..................#...#',
      '#..................#...#',
      '#..h.........*.....#...#',
      '#=====.......====..#...#',
      '#..................#...#',
      '#..................#...#',
      '#.......========...#...#',
      '#..................#...#',
      '#...*..............X...#',
      '#EA................X.D.#',
      '######~~~~~~~~~~~#######',
      '########################',
    ],
  },
  {
    name: '机关塔楼',
    hint: '金色踏板被压住时，铁门才会打开。可以让一位姐妹站在上面，也可以让霜霜放一块冰块压住它。',
    map: [
      '########################',
      '#...........#......#...#',
      '#..h........#...h..#...#',
      '#=====......#..====#...#',
      '#...........#......#...#',
      '#.......===.#......#...#',
      '#...........#.===..#...#',
      '#..*........#......#...#',
      '#====.......#..*...#...#',
      '#...........G.===..X...#',
      '#...........G......X...#',
      '#EA.....P...G......X.D.#',
      '########################',
    ],
  },
  {
    name: '星光舞厅',
    hint: '找到 3 个大雪球，谁捡都可以。雪人堆好后，两姐妹一起站到雪人身边就完成了。',
    goal: 'snowman',
    map: [
      '########################',
      '#......................#',
      '#.o..................o.#',
      '#=====............=====#',
      '#......................#',
      '#...........o..........#',
      '#.......========.......#',
      '#......................#',
      '#..h................*..#',
      '#=====............=====#',
      '#......................#',
      '#.........EA.S.........#',
      '#####~~~##########~~~###',
    ],
  },
];

function createGame() {
  const g = {
    state: 'title', index: 0, grid: [], items: [], blocks: [], events: [],
    sisters: {}, plates: [], gates: [], gatesOpen: false, door: null, goal: 'door',
    doorOpen: false, clearT: 0, time: 0,
    input: { frost: { l: 0, r: 0, d: 0 }, nuan: { l: 0, r: 0, d: 0 } },
  };
  const emit = (type, data) => g.events.push(Object.assign({ type }, data));

  function makeSister(id, c, r) {
    const w = 26, h = id === 'frost' ? 58 : 54;
    const x = c * T + (T - w) / 2, y = (r + 1) * T - h;
    return { id, x, y, w, h, vx: 0, vy: 0, dir: 1, ground: false, coyote: 0, jumpBuf: 0, actBuf: 0,
      doubled: false, dropT: 0, splash: 0, atGoal: false, safe: { x, y } };
  }

  g.load = i => {
    const lv = LEVELS[i];
    g.index = i; g.items = []; g.blocks = []; g.plates = []; g.gates = [];
    g.gatesOpen = false; g.doorOpen = false; g.goal = lv.goal || 'door';
    g.grid = lv.map.map((row, r) => row.split('').map((ch, c) => {
      if (ch === 'E') { g.sisters.frost = makeSister('frost', c, r); return '.'; }
      if (ch === 'A') { g.sisters.nuan = makeSister('nuan', c, r); return '.'; }
      if (ch === '*' || ch === 'h' || ch === 'o') {
        g.items.push({ kind: ch, c, r, x: c * T + T / 2, y: r * T + T / 2, got: false });
        return '.';
      }
      if (ch === 'D' || ch === 'S') { g.door = { c, r, x: c * T + T / 2, bottom: (r + 1) * T }; return '.'; }
      if (ch === 'P') g.plates.push({ c, r, down: false });
      if (ch === 'G') g.gates.push({ c, r });
      return ch;
    }));
    emit('load');
  };

  const cell = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? '#' : g.grid[r][c];
  const hardSolid = ch => ch === '#' || ch === 'X' || ch === 'I' || ch === 'B' || (ch === 'G' && !g.gatesOpen);

  function overlapsTile(s, c, r) {
    return s.x < (c + 1) * T && s.x + s.w > c * T && s.y < (r + 1) * T && s.y + s.h > r * T;
  }

  function hits(s, x, y) {
    const c0 = Math.floor(x / T), c1 = Math.floor((x + s.w - 0.001) / T);
    const r0 = Math.floor(y / T), r1 = Math.floor((y + s.h - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (hardSolid(cell(c, r))) return { c, r };
    }
    return null;
  }

  function moveX(s, dx) {
    if (!dx) return;
    const hit = hits(s, s.x + dx, s.y);
    if (!hit) { s.x += dx; return; }
    s.x = dx > 0 ? hit.c * T - s.w : (hit.c + 1) * T;
    s.vx = 0;
  }

  function moveY(s, dy) {
    s.ground = false;
    if (dy > 0) {
      const oldBottom = s.y + s.h, newBottom = oldBottom + dy;
      const hit = hits(s, s.x, s.y + dy);
      if (hit) { s.y = hit.r * T - s.h; s.vy = 0; s.ground = true; return; }
      if (s.dropT <= 0) {
        const r = Math.floor((newBottom - 0.001) / T);
        const top = r * T;
        if (oldBottom <= top + 0.001 && newBottom > top) {
          const c0 = Math.floor(s.x / T), c1 = Math.floor((s.x + s.w - 0.001) / T);
          for (let c = c0; c <= c1; c++) if (cell(c, r) === '=') {
            s.y = top - s.h; s.vy = 0; s.ground = true; return;
          }
        }
      }
      s.y += dy;
    } else if (dy < 0) {
      const hit = hits(s, s.x, s.y + dy);
      if (hit) { s.y = (hit.r + 1) * T; s.vy = 0; return; }
      s.y += dy;
    }
  }

  function freeze(fromC, r, dir) {
    let n = 0;
    for (let c = fromC; n < 3 && cell(c, r) === '~'; c += dir, n++) {
      g.grid[r][c] = 'I';
      emit('freeze', { c, r });
    }
    return n;
  }

  function canBlock(c, r) {
    const ch = cell(c, r);
    if (ch !== '.' && ch !== 'P') return false;
    if (g.items.some(it => !it.got && it.c === c && it.r === r)) return false;
    if (g.door && c === g.door.c && (r === g.door.r || r === g.door.r - 1)) return false;
    return !Object.values(g.sisters).some(s => overlapsTile(s, c, r));
  }

  function frostMagic(s) {
    const fc = s.dir > 0 ? Math.floor((s.x + s.w - 0.001) / T) + 1 : Math.floor(s.x / T) - 1;
    const fr = Math.floor((s.y + s.h - 0.001) / T);
    const own = Math.floor((s.x + s.w / 2) / T);
    for (let r = fr; r <= fr + 3; r++) {
      if (cell(fc, r) === '~' && freeze(fc, r, s.dir)) { emit('magic', { who: 'frost' }); return; }
      if (cell(own, r) === '~' && freeze(own, r, s.dir)) { emit('magic', { who: 'frost' }); return; }
    }
    for (const r of [fr, fr - 1]) {
      if (canBlock(fc, r)) {
        if (g.blocks.length >= MAX_BLOCKS) removeBlock(g.blocks[0]);
        g.blocks.push({ c: fc, r, under: g.grid[r][fc] });
        g.grid[r][fc] = 'B';
        emit('block', { c: fc, r });
        return;
      }
    }
    emit('fizz', { who: 'frost', x: s.x + s.w / 2, y: s.y });
  }

  function removeBlock(b) {
    g.blocks.splice(g.blocks.indexOf(b), 1);
    g.grid[b.r][b.c] = b.under;
    emit('unblock', { c: b.c, r: b.r });
  }

  function nuanMagic(s) {
    const pad = 26;
    const box = { x: s.x - pad, y: s.y - 10, w: s.w + pad * 2, h: s.h + 20 };
    const seeds = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (g.grid[r][c] === 'X' && overlapsTile(box, c, r)) seeds.push([c, r]);
    }
    if (!seeds.length) { emit('fizz', { who: 'nuan', x: s.x + s.w / 2, y: s.y }); return; }
    while (seeds.length) {
      const [c, r] = seeds.pop();
      if (cell(c, r) !== 'X') continue;
      g.grid[r][c] = '.';
      emit('melt', { c, r });
      seeds.push([c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]);
    }
    emit('magic', { who: 'nuan' });
  }

  function updateSister(s, dt) {
    if (s.splash > 0) {
      s.splash -= dt;
      if (s.splash <= 0) { s.x = s.safe.x; s.y = s.safe.y; s.vx = 0; s.vy = 0; s.ground = false; emit('respawn', { who: s.id }); }
      return;
    }
    const inp = g.input[s.id];
    const move = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    s.vx = move * PHYS.speed;
    if (move) s.dir = move;
    if (inp.d) s.dropT = 0.18;
    s.dropT = Math.max(0, s.dropT - dt);
    s.coyote = s.ground ? PHYS.coyote : Math.max(0, s.coyote - dt);
    s.jumpBuf = Math.max(0, s.jumpBuf - dt);

    if (s.jumpBuf > 0) {
      if (s.coyote > 0) {
        s.vy = -PHYS.jump; s.jumpBuf = 0; s.coyote = 0; s.ground = false; s.doubled = false;
        emit('jump', { who: s.id });
      } else if (s.id === 'nuan' && !s.doubled) {
        s.vy = -PHYS.jump; s.jumpBuf = 0; s.doubled = true;
        emit('doublejump', { x: s.x + s.w / 2, y: s.y + s.h });
      }
    }
    if (s.actBuf > 0) {
      s.actBuf = 0;
      if (s.id === 'frost') frostMagic(s); else nuanMagic(s);
    }

    s.vy = Math.min(PHYS.maxFall, s.vy + PHYS.gravity * dt);
    moveX(s, s.vx * dt);
    moveY(s, s.vy * dt);
    if (s.ground) s.doubled = false;

    const footR = Math.floor((s.y + s.h - 6) / T), midC = Math.floor((s.x + s.w / 2) / T);
    if (cell(midC, footR) === '~') {
      s.splash = 0.75;
      emit('splash', { x: s.x + s.w / 2, y: s.y + s.h });
      return;
    }
    if (s.ground) {
      const below = Math.floor((s.y + s.h + 1) / T);
      const left = cell(Math.floor(s.x / T), below), right = cell(Math.floor((s.x + s.w - 0.001) / T), below);
      const steady = ch => ch === '#' || ch === 'I' || ch === '=';
      if (steady(left) && steady(right)) s.safe = { x: s.x, y: s.y };
    }
  }

  function updateGates() {
    const sisters = Object.values(g.sisters);
    let pressed = false;
    for (const p of g.plates) {
      p.down = cell(p.c, p.r) === 'B' || sisters.some(s => s.splash <= 0 && overlapsTile(s, p.c, p.r));
      pressed = pressed || p.down;
    }
    const blocked = g.gates.some(gt => sisters.some(s => overlapsTile(s, gt.c, gt.r)));
    const next = pressed || (g.gatesOpen && blocked);
    if (next !== g.gatesOpen) { g.gatesOpen = next; emit('gate', { open: next }); }
  }

  function collect() {
    for (const it of g.items) {
      if (it.got) continue;
      for (const s of Object.values(g.sisters)) {
        if (s.splash > 0) continue;
        if ((it.kind === '*' && s.id !== 'frost') || (it.kind === 'h' && s.id !== 'nuan')) continue;
        const dx = Math.abs(s.x + s.w / 2 - it.x), dy = Math.abs(s.y + s.h / 2 - it.y);
        if (dx < 28 && dy < s.h / 2 + 14) {
          it.got = true;
          emit('collect', { kind: it.kind, x: it.x, y: it.y });
          break;
        }
      }
    }
    const open = g.items.every(it => it.got);
    if (open && !g.doorOpen) { g.doorOpen = true; emit('open'); }
  }

  function checkGoal() {
    const list = Object.values(g.sisters);
    for (const s of list) {
      s.atGoal = g.doorOpen && s.ground && s.splash <= 0
        && Math.abs(s.x + s.w / 2 - g.door.x) < 44
        && Math.abs(s.y + s.h - g.door.bottom) < 4;
    }
    if (list.every(s => s.atGoal)) {
      g.state = 'clear'; g.clearT = 1.5;
      emit('clear');
    }
  }

  g.start = i => { g.load(i); g.state = 'play'; };
  g.press = (id, what) => {
    if (g.state !== 'play') return;
    const s = g.sisters[id];
    if (what === 'jump') s.jumpBuf = PHYS.buffer;
    if (what === 'act') s.actBuf = 1;
  };
  g.step = dt => {
    g.time += dt;
    if (g.state === 'clear') {
      g.clearT -= dt;
      if (g.clearT <= 0) {
        if (g.index + 1 < LEVELS.length) g.start(g.index + 1);
        else { g.state = 'win'; emit('win'); }

    }

    updateSister(g.sisters.nuan, dt);
    updateGates();
    collect();
    checkGoal();
  };

}

          if (e.open && game.plates.some(p => Math.abs(n.x + n.w / 2 - (p.c * T + T / 2)) < 26 && Math.abs(n.y + n.h - (p.r + 1) * T) < 12)) { speak('gate', 0, true); speak('gate_f', .3, true); }
          break;
        }
        case 'clear': showClear(); tones([523, 659, 784, 659, 784, 1047], 'triangle', .17); break;
        case 'win': showWin(); tones([523, 659, 784, 1047, 1319], 'sine', .24); break;
      }
    }
    game.events.length = 0;
    if (tiles) drawTiles();
  }

  let hintTimer = 0;
  function flashHint(msg) {
    $('hint').textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { $('hint').textContent = LEVELS[game.index].hint; }, 3500);
  }

  function rebuild() {
    $('overlay').textContent = '';
    $('bg').setAttribute('href', SRC(ROOMS[game.index].bg));
    setMusic(game.index);
    drawGlows(); drawItems(); drawGoal(); drawGates();
    resetTalk(); Object.assign(heart, { mood: 0, aloneT: 0, alone: false, apart: false, togetherT: 0 });
    if (game.state === 'play') { memGot[game.index] = false; levelT0 = game.time; }
    drawMemory();
    clearTimeout(hintTimer);
    $('hint').textContent = LEVELS[game.index].hint;
    if (game.state === 'play' && game.index !== introShown) showChapter();
  }

  /* Overlays */
  let story = null, introShown = -1;
  const say = (x, y, size, fill, text, extra) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${fill}" ${extra || ''}>${text}</text>`;
  function showTitle() {
    const rooms = LEVELS.map((lv, i) => `
      <g class="btn ${i === 0 ? 'primary' : ''}" role="button" tabindex="0" ${i === 0 ? 'data-story="1"' : `data-room="${i}"`} aria-label="${i === 0 ? '从序章开始' : '进入' + lv.name}">
        <rect x="${144 + i * 172}" y="444" width="156" height="58" rx="10" fill="#27357f"/>
        ${say(222 + i * 172, 467, 14, '#f6f7ff', (i === 0 ? '从序章开始' : '第 ' + (i + 1) + ' 间') + (best[i].some(Boolean) ? '  ' + best[i].map(b => b ? '★' : '☆').join('') : ''))}
        ${say(222 + i * 172, 490, 19, '#f6f7ff', lv.name)}
      </g>`).join('');
    $('overlay').innerHTML = `
      <image href="${SRC('key')}" width="960" height="520" preserveAspectRatio="none"/>
      <rect width="960" height="520" fill="url(#topFade)"/>
      ${say(480, 82, 60, '#fffdf4', '霜霜和暖暖的冰堡', 'stroke="#1b2559" stroke-width="7" paint-order="stroke" stroke-linejoin="round"')}
      ${say(480, 122, 20, '#f6f7ff', '王国陷入了永冬，暖暖要和姐姐一起把春天找回来', 'stroke="#1b2559" stroke-width="4" paint-order="stroke"')}
      ${rooms}
      <g class="btn" role="button" tabindex="0" data-profile="1" aria-label="姐妹档案">
        <rect x="812" y="18" width="128" height="34" rx="9" fill="#27357f" opacity=".92"/>${say(876, 41, 17, '#f6f7ff', '姐妹档案')}</g>`;
    setMusic('title');
    $('hint').textContent = '两个人一起玩，或者一个人轮流操作两姐妹都可以。';
    const first = $('overlay').querySelector('[data-story]');
    if (first) first.focus({ preventScroll: true });
  }
  /* A story page pauses play until the reader continues. */
  function openStory(pages, done) {
    story = { pages, i: 0, done };
    clearInput();
    $('hint').textContent = '点「继续」，或按空格 / 回车翻页。';
    renderStory();
  }
  function advanceStory() {
    if (!story) return;
    stopVoice();
    story.i++;
    if (story.i < story.pages.length) { renderStory(); return; }
    const done = story.done;
    story = null;
    $('overlay').textContent = '';
    if (game.state === 'play') $('hint').textContent = LEVELS[game.index].hint;
    if (done) done();
  }
  function renderStory() {
    const p = story.pages[story.i];
    playVoice(p.vo);
    const last = story.i === story.pages.length - 1;
    const more = p.next || (last ? '开始吧' : '继续');
    const ink = 'stroke="#141c52" stroke-width="4" paint-order="stroke"';
    const n = story.pages.length;
    const dots = n > 1 ? story.pages.map((_, k) => `<circle cx="${480 + (k - (n - 1) / 2) * 16}" cy="${p.art ? 52 + (p.title ? 34 : 0) + p.lines.length * 32 : 0}" r="4" fill="${k === story.i ? '#ffd27a' : '#8090d6'}"/>`).join('') : '';
    let body;
    const btn = (x, y) => `<g class="btn primary" role="button" tabindex="0" data-next="1" aria-label="${more}">
          <rect x="${x}" y="${y}" width="136" height="36" rx="9" fill="#27357f"/>${say(x + 68, y + 24, 17, '#f6f7ff', more)}</g>`;
    if (p.profile) {
      const card = (c, k) => {
        const x = 30 + k * 460, y = 70;
        let ty = y + 118;
        const rows = c.rows.map(([label, text]) => {
          const ls = wrap(text, 15);
          const out = `<text x="${x + 186}" y="${ty}" font-size="14" fill="#ffd27a">${label}</text>` + ls.map((l, j) => `<text x="${x + 226}" y="${ty + j * 21}" font-size="15" fill="#eef2ff">${l}</text>`).join('');
          ty += ls.length * 21 + 10;
          return out;
        }).join('');
        return `<rect x="${x}" y="${y}" width="440" height="380" rx="18" fill="#141c52" opacity=".9" stroke="#4a5aa6"/>
          <image href="${SRC('portrait_' + c.id)}" x="${x + 16}" y="${y + 16}" width="156" height="208" preserveAspectRatio="xMidYMid slice"/>
          <rect x="${x + 16}" y="${y + 16}" width="156" height="208" rx="6" fill="none" stroke="${c.color}" stroke-opacity=".6"/>
          <text x="${x + 186}" y="${y + 52}" font-size="32" fill="${c.color}">${c.name}</text>
          <text x="${x + 188}" y="${y + 80}" font-size="15" fill="#a9b6e2">${c.tag}</text>${rows}
          <path d="M${x + 40} ${y + 288}H${x + 400}" stroke="#4a5aa6"/>
          ${say(x + 220, y + 316, 13, '#a9b6e2', '心里的声音')}${say(x + 220, y + 346, 18, c.color, c.quote)}`;
      };
      body = `<image href="${SRC('bg0')}" width="960" height="520" preserveAspectRatio="none"/><rect width="960" height="520" fill="#0d1438" opacity=".7"/>
        ${say(480, 48, 30, '#ffd27a', '姐妹档案')}${PROFILE.map(card).join('')}
        <text x="40" y="490" font-size="14" fill="#cfe6ff">两姐妹待在一起时，霜霜会安下心来；分开太久，冰堡就会越来越冷。</text>${btn(800, 466)}`;
    } else if (p.clear) {
      const { got, secs, i } = p.clear;
      const labels = ['通关', '找到回忆', `${PAR[i]} 秒内（${secs} 秒）`];
      const stars = got.map((g, k) => `<g transform="translate(${360 + k * 120} 196)"><image href="${SRC('fx_star')}" x="-26" y="-26" width="52" height="52" opacity="${g ? 1 : .18}"/>
        <text y="44" text-anchor="middle" font-size="14" fill="${g ? '#ffe4a8' : '#7d88c0'}">${labels[k]}</text></g>`).join('');
      const [who, diary] = DIARY[i], ls = wrap(diary, Math.ceil([...diary].length / Math.ceil([...diary].length / 22)));
      body = `<rect width="960" height="520" fill="#0d1438" opacity=".45"/>
        <rect x="200" y="96" width="560" height="${300 + ls.length * 26}" rx="18" fill="#141c52" opacity=".92" stroke="#4a5aa6"/>
        ${say(480, 142, 32, '#ffd27a', `${LEVELS[i].name} 完成`)}${stars}
        <path d="M260 274H700" stroke="#4a5aa6"/>
        ${say(480, 304, 15, '#a9b6e2', who)}
        ${ls.map((l, k) => say(480, 334 + k * 26, 18, '#f6f7ff', l)).join('')}
        ${btn(412, 352 + ls.length * 26)}`;
    } else if (p.art) {
      const off = p.title ? 34 : 0;
      body = `<image href="${SRC(p.art)}" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
        <rect width="960" height="${84 + off + p.lines.length * 32}" fill="url(#storyTop)"/>
        ${p.title ? say(480, 42, 22, '#ffd27a', p.title, ink) : ''}
        ${p.lines.map((l, k) => say(480, 50 + off + k * 32, 21, '#f6f7ff', l, ink)).join('')}${dots}
        <g class="btn primary" role="button" tabindex="0" data-next="1" aria-label="${more}">
          <rect x="800" y="466" width="136" height="36" rx="9" fill="#27357f"/>${say(868, 490, 17, '#f6f7ff', more)}</g>`;
    } else {
      const top = 260 - (p.lines.length * 30 + 120) / 2;
      body = `<rect width="960" height="520" fill="#0d1438" opacity=".55"/>
        <rect x="170" y="${top}" width="620" height="${p.lines.length * 30 + 130}" rx="18" fill="#141c52" opacity=".9" stroke="#4a5aa6"/>
        ${say(480, top + 46, 30, '#ffd27a', p.title)}
        ${p.lines.map((l, k) => say(480, top + 86 + k * 30, 19, '#f6f7ff', l)).join('')}
        <g class="btn primary" role="button" tabindex="0" data-next="1" aria-label="${more}">
          <rect x="412" y="${top + p.lines.length * 30 + 76}" width="136" height="36" rx="9" fill="#27357f"/>${say(480, top + p.lines.length * 30 + 100, 17, '#f6f7ff', more)}</g>`;
    }
    $('overlay').innerHTML = `<g class="page">${body}</g>`;
    const b = $('overlay').querySelector('[data-next]');
    if (b) b.focus({ preventScroll: true });
  }
  function showChapter() {
    introShown = game.index;
    openStory([{ title: `第 ${game.index + 1} 间 · ${LEVELS[game.index].name}`, lines: CHAPTERS[game.index], vo: `c${game.index + 1}`, next: '出发' }],
      () => { levelT0 = game.time; ROOM_START[game.index].forEach(([k, d]) => speak(k, d, true)); });
  }
  function showClear() {
    const i = game.index, secs = Math.round(game.time - levelT0);
    const got = [true, memGot[i], secs <= PAR[i]];
    best[i] = best[i].map((b, k) => b || got[k]); saveBest();
    openStory([{ clear: { got, secs, i }, next: i + 1 < LEVELS.length ? '去下一个房间' : '去堆雪人' }], () => { game.clearT = .05; });
  }
  function showWin() {
    $('overlay').innerHTML = `<g class="page">
      <rect x="290" y="64" width="380" height="84" rx="14" fill="#141c52" opacity=".82"/>
      ${say(480, 104, 36, '#ffd27a', '雪人堆好啦！')}
      ${say(480, 134, 17, '#f6f7ff', '暖暖握住了姐姐的手……')}</g>`;
    $('hint').textContent = '雪人堆好了。';
    setMusic('end'); playVoice('win');
    setTimeout(() => {
      if (game.state !== 'win') return;
      openStory([{ art: 'story_thaw', vo: 'end', lines: ['霜霜终于明白：让冰雪听话的，不是害怕，而是爱。', '永冬一点点融化，港口的船又能出海了。'], next: '回到开头' }], () => {
        introShown = -1;
        game.state = 'title'; game.load(0); handleEvents(); showTitle();
        $('hint').textContent = '通关了。可以从序章再玩一次，或者直接选房间。';
      });
    }, 4600);
  }

  /* Input */
  const KEYS = {
    KeyA: ['frost', 'l'], KeyD: ['frost', 'r'], KeyS: ['frost', 'd'], KeyW: ['frost', 'jump'], KeyF: ['frost', 'act'],
    ArrowLeft: ['nuan', 'l'], ArrowRight: ['nuan', 'r'], ArrowDown: ['nuan', 'd'], ArrowUp: ['nuan', 'jump'],
    Enter: ['nuan', 'act'], NumpadEnter: ['nuan', 'act'], KeyL: ['nuan', 'act'],
  };
  function clearInput() {
    for (const id of ['frost', 'nuan']) Object.assign(game.input[id], { l: 0, r: 0, d: 0 });
    document.querySelectorAll('#touch button.on').forEach(b => b.classList.remove('on'));
  }
  addEventListener('blur', clearInput);

  function activate(target) {
    wakeAudio();
    if (story) { advanceStory(); return true; }
    if (target.closest && target.closest('[data-profile]')) { openStory([{ profile: true, next: '回到标题' }], showTitle); return true; }
    if (target.closest && target.closest('[data-story]')) { openStory(PROLOGUE, () => { game.start(0); handleEvents(); }); return true; }
    const room = target.closest && target.closest('[data-room]');
    if (room) { game.start(+room.dataset.room); handleEvents(); return true; }
    const btn = target.closest && target.closest('.btn');
    if (btn && btn.id === 'bRestart' && game.state === 'play') { game.start(game.index); handleEvents(); return true; }
    if (btn && btn.id === 'bSound') { toggleSound(); return true; }
    return false;
  }
  function toggleSound() {
    muted = !muted;
    if (audio) bus.master.gain.setTargetAtTime(muted ? 0 : 1, audio.currentTime, .05);
    $('tSound').textContent = muted ? '声音：关' : '声音：开';
  }
  $('stage').addEventListener('click', e => activate(e.target));

  addEventListener('keydown', e => {
    wakeAudio();
    if (story) {
      if (!e.repeat && ['Enter', 'NumpadEnter', 'Space', 'KeyW', 'ArrowUp', 'KeyF', 'KeyL', 'Escape'].includes(e.code)) { e.preventDefault(); advanceStory(); }
      return;
    }
    const focusBtn = document.activeElement && document.activeElement.closest && document.activeElement.closest('.btn');
    if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && focusBtn && (game.state !== 'play' || focusBtn.id === 'bSound' || focusBtn.id === 'bRestart')) {
      e.preventDefault();
      if (!e.repeat) { activate(focusBtn); if (game.state === 'play') focusBtn.blur(); }
      return;
    }
    if (e.code === 'KeyM' && !e.repeat) toggleSound();
    if (e.code === 'KeyR' && !e.repeat && game.state === 'play') { game.start(game.index); handleEvents(); }
    const k = KEYS[e.code];
    if (!k) return;
    e.preventDefault();
    const [id, what] = k;
    if (what === 'jump' || what === 'act') { if (!e.repeat) game.press(id, what); }
    else game.input[id][what] = 1;
  });
  addEventListener('keyup', e => {
    const k = KEYS[e.code];
    if (k && k[1].length === 1) game.input[k[0]][k[1]] = 0;
  });

  /* Touch */
  let active = 'frost';
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');
  function bindHold(id, key) {
    const b = $(id);
    const on = e => { e.preventDefault(); wakeAudio(); b.classList.add('on'); game.input[active][key] = 1; };
    const off = () => { b.classList.remove('on'); game.input.frost[key] = 0; game.input.nuan[key] = 0; };
    b.addEventListener('pointerdown', on);
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, off);
  }
  const bindTap = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); wakeAudio(); if (story) advanceStory(); else fn(); });
  bindHold('tLeft', 'l'); bindHold('tRight', 'r');
  bindTap('tJump', () => game.press(active, 'jump'));
  bindTap('tAct', () => game.press(active, 'act'));
  bindTap('tSwitch', () => {
    clearInput();
    active = active === 'frost' ? 'nuan' : 'frost';
    $('tSwitch').textContent = active === 'frost' ? '换成暖暖' : '换成霜霜';
  });
  $('tSwitch').textContent = '换成暖暖';

  /* Frame */
  function pickFrame(id, s, v, now) {
    if (game.state === 'clear' || game.state === 'win') return 'cheer';
    if (v.castT > 0) return 'cast';
    if (!s.ground) return s.vy < 0 ? 'jump' : 'fall';
    if (Math.abs(s.vx) > 1) return RUN[Math.floor(v.stride / 15) % RUN.length];
    return (now + (id === 'nuan' ? 1.7 : 0)) % 3.6 < .16 ? 'blink' : 'idle';
  }
  function drawSister(id, now, dt) {
    const s = game.sisters[id], v = view[id];
    v.castT = Math.max(0, v.castT - dt);
    v.stride = s.ground && Math.abs(s.vx) > 1 ? v.stride + Math.abs(s.vx) * dt : 0;
    const hidden = s.splash > 0;
    v.root.setAttribute('visibility', hidden ? 'hidden' : 'visible');
    v.shadow.setAttribute('visibility', hidden ? 'hidden' : 'visible');
    const f = pickFrame(id, s, v, now);
    if (f !== v.shown && (f === 'run1' || f === 'run4')) crunch(id === 'nuan' ? .8 : 1);
    if (!s.ground) v.airT += dt;
    else { if (v.airT > .18 && game.state === 'play' && !s.splash) thud(); v.airT = 0; }
    if (f !== v.shown) {
      if (v.shown) v.frames[v.shown].setAttribute('visibility', 'hidden');
      v.frames[f].removeAttribute('visibility');
      v.shown = f;
    }
    const cx = s.x + s.w / 2, feet = s.y + s.h;
    const moving = Math.abs(s.vx) > 1 && s.ground;
    const celebrating = game.state === 'clear' || game.state === 'win';
    const bob = moving ? 0 : celebrating ? Math.abs(Math.sin(now * 5 + (id === 'nuan' ? 1 : 0))) * 12 : 0;
    const breath = !moving && s.ground && !celebrating ? 1 + Math.sin(now * 2.2 + (id === 'nuan' ? 1 : 0)) * .012 : 1;
    v.idleT = s.ground && Math.abs(s.vx) < 1 && game.state === 'play' ? v.idleT + dt : 0;
    const other = game.sisters[id === 'frost' ? 'nuan' : 'frost'];
    const lookAt = (v.idleT > 2.5 || heart.togetherT > .5) && v.castT <= 0 ? (other.x > s.x ? 1 : -1) : s.dir;
    const dir = game.state === 'win' ? (Math.sin(now * 3 + (id === 'nuan' ? 1.5 : 0)) >= 0 ? 1 : -1) : lookAt;
    const shiver = id === 'frost' && heart.mood > .3 && game.state === 'play' ? Math.sin(now * 47) * heart.mood * 1.3 : 0;
    v.root.setAttribute('transform', `translate(${(cx + shiver).toFixed(1)} ${(feet - bob).toFixed(1)}) scale(${dir} ${breath.toFixed(3)})`);
    v.shadow.setAttribute('cx', cx.toFixed(1));
    v.shadow.setAttribute('cy', (feet + 2).toFixed(1));
    v.mark.setAttribute('visibility', isTouch && active === id && game.state === 'play' ? 'visible' : 'hidden');
  }
  function drawItemBob(now) {
    const nodes = $('items').children;
    game.items.forEach((it, i) => {
      const n = nodes[i];
      if (!n) return;
      if (it.got) { n.setAttribute('visibility', 'hidden'); return; }
      const sway = Math.sin(now * 1.6 + i) * 6;
      n.setAttribute('transform', `translate(${it.x} ${(it.y + Math.sin(now * 2.4 + i) * 3).toFixed(1)}) rotate(${it.kind === 'h' ? 0 : sway.toFixed(1)})`);
    });
  }

  const STEP = 1 / 120;
  let last = 0, acc = 0, shownBlocks = -1;
  function frame(ms) {
    const dt = Math.min(.05, (ms - last) / 1000 || 0);
    last = ms; acc += dt;
    if (story) acc = 0;
    while (acc >= STEP) { game.step(STEP); acc -= STEP; }
    handleEvents();
    if (game.blocks.length !== shownBlocks) { shownBlocks = game.blocks.length; drawTiles(); }
    const now = ms / 1000;
    drawSister('frost', now, dt);
    drawSister('nuan', now, dt);
    const n = game.sisters.nuan;
    lanternGlow.setAttribute('cx', (n.x + n.w / 2 + n.dir * 6).toFixed(1));
    lanternGlow.setAttribute('cy', (n.y + n.h - 26).toFixed(1));
    lanternGlow.setAttribute('visibility', n.splash > 0 ? 'hidden' : 'visible');
    lanternGlow.setAttribute('opacity', (.72 + Math.sin(now * 7) * .08).toFixed(2));
    const fr = game.sisters.frost;
    frostGlow.setAttribute('cx', (fr.x + fr.w / 2).toFixed(1));
    frostGlow.setAttribute('cy', (fr.y + fr.h - 34).toFixed(1));
    frostGlow.setAttribute('visibility', fr.splash > 0 ? 'hidden' : 'visible');
    drawItemBob(now);
    updateMood(dt);
    updateMemory(now);
    drawTalk(dt);
    drawSparks(dt);
    drawHud();
    if (game.state === 'win' && Math.random() < .25) burst(Math.random() * 960, 200 + Math.random() * 180, ['star', 'heart', 'flake'][Math.floor(Math.random() * 3)], 2, 90);
    requestAnimationFrame(frame);
  }

  /* Decode every painting first, so frames never flash in empty. */
  const names = [...new Set(['key', 'story_prologue', 'story_winter', 'story_thaw', 'portrait_frost', 'portrait_nuan', ...LINES.memory.map(m => m.art), 'brick', 'water', 'pinkice', 'frozen', 'iceblock', 'door_open', 'door_closed', 'ball', 'two', 'snowman', 'flake', 'heart', 'gate', 'plate_up', 'plate_down', 'shelf0', 'shelf1', 'shelf2', 'drift0', 'drift1', ...ROOMS.map(r => r.bg), ...Object.keys(SIZES).filter(k => k.startsWith('fx_')), ...Object.keys(SIZES).filter(k => /^(frost|nuan)_/.test(k))])];
  const loads = names.map(n => { const i = new Image(); i.src = SRC(n); return i.decode().catch(() => {}); });

  buildHud();
  game.load(0);
  handleEvents();
  game.state = 'title';
  showTitle();
  const patience = new Promise(ok => setTimeout(ok, 1500));
  Promise.race([Promise.all(loads), patience]).finally(() => requestAnimationFrame(frame));
})();
</script>
